<script>const CHAPTERS = [
{title:'電腦怎麼放資料？',subtitle:'位元、位址、參照、連續空間與快取區域性',tag:'硬體地基',lab:'array',analogy:'把 RAM 想成一排有門牌號碼的格子。資料結構是我們安排物品的方式；演算法是找、放、拿物品的程序。',limit:'真實記憶體是位元組定址且受虛擬記憶體管理；「一格一數字」只是抽象模型。',sections:[['資料與位址','CPU 能讀寫的是位元組（byte），每個可定址位置具有位址。變數名稱是給程式設計師看的，執行時會映射到暫存器或記憶體位置。資料型別決定解讀位元的方法。'],['連續與分散','陣列通常需要連續的元素儲存空間，因此能以基底位址加上固定偏移直接存取。鏈結串列則靠指標連接不同位置的節點，較適合局部插入、卻不具直接的第 i 個元素存取。'],['CPU Cache 為何重要','CPU 通常以快取行（cache line）取得多個相鄰位元組；連續走訪陣列通常具有良好的空間區域性，因此 Big-O 同為 O(n) 的兩種程式，實際效能仍可能差很多。']],code:'// C：觀察陣列元素地址間距\n#include <stdio.h>\nint main(void) {\n    int a[3] = {10, 20, 30};\n    for (int i = 0; i < 3; i++)\n        printf("%p: %d\\n", (void*)&a[i], a[i]);\n}',q:[['陣列 a[i] 能直接定位元素，核心原因是？',['元素預先排序','元素有固定大小且連續排列','所有元素都在 CPU 暫存器'],1,'以 base + i × sizeof(element) 計算位址。'],['為什麼陣列走訪常比鏈結串列快？',['陣列永遠是 O(1)','陣列通常具較好的記憶體區域性','鏈結串列無法走訪'],1,'兩者順序走訪都是 O(n)，但快取效應不同。'],['指標儲存的主要資訊是？',['某個位置的位址','變數的中文名稱','CPU 執行速度'],0,'指標值代表一個地址或特殊空值。']]},
{title:'如何衡量演算法？',subtitle:'Big-O、Ω、Θ、最壞與攤銷分析',tag:'分析基礎',lab:'complexity',analogy:'走 10 步找門牌跟走 1 萬步不同。Big-O 關心的是「街道變長時，需要做的工作如何增加」，不只是碼表上的秒數。',limit:'Big-O 是漸近上界，不會告訴你常數因素、快取行為、資料分佈，也不等於所有情況都一定跑那麼久。',sections:[['輸入規模與基本操作','先定義 n 是什麼，再數關鍵步驟。單一迴圈常為 n 次、兩層各跑 n 次的巢狀迴圈常為 n² 次、每次折半的搜尋約 log₂n 次。'],['O、Ω 與 Θ','O(g(n)) 表示漸近上界，Ω(g(n)) 為漸近下界；同時具上下界則為 Θ(g(n))。分析時要說清楚最壞、平均、最佳或攤銷情境。'],['時間換空間','雜湊表常透過額外儲存空間換取平均 O(1) 查詢；排序後的陣列可做 O(log n) 二分搜尋，但維護排序本身也有成本。']],code:'def contains_pair(nums, target):\n    seen = set()                     # O(n) 額外空間\n    for x in nums:                   # O(n) 次迴圈\n        if target - x in seen:       # 平均 O(1)\n            return True\n        seen.add(x)\n    return False',q:[['兩個長度 n 的巢狀迴圈通常是？',['O(n)','O(n log n)','O(n²)'],2,'n × n = n²。'],['將資料每次減半的迴圈通常需要？',['O(log n)','O(n²)','O(2ⁿ)'],0,'約 log₂n 次減半就縮到 1。'],['O(n) 一定比 O(n log n) 快嗎？',['任何 n 都是','只比較漸近成長率，不能忽略常數與輸入規模','視 Python 版本而定'],1,'小 n 與不同常數因素可能改變實測結果。']]},
{title:'陣列與字串',subtitle:'索引、插入成本、動態陣列、雙指標',tag:'線性結構',lab:'array',analogy:'陣列像編號整齊的置物櫃。第 7 格很好找；若要在中間多塞一格，後面很多格可能得往右搬。',limit:'Python list 是動態陣列而不是 C 的固定陣列；append() 的攤銷 O(1) 不代表每次都不用搬資料。',sections:[['隨機存取 O(1)','同型陣列的元素地址能直接算出，故索引讀取通常 O(1)；但找一個未知值則需要 O(n) 線性搜尋（若沒有額外索引）。'],['插入與刪除','在陣列中間插入通常要位移後續元素，O(n)；末端 append 在動態陣列通常為攤銷 O(1)。擴容時需分配更大的連續區並複製資料。'],['雙指標與滑動視窗','雙指標常用於已排序數列的兩數和；滑動視窗可維護連續區段狀態，避免每個區間重算，很多情況能從 O(n²) 優化到 O(n)。']],code:'def two_sum_sorted(a, target):\n    left, right = 0, len(a) - 1\n    while left < right:\n        total = a[left] + a[right]\n        if total == target: return left, right\n        if total < target: left += 1\n        else: right -= 1\n    return None',q:[['一般動態陣列中間插入成本為？',['O(1)','O(n)','O(log n)'],1,'要位移後續元素。'],['Python list.append 平均攤銷複雜度？',['O(1)','O(n log n)','O(n²)'],0,'幾何擴容攤銷大量追加。'],['雙指標 two-sum（向內逼近）通常需要哪個條件？',['資料已排序','必須是二元樹','元素全部不同'],0,'利用排序順序決定指標方向。']]},
{title:'鏈結串列 Linked List',subtitle:'節點、指標、單向與雙向、插入刪除',tag:'線性結構',lab:'linked',analogy:'像尋寶遊戲：每張紙條告訴你下一張紙條在哪裡。插一張只要更改連結，但要找第 100 張，通常只能一張張走。',limit:'「已知節點」插入 O(1) 與「先找到插入位置」O(n) 要分開計算；無法直接獲得某個索引節點。',sections:[['節點由什麼構成','典型單向鏈結串列節點含 value 與 next 指標；頭節點（head）是進入串列的入口，尾節點 next 指向 null。'],['指標重連順序','在某節點 prev 後插入 new：先讓 new.next = prev.next，再令 prev.next = new。順序反了若沒有保留原 next，可能遺失後續串列。'],['取捨','已知前驅節點的插入 O(1)；找第 i 個位置 O(n)，額外指標占記憶體，CPU cache locality 通常比陣列差。']],code:'class Node:\n    def __init__(self, value, nxt=None):\n        self.value = value\n        self.next = nxt\n\nhead = Node(10, Node(20, Node(30)))\nnew = Node(15)\nnew.next = head.next\nhead.next = new',q:[['單向串列取得第 i 個節點通常是？',['O(1)','O(log n)','O(n)'],2,'必須沿 next 走訪。'],['在已知 prev 節點之後插入新節點為？',['O(1)','O(n²)','O(log n)'],0,'只要改動固定數量的連結。'],['重接 next 指標時最怕什麼？',['資料已排序','遺失原本後繼節點的連結','節點地址太小'],1,'更新前先保存或先連接原後繼。']]},
{title:'堆疊、佇列與 Deque',subtitle:'LIFO、FIFO、括號驗證與單調結構',tag:'線性結構',lab:'stack',analogy:'堆疊像盤子，一次拿最上面（LIFO）；佇列像排隊，先來先服務（FIFO）。限制操作順序，反而能保證某些演算法正確。',limit:'Python list.pop(0) 是 O(n)；若需真正 FIFO，應考慮 collections.deque。',sections:[['Stack：後進先出','push、pop、peek 一般是 O(1)。函式呼叫堆疊、Undo、括號配對、DFS 都會用到 LIFO 特性。'],['Queue：先進先出','enqueue、dequeue 一般是 O(1)；BFS 透過佇列逐層擴張。固定容量的環形佇列可用 head/tail 與 modulo 管理位置。'],['單調堆疊','利用遞增或遞減的堆疊維持候選元素，可以在線性時間求下一個更大元素；每個元素最多進出堆疊各一次。']],code:'from collections import deque\n\ndef valid_parentheses(s):\n    stack = []\n    pair = {")": "(", "]": "[", "}": "{"}\n    for c in s:\n        if c in "([{": stack.append(c)\n        elif c in pair:\n            if not stack or stack.pop() != pair[c]:\n                return False\n    return not stack',q:[['BFS 常用哪個結構？',['Stack','Queue','Heap'],1,'佇列維持逐層先後順序。'],['Stack 的出入規則是？',['FIFO','隨機','LIFO'],2,'最後放入的先取出。'],['Python 中高效率隊首移除的常見工具？',['collections.deque','list.pop(0)','str.join'],0,'deque.popleft 是 O(1)。']]},
{title:'遞迴與呼叫堆疊',subtitle:'Base Case、遞迴樹、分治與 Stack Overflow',tag:'演算法思維',lab:'recursion',analogy:'解俄羅斯套娃：每個娃娃都交給更小的娃娃處理，直到最裡層不再分解，再一層層交回答案。',limit:'遞迴不是免費魔法：每次呼叫通常都需要 stack frame；Python 有遞迴深度限制，遞迴也不保證比迭代快。',sections:[['兩個不可缺的部分','Base case 終止條件，以及使問題規模逐步縮小的 recursive case。缺少其中之一，容易造成無窮呼叫。'],['從遞迴樹看複雜度','樹狀分裂的遞迴可能生成大量重複子問題。斐波那契 naïve recursion 約為指數時間，加入 memoization 後可達 O(n)。'],['分治三步','Divide 把大問題切小；Conquer 遞迴解子問題；Combine 合併結果。Merge Sort 正是典型 O(n log n) 的分治演算法。']],code:'def factorial(n):\n    if n < 0: raise ValueError("n must be >= 0")\n    if n <= 1: return 1  # base case\n    return n * factorial(n - 1)\n\nprint(factorial(4))  # 24',q:[['沒有 base case 的遞迴最常導致？',['自動提速','無法停止的遞迴呼叫','O(1) 記憶體'],1,'必須確保遞迴終止。'],['遞迴函式一般會使用哪種記憶體資源？',['呼叫堆疊','檔案系統','網卡'],0,'每次呼叫會建立相應的 stack frame（實作視語言而定）。'],['有重疊子問題的遞迴可用什麼避免重算？',['隨機排序','Memoization','加深遞迴'],1,'快取已算過的子問題答案。']]},
{title:'搜尋與二分搜尋',subtitle:'不變量、邊界、lower_bound、搜尋空間',tag:'演算法思維',lab:'search',analogy:'猜 1 到 100 的數字，每次問「比 50 大嗎？」就能淘汰一半答案。關鍵不是猜得快，而是任何一步都不排除正確答案。',limit:'二分搜尋需要排序或單調性，不能直接對亂序陣列使用；off-by-one 的邊界錯誤非常常見。',sections:[['線性 vs 二分','線性搜尋在未知順序資料最壞 O(n)；二分搜尋在有序資料透過每次排除半個範圍，最壞 O(log n)。'],['迴圈不變量','設定搜尋範圍 [lo, hi]（含端點），每次依比較結果保證：若答案存在，仍留在候選區間中。這是演算法正確性證明的核心。'],['邊界搜尋','lower_bound 是第一個 >= target 的位置，可以處理重複數值。常採半開區間 [lo, hi)，避免邊界更新混亂。']],code:'def binary_search(a, target):\n    lo, hi = 0, len(a) - 1\n    while lo <= hi:\n        mid = lo + (hi - lo) // 2\n        if a[mid] == target: return mid\n        if a[mid] < target: lo = mid + 1\n        else: hi = mid - 1\n    return -1',q:[['Binary Search 的先決條件通常是？',['陣列有序或判定函式具單調性','資料是鏈結串列','只能有奇數長度'],0,'每次排除一半必須有正當依據。'],['在 1024 個有序元素中二分搜尋最多約幾輪？',['10 至 11 輪','512 輪','1024 輪'],0,'log₂1024=10；比較輪數隨命中與實作定義略異。'],['lo <= hi 的閉區間實作中，若 a[mid] < target，通常？',['hi = mid','lo = mid + 1','lo = mid - 1'],1,'排除 mid 與其左邊，因為它們都太小。']]},
{title:'排序：比較與交換',subtitle:'Bubble、Selection、Insertion、穩定性',tag:'排序家族',lab:'sort',analogy:'像整理手牌。插入排序每拿到一張就放進已排好的部分；泡沫排序反覆讓相鄰逆序的牌交換位置。',limit:'所有 O(n²) 排序在小資料上不一定慢；但當 n 變大，平方成長會迅速變得昂貴。',sections:[['三種基本排序','Bubble 反覆交換相鄰逆序；Selection 每輪找最小值放前方；Insertion 維持已排序前綴，把新元素插入正確位置。'],['最好與最壞','Insertion 在幾乎排序好的資料接近 O(n)，逆序時 O(n²)；Selection 通常固定 O(n²) 比較次數，交換次數則較少。'],['穩定排序','同鍵值元素的原始相對順序是否保留？這對「先依姓名排序，再依成績穩定排序」等多鍵排序很重要。']],code:'def insertion_sort(a):\n    a = a[:]  # 不修改呼叫者的清單\n    for i in range(1, len(a)):\n        key, j = a[i], i - 1\n        while j >= 0 and a[j] > key:\n            a[j + 1] = a[j]\n            j -= 1\n        a[j + 1] = key\n    return a',q:[['Insertion Sort 對已排序資料的最好情況？',['O(n)','O(n²)','O(log n)'],0,'每個元素只需做常數次比較。'],['穩定排序是指？',['記憶體永不超出','相同鍵值元素保留原相對次序','一定 O(n log n)'],1,'穩定性與時間複雜度無直接必然關係。'],['Selection Sort 的典型比較複雜度？',['O(n log n)','O(n²)','O(1)'],1,'每輪掃描未排序區段找最小值。']]},
{title:'分治排序與比較下界',subtitle:'Merge Sort、Quick Sort、Partition',tag:'排序家族',lab:'sort',analogy:'先把一副牌分成左右兩小堆，各自排好，再像兩條有序隊伍一樣合併；這就是 Merge Sort 的精髓。',limit:'Quick Sort 平均 O(n log n)，不適合直接說「保證 O(n log n)」；糟糕樞紐可落入 O(n²)。',sections:[['Merge Sort','每層合併需 O(n)，切分高度 O(log n)，所以總時間 Θ(n log n)，典型陣列實作還需要 O(n) 輔助空間。'],['Quick Sort','選取 pivot，partition 成左右兩區，再遞迴排序。平均 O(n log n)，最差 O(n²)；隨機化或良好 pivot 策略可降低退化機率。'],['比較排序的下界','只靠兩元素間比較的通用排序，可由決策樹推導最壞 Ω(n log n)；Counting Sort、Radix Sort 利用其他資料假設，可不受此比較模型下界限制。']],code:'def merge_sort(a):\n    if len(a) <= 1: return a\n    mid = len(a) // 2\n    left = merge_sort(a[:mid])\n    right = merge_sort(a[mid:])\n    out = []\n    i = j = 0\n    while i < len(left) and j < len(right):\n        if left[i] <= right[j]:\n            out.append(left[i]); i += 1\n        else:\n            out.append(right[j]); j += 1\n    return out + left[i:] + right[j:]',q:[['典型 Merge Sort 時間？',['O(n log n)','O(n²)','O(log n)'],0,'每層合併 O(n)，共 O(log n) 層。'],['Quick Sort 最差情況可以到？',['O(1)','O(n²)','O(log n)'],1,'極不平衡的 partition 導致平方時間。'],['比較排序的通用最壞下界？',['Ω(log n)','Ω(n log n)','Ω(n²)'],1,'決策樹至少要區分 n! 種排列。']]},
{title:'雜湊表 Hash Table',subtitle:'Hash Function、碰撞、負載率與 Resize',tag:'索引結構',lab:'hash',analogy:'像用姓名算出一個置物櫃號碼。不同人可能分到同一櫃，因此需要碰撞處理，櫃子太擠還得擴容。',limit:'雜湊查找平均 O(1) 依賴良好 hash 分散、負載率與碰撞處理；最壞仍可能 O(n)，而迭代順序不等於排序。',sections:[['雜湊函式與桶','h(key) 將鍵映射到表索引；若兩個鍵落同個 bucket 即 collision。碰撞不可避免，因為鍵空間通常遠大於桶數。'],['Chaining 與 Open Addressing','分離鏈結法每桶放一串元素；開放定址在表內探測其他位置。刪除、resize、負載率 α 都會影響正確性與效率。'],['何時適合','集合存在性檢查、去重、快取、頻率統計、Two Sum 都常適合 hash map；需要排序或區間搜尋時有序樹可能更有利。']],code:'def counts(words):\n    freq = {}\n    for word in words:\n        freq[word] = freq.get(word, 0) + 1\n    return freq\n\nprint(counts(["a", "b", "a"]))',q:[['不同 key 得到相同 bucket 稱為？',['Overflow','Collision','Deadlock'],1,'雜湊碰撞需要額外策略處理。'],['Hash Table 查找通常的平均時間？',['O(1)','O(n²)','O(log n)'],0,'前提是負載與碰撞處理合理。'],['當負載率太高，常採取什麼措施？',['擴容與 rehash','停止使用鍵值','永不處理'],0,'擴容降低每桶擁擠程度。']]},
{title:'樹與二元搜尋樹',subtitle:'Root、Height、Traversal、BST Invariant',tag:'階層結構',lab:'bst',analogy:'像組織圖，每個人可以有下屬。BST 額外規定：左邊的值較小、右邊的值較大，所以可以沿單一路徑找資料。',limit:'沒有平衡機制的 BST 遇到依序插入資料，會退化成鏈結串列，查找 O(n) 而非 O(log n)。',sections:[['樹的關鍵術語','Root 根、Parent 父、Child 子、Leaf 葉、Depth 深度、Height 高度；樹不存在環，節點數為 V 時邊數為 V−1（非空樹）。'],['BST 不變量','每個節點左子樹中的值都小於它，右子樹都大於它（重複鍵另訂規則）。Inorder 遍歷可得到遞增結果。'],['平衡與退化','Balanced BST 讓高度維持 O(log n)，因而搜尋、插入、刪除可維持 O(log n)。AVL 與 Red-Black Tree 是常見例子。']],code:'class Node:\n    def __init__(self, v):\n        self.v, self.left, self.right = v, None, None\n\ndef search(root, key):\n    while root is not None:\n        if key == root.v: return True\n        root = root.left if key < root.v else root.right\n    return False',q:[['BST inorder 走訪通常產生？',['隨機數列','遞增排序','反向層級排序'],1,'左 → 根 → 右。'],['不平衡 BST 最差搜尋可能是？',['O(n)','O(1)','O(log log n)'],0,'退化為一條長鏈時高度 O(n)。'],['一棵有 9 個節點的非空樹有幾條邊？',['8','9','10'],0,'樹的邊數 = 節點數 − 1。']]},
{title:'堆積與優先佇列',subtitle:'Heap Property、Heapify、Top-K',tag:'階層結構',lab:'heap',analogy:'急診掛號按緊急度叫號，並非單純排隊；Heap 能快速找出「目前最重要的那位」，不需要所有人完整排序。',limit:'二元堆積不是 BST，也不是整體有序陣列；只有父子之間維持 heap property。',sections:[['二元堆積','Max-Heap 父節點 ≥ 子節點；Min-Heap 父節點 ≤ 子節點。完全二元樹能緊密存在陣列中，索引 i 的孩子通常是 2i+1 和 2i+2。'],['操作複雜度','peek 根 O(1)；insert / pop 根需上浮或下沉，O(log n)；對 n 個元素自底向上 heapify 可做到 O(n)。'],['實際用途','排程、事件模擬、Dijkstra 的優先佇列、維持 Top-K、K-way merge 等都會用到 heap。']],code:'import heapq\npq = []\nheapq.heappush(pq, (3, "低優先"))\nheapq.heappush(pq, (1, "高優先"))\nheapq.heappush(pq, (2, "中優先"))\nwhile pq:\n    print(heapq.heappop(pq))',q:[['Min Heap 的根保存？',['最小值','最大值','中位數'],0,'根是整棵 Min-Heap 的最小值。'],['Heap 插入一般是？',['O(1) 保證','O(log n)','O(n²)'],1,'新節點可能一路上浮到根。'],['堆積陣列索引 i 的左孩子是？',['i+1','2i+1','i//2'],1,'採 0-based index。']]},
{title:'圖的表示與遍歷',subtitle:'Adjacency List、BFS、DFS、連通性',tag:'網路結構',lab:'graph',analogy:'城市是節點，道路是邊；BFS 像一圈圈擴大的漣漪，DFS 像先一路走到底再回頭找岔路。',limit:'BFS 在無權圖求「邊數最少」的路徑；有權重且權重不一時，不能直接當作最小總成本路徑。',sections:[['Graph 的組成','圖 G=(V,E) 包含 vertices 與 edges，可有向／無向、加權／無權。Adjacency List 空間通常為 O(V+E)，較適合稀疏圖。'],['BFS 與 DFS','BFS 透過 Queue 按距離層級拜訪；DFS 透過 Stack/Recursion 深入後回溯。兩者用 adjacency list 都可做到 O(V+E)。'],['Visited 為何必要','若圖有環而沒有 visited 判斷，遍歷可能無限反覆拜訪；visited 應在適當時機設定，避免重複入列。']],code:'from collections import deque\ndef bfs(g, start):\n    q, seen, order = deque([start]), {start}, []\n    while q:\n        u = q.popleft()\n        order.append(u)\n        for v in g[u]:\n            if v not in seen:\n                seen.add(v); q.append(v)\n    return order',q:[['BFS 最常搭配？',['Queue','Heap only','Binary Tree only'],0,'FIFO 保證逐層走訪。'],['Adjacency List 做一次 BFS 的複雜度？',['O(V+E)','O(VE²)','O(1)'],0,'每個節點與邊至多以常數次處理。'],['在無權圖求最少邊數路徑優先選？',['BFS','普通 Insertion Sort','Quick Sort'],0,'BFS 按路徑長度（邊數）逐層探索。']]},
{title:'最短路徑演算法',subtitle:'Dijkstra、Relaxation、非負權重',tag:'圖論進階',lab:'graph',analogy:'導航系統先確定目前已知距離最近的城市，再嘗試經由它更新鄰居距離。每一次更新都叫做 relaxation。',limit:'標準 Dijkstra 假設邊權重非負；有負邊應考慮 Bellman–Ford 等演算法。',sections:[['距離估計','維護 dist[v]，起點 dist[start]=0，其餘為 ∞；探索邊 (u,v,w) 時若 dist[u]+w < dist[v]，就更新 dist[v]。'],['貪心的理由','在非負邊權重前提下，從未確定的節點中挑目前距離最小者，可以確定其最短距離；用 Priority Queue 高效選擇候選節點。'],['常見複雜度','以 Binary Heap 與 adjacency list，常見實作為 O((V+E)log V)（細節視 heap 與重複入列策略而定）。']],code:'import heapq\ndef dijkstra(g, start):\n    dist = {v: float("inf") for v in g}\n    dist[start] = 0\n    pq = [(0, start)]\n    while pq:\n        d, u = heapq.heappop(pq)\n        if d != dist[u]: continue\n        for v, w in g[u]:\n            if d + w < dist[v]:\n                dist[v] = d + w\n                heapq.heappush(pq, (dist[v], v))\n    return dist',q:[['Dijkstra 的典型邊權要求？',['非負權重','只能是 0','必須是負權重'],0,'負邊會破壞已確定節點距離的依據。'],['Relaxation 代表？',['刪掉所有邊','發現更短路徑並更新距離','反轉圖的方向'],1,'dist[v] 取更小值。'],['優先佇列幫忙做什麼？',['取目前最小候選距離','將邊反向','求最大公因數'],0,'優先取目前估計距離最小者。']]},
{title:'貪心演算法',subtitle:'局部最優、交換論證、區間排程',tag:'演算法策略',lab:'greedy',analogy:'你要在一天內參加最多場不重疊活動，挑「最早結束」的活動，會留最多時間給後面；但不是每個問題都能只看眼前。',limit:'「每一步選看起來最好」不保證全域最佳；必須有反例排除或交換論證。',sections:[['Greedy Choice Property','若某問題存在一個最佳解包含特定局部最優選擇，而且剩餘問題保留最優子結構，就可能使用貪心法。'],['區間排程','要選最多個不重疊區間，把活動依結束時間排序，每次選第一個開始時間不早於上個結束時間的活動；可用交換論證證明。'],['常見失敗案例','一般硬幣面額不一定適合貪心找最少硬幣數。面額 [1,3,4] 換 6，貪心 4+1+1 用 3 枚，最優為 3+3 用 2 枚。']],code:'def max_activities(activities):\n    chosen, end = [], float("-inf")\n    for start, finish in sorted(activities, key=lambda x:x[1]):\n        if start >= end:\n            chosen.append((start, finish))\n            end = finish\n    return chosen',q:[['區間排程選最多活動，最常見的貪心依據？',['最早開始','最早結束','最長活動'],1,'最早結束能留下最多後續空間。'],['任何貪心策略都一定能得到全域最優？',['一定','不一定，需證明','只要 Python 寫就會'],1,'局部最優需要正確性證明。'],['面額 [1,3,4] 換 6 的最少硬幣數？',['2','3','4'],0,'3+3 最優，展示盲目貪心的反例。']]},
{title:'動態規劃 Dynamic Programming',subtitle:'State、Transition、Memoization、Tabulation',tag:'演算法策略',lab:'dp',analogy:'爬樓梯每一步只能上 1 或 2 階，要到第 8 階的方法數，可由「到第 7 階」與「到第 6 階」的方法數相加，而不是每次重新數整棵可能性樹。',limit:'DP 不等於單純「用陣列」；重點在清楚定義狀態與轉移，並確認子問題重疊與最佳子結構。',sections:[['四步推導','① 定義 dp[i] 的物理意義；② 寫出轉移方程；③ 找 base cases；④ 決定計算順序、答案位置與空間壓縮可能性。'],['Memoization 與 Tabulation','自頂向下 memoization 使用遞迴與快取；自底向上 tabulation 用正確拓撲順序填表。兩者可有相同複雜度，但堆疊空間不同。'],['0/1 Knapsack','dp[i][w] 為考慮前 i 個物品、容量 w 的最大價值；第 i 個物品只可取或不取，轉移比較兩種選擇。']],code:'def climb(n):\n    if n < 0: return 0\n    a, b = 1, 1           # dp[0], dp[1]\n    for _ in range(2, n + 1):\n        a, b = b, a + b\n    return b if n > 0 else a',q:[['DP 的核心通常包括？',['重疊子問題與狀態轉移','只能使用遞迴','只適用於排序'],0,'明確定義 state/transition 是關鍵。'],['爬樓梯（每次 1 或 2 階）的轉移？',['dp[n]=dp[n-1]+dp[n-2]','dp[n]=n²','dp[n]=2n'],0,'最後一步不是從 n−1 就是 n−2 走來。'],['Memoization 是？',['存下已算過的子問題答案','強制先排序','交換兩個指標'],0,'用空間避免重複工作。']]},
{title:'Union-Find 與最小生成樹',subtitle:'Disjoint Set、Path Compression、Kruskal',tag:'圖論進階',lab:'union',analogy:'把學生分成幾個朋友圈。Union 讓兩個圈子合併，Find 回答兩人是否屬於同一圈；每個人沿代表鏈回到圈子的代表。',limit:'Union-Find 適合合併與連通性查詢，不是求任意兩點的實際路徑；攤銷接近常數仍有數學條件。',sections:[['Disjoint Set 核心操作','Find(x) 回傳集合代表；Union(a,b) 合併兩集合。以 parent 陣列儲存森林，初始每個元素自己是根。'],['兩項優化','Path Compression 路徑壓縮使 Find 經過的節點直接靠近根；Union by Size/Rank 避免樹過高。搭配使用可達攤銷 O(α(n))。'],['Kruskal MST','把加權無向圖的邊由小到大排序，遇到連接不同集合的邊就選取並 Union；形成無環且總權重最小的生成樹（適用連通圖）。']],code:'def find(parent, x):\n    if parent[x] != x:\n        parent[x] = find(parent, parent[x])\n    return parent[x]\n\ndef union(parent, a, b):\n    ra, rb = find(parent, a), find(parent, b)\n    if ra == rb: return False\n    parent[rb] = ra\n    return True',q:[['Find(x) 會傳回？',['集合代表','元素數值必加一','最短路徑長度'],0,'透過代表判斷是否同一集合。'],['路徑壓縮的目的是？',['增加高度','縮短後續 Find 路徑','把圖改成有向'],1,'讓查找變得更快。'],['Kruskal 選邊時如何避免環？',['檢查兩端是否已同集合','只看最大權重','每次都選同一點'],0,'兩端若已同集合，加邊會形成環。']]},
{title:'綜合實戰：選對資料結構',subtitle:'由限制條件推導設計、測試與取捨',tag:'能力驗收',lab:'complexity',analogy:'工具箱裡有螺絲起子、板手和電鑽。不是最複雜的工具最厲害，而是理解問題限制，選對工具。',limit:'選型不是背最佳複雜度表：須一併考慮資料量、記憶體、更新比例、順序需求、最差情境與效能量測。',sections:[['先定義操作分布','頻繁索引選動態陣列；頻繁判斷集合成員選雜湊表；反覆取最小值選 Min-Heap；維持有序區間可考慮平衡樹。'],['先證明，再優化','對每個演算法，寫出輸入、輸出、前提、不變量與終止條件；針對空集合、單元素、重複元素、負數、極大輸入建測試。'],['複雜度不只是一行 O','分析時間、輔助空間、遞迴深度、是否穩定、是否就地修改與平均／最差差異；最後以實測 profiler 驗證瓶頸。']],code:'def choose_tool(task):\n    # 僅為選型示意，不是可直接套用的通用系統\n    options = {\n        "random_index": "dynamic array",\n        "membership": "hash set",\n        "take_min": "min heap",\n        "shortest_unweighted": "BFS",\n        "shortest_nonnegative": "Dijkstra",\n    }\n    return options.get(task, "analyze constraints first")',q:[['頻繁取得最小優先權任務，應考慮？',['Heap','Linked List 從頭掃描','字串串接'],0,'Heap 的 peek O(1)、pop O(log n)。'],['無權圖求最少邊數路徑，通常選？',['BFS','Selection Sort','Hashing only'],0,'BFS 從近到遠逐層展開。'],['選型最先應了解什麼？',['真正的操作需求與前提','語言 logo','程式碼行數'],0,'從需求、限制與操作頻率推導選型。']]}
];
</script><script>'use strict';
const $=id=>document.getElementById(id);
const esc=x=>String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const getStore=(key,fallback)=>{try{return JSON.parse(localStorage.getItem(key))??fallback}catch{return fallback}};
let completed=getStore('dsa.complete',{}),answers=getStore('dsa.answers',{}),notes=getStore('dsa.notes',{}),mode=getStore('dsa.theme','dark');
if(mode==='light')document.documentElement.classList.add('light');
let current=0,activeTab='lesson',frames=[],frameIdx=0,labOptions={},lastLab='';
const persist=()=>{try{localStorage.setItem('dsa.complete',JSON.stringify(completed));localStorage.setItem('dsa.answers',JSON.stringify(answers));localStorage.setItem('dsa.notes',JSON.stringify(notes))}catch(e){console.warn('Storage unavailable',e)}};
function pageRoute(){let parts=location.hash.match(/^#\/chapter\/(\d+)(?:\/(lesson|lab|quiz|notes))?$/);if(!parts){renderHome();return}current=Math.max(0,Math.min(CHAPTERS.length-1,Number(parts[1])));activeTab=parts[2]||'lesson';renderChapter()}
const navigate=(c,tab='lesson')=>{location.hash=`#/chapter/${c}/${tab}`;if(location.hash===`#/chapter/${c}/${tab}`){pageRoute();window.scrollTo({top:0,behavior:'instant'})}};
function renderNav(){let done=Object.keys(completed).filter(i=>completed[i]).length;$('progressText').textContent=`${done} / ${CHAPTERS.length}`;$('progressBar').style.width=`${done/CHAPTERS.length*100}%`;$('chapterNav').innerHTML=CHAPTERS.map((c,i)=>`<button class="navCh ${location.hash.includes('#/chapter/'+i+'/')||location.hash==='#/chapter/'+i?'active':''}" data-nav="${i}"><span class="num">${String(i).padStart(2,'0')}</span><span class="name">${esc(c.title)}</span>${completed[i]?'<span class="done">✓</span>':''}</button>`).join('')}
function renderHome(){renderNav();$('crumbName').textContent='學習總覽';$('main').innerHTML=`<section class="hero"><span class="eyebrow">INTERACTIVE COMPUTER SCIENCE COURSE · V1.0</span><h1>看懂資料如何流動，<br><em>讓演算法真正動起來。</em></h1><p>18 章從底層出發，先用 ELI5 類比建立直覺，再回到形式化原理、Python / C 範例、可逐步操作的資料結構視覺化與章末測驗。</p><div class="heroActions"><button class="btn primary" data-nav="${Math.min(CHAPTERS.length-1,CHAPTERS.findIndex((_,i)=>!completed[i])<0?0:CHAPTERS.findIndex((_,i)=>!completed[i]))}">↗ 開始／繼續學習</button><button class="btn" data-nav="1" data-tab="lab">◉ 直接試玩互動實驗</button></div></section><section class="stats"><div class="stat"><b>18</b><span>系統化章節</span></div><div class="stat"><b>14</b><span>主題互動模擬</span></div><div class="stat"><b>54</b><span>附解析選擇題</span></div><div class="stat"><b>${Object.keys(completed).filter(i=>completed[i]).length}</b><span>已完成章節</span></div></section><div class="sectionLabel">COURSE MAP · 從基礎到演算法設計</div><section class="courseGrid">${CHAPTERS.map((c,i)=>`<a class="courseCard" href="#/chapter/${i}/lesson"><div class="level">${esc(c.tag)} · CH ${String(i).padStart(2,'0')}</div><h3>${esc(c.title)}</h3><p>${esc(c.subtitle)}</p><span class="status">${completed[i]?'✓ 已完成':'開啟課程 ↗'}</span></a>`).join('')}</section><div class="calloutGrid" style="margin-top:22px"><div class="panel"><h3>👁 先理解「為什麼」</h3><p>每一章都有 ELI5 直覺與比喻限制，避免只背演算法口訣卻不知道適用前提。</p></div><div class="panel"><h3>⌁ 再執行「每一步」</h3><p>可修改輸入、切換方法、觀察資料結構狀態；任何實驗都不需要連線或後端服務。</p></div></div>`}
function renderChapter(){let c=CHAPTERS[current];$('crumbName').textContent=c.title;renderNav();$('main').innerHTML=`<div class="chapterHead"><span class="eyebrow">CHAPTER ${String(current).padStart(2,'0')} / ${CHAPTERS.length-1} · ${esc(c.tag)}</span><h1>${esc(c.title)}</h1><p>${esc(c.subtitle)}</p></div><div class="tabs">${[['lesson','📖 深入理解'],['lab','◉ 動手實驗'],['quiz','✎ 章末測驗'],['notes','▤ 我的筆記']].map(([k,label])=>`<button class="tab ${activeTab===k?'active':''}" data-tab="${k}" aria-selected="${activeTab===k}">${label}</button>`).join('')}</div><div id="tabContent" class="content"></div><div class="chapterNavBtns"><button class="btn" ${current===0?'disabled':''} data-nav="${current-1}">← 上一章</button><button class="btn primary" ${current===CHAPTERS.length-1?'disabled':''} data-nav="${current+1}">下一章 →</button></div>`;renderTab()}

function nums(s,limit=12){return String(s||'').split(/[，,\s]+/).filter(Boolean).map(Number).filter(n=>Number.isFinite(n)&&Number.isInteger(n)&&Math.abs(n)<=999).slice(0,limit)}
const frame=(values,note,active=[],done=[],extra={})=>({values:values.slice(),note,active:[...active],done:[...done],...extra});
function configFor(name){const n=(id,label,value,type='text')=>({id,label,value,type});const s=(id,label,value,options)=>({id,label,value,options});switch(name){
case 'array':return [n('values','陣列','4,8,15,16,23,42'),s('op','操作','insert',[['insert','中間插入'],['remove','刪除元素'],['find','線性搜尋']]),n('index','索引 / 尋找值','2','number'),n('value','新元素','99','number')];
case 'complexity':return [n('n','輸入規模 n','12','number'),s('op','時間成長模型','linear',[['constant','O(1)'],['log','O(log n)'],['linear','O(n)'],['nlogn','O(n log n)'],['square','O(n²)']])];
case 'linked':return [n('values','節點數值','10,20,30,40'),s('op','操作','insert',[['insert','插入節點'],['remove','刪除節點']]),n('index','索引','2','number'),n('value','插入值','15','number')];
case 'stack':return [n('values','元素','A,B,C'),s('op','操作','stackpush',[['stackpush','Stack push'],['stackpop','Stack pop'],['enqueue','Queue enqueue'],['dequeue','Queue dequeue']]),n('value','新元素','D')];
case 'recursion':return [n('n','計算 n! （0–7）','4','number')];
case 'search':return [n('values','已排序資料','2,5,7,9,12,16,21,28,32'),n('target','搜尋目標','16','number')];
case 'sort':return [n('values','輸入序列','7,3,9,2,5,1,8'),s('op','排序演算法','bubble',[['bubble','Bubble Sort'],['insertion','Insertion Sort'],['selection','Selection Sort'],['merge','Merge Sort'],['quick','Quick Sort']])];
case 'hash':return [n('values','依序插入的鍵','17,24,8,19,31,10'),n('m','桶數 m（3–11）','7','number')];
case 'bst':return [n('values','依序插入的值','8,3,10,1,6,14,4,7,13')];
case 'heap':return [n('values','依序插入的值','6,9,3,7,2,8'),s('op','優先佇列操作','build',[['build','建立 Min-Heap'],['pop','建立後取出最小值']])];
case 'graph':return [s('op','圖走訪','bfs',[['bfs','BFS'],['dfs','DFS'],['dijkstra','Dijkstra (非負權重)']]),s('start','起點','A',[['A','A'],['B','B'],['C','C'],['D','D'],['E','E'],['F','F']])];
case 'greedy':return [s('op','活動資料集','base',[['base','標準活動集'],['dense','密集重疊集']])];

case 'union':return [n('pairs','合併的節點配對（例：0-1,1-2）','0-1,1-2,3-4,2-4')];
default:return []}}

function treeViz(f){let a=f.values;if(!a.length)return '<span class="empty">空樹</span>';let points=[],edges=[],range=460;function rec(i,x,y,dx){if(i>=a.length||a[i]===null)return;points.push({i,x,y,v:a[i]});for(let [child,sign] of [[2*i+1,-1],[2*i+2,1]]){if(child<a.length&&a[child]!==null){edges.push([x,y,x+sign*dx,y+65]);rec(child,x+sign*dx,y+65,Math.max(18,dx/2))}}}rec(0,250,29,117);let h=Math.max(130,...points.map(p=>p.y+35));return `<svg class="graphSvg" viewBox="0 0 500 ${h}" width="500" height="${h}" aria-label="樹狀結構">${edges.map(e=>`<line x1="${e[0]}" y1="${e[1]}" x2="${e[2]}" y2="${e[3]}" stroke="#6588a6" stroke-width="2"/>`).join('')}${points.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="21" fill="${f.active.includes(p.i)?'#267d6a':f.done.includes(p.i)?'#4d7847':'#24455f'}" stroke="${f.active.includes(p.i)?'#93f6db':'#86aacc'}" stroke-width="2"/><text x="${p.x}" y="${p.y+5}" text-anchor="middle" fill="white" font-size="15">${esc(p.v)}</text>`).join('')}</svg><div class="tinyLabel">${f.treeNote||'父節點位置 i；左孩子 2i+1、右孩子 2i+2（本圖僅示意二元樹儲存位置）'}</div>`}
function graphViz(f){let pos={A:[55,85],B:[185,35],C:[185,135],D:[320,26],E:[320,92],F:[320,165]};let edges=[['A','B',4],['A','C',2],['B','D',5],['B','E',1],['C','B',1],['C','E',7],['E','D',2],['E','F',3],['D','F',1]];let lines=edges.map(([u,v,w])=>{let [x1,y1]=pos[u],[x2,y2]=pos[v];let mx=(x1+x2)/2,my=(y1+y2)/2;return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#4b6986" stroke-width="2" marker-end="url(#edgeArrow)"/><text x="${mx}" y="${my-4}" fill="#a8c5e5" font-size="10">${w}</text>`}).join('');return `<svg class="graphSvg" viewBox="0 0 380 205" width="480" role="img" aria-label="A 至 F 六個節點的有向加權圖"><defs><marker id="edgeArrow" markerWidth="6" markerHeight="6" refX="17" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6" fill="#4b6986"/></marker></defs>${lines}${Object.entries(pos).map(([node,[x,y]])=>`<circle cx="${x}" cy="${y}" r="20" fill="${f.active.includes(node)?'#247d68':f.done.includes(node)?'#55783a':'#23455f'}" stroke="${f.active.includes(node)?'#a3f9d4':'#80a8c4'}" stroke-width="2"/><text x="${x}" y="${y+5}" text-anchor="middle" fill="white" font-size="15" font-weight="bold">${node}</text>`).join('')}</svg><div class="tinyLabel">有向邊權重見連線旁標示；BFS/DFS 忽略權重，Dijkstra 使用非負權重</div>${f.dist?`<div class="tinyLabel">目前距離：${Object.entries(f.dist).map(([k,v])=>`${k}=${v===Infinity?'∞':v}`).join('　')}</div>`:''}`}
function makeFrames(id,o){let fs=[],summary='',push=(a,msg,act=[],done=[],extra={})=>fs.push(frame(a,msg,act,done,extra));let a=nums(o.values);const bounded=(x,lo,hi,def=lo)=>Number.isFinite(+x)?Math.max(lo,Math.min(hi,Math.floor(+x))):def;
if(id==='array'){let x=bounded(o.index,0,Math.max(0,a.length));let val=bounded(o.value,-999,999,99);push(a,'初始陣列。元素索引從 0 開始。');if(o.op==='find'){let found=false;for(let i=0;i<a.length;i++){push(a,`檢查 a[${i}]=${a[i]} 是否等於 ${o.index}。`,[i]);if(a[i]===Number(o.index)){push(a,`找到值 ${o.index}，位置是 ${i}。`,[i],[i]);found=true;break}}if(!found)push(a,'找不到目標，已掃描全部元素。')}else if(o.op==='insert'){if(a.length<12){a.push('·');push(a,`先為新元素 ${val} 預留尾端容量。`,[a.length-1]);for(let i=a.length-1;i>x;i--){a[i]=a[i-1];push(a,`把索引 ${i-1} 的值移到索引 ${i}。`,[i-1,i])}a[x]=val;push(a,`將 ${val} 放到索引 ${x}，完成插入。`,[x],[x])}else push(a,'已達 12 個元素的示範上限。')}else{if(x<a.length){for(let i=x;i<a.length-1;i++){a[i]=a[i+1];push(a,`把索引 ${i+1} 的值左移至 ${i}。`,[i])}a.pop();push(a,`刪除索引 ${x} 完成。`)}else push(a,'索引超出可刪除範圍。')}summary='直接索引通常 O(1)；中間插入／刪除與未知值線性搜尋，最壞 O(n)。'}
else if(id==='complexity'){let n=bounded(o.n,1,5000,12);let fn=x=>({constant:1,log:Math.ceil(Math.log2(x+1)),linear:x,nlogn:Math.ceil(x*Math.log2(x+1)),square:x*x})[o.op]||x;let vals=[1,2,4,8,16,32,64,128].map(x=>Math.min(9999,fn(x)));push(vals,`假設基本操作與 ${o.op} 成長模型成正比；n=${n} 對應約 ${fn(n).toLocaleString()} 次操作。`,[],[],{kind:'complex'});for(let i=0;i<vals.length;i++)push(vals,`觀察 n=${[1,2,4,8,16,32,64,128][i]} 時約需 ${vals[i]===9999?'9999+':vals[i]} 次基本操作。`,[i],Array.from({length:i},(_,k)=>k),{kind:'complex'});summary='這只是成長率可視化模型，真實執行時間還會受常數、快取和語言 Runtime 影響。'}
else if(id==='linked'){let x=bounded(o.index,0,a.length,1);let val=bounded(o.value,-999,999,15);push(a,'從 head 開始沿 next 指標走訪。',[],[],{kind:'nodes'});for(let i=0;i<Math.min(x,a.length);i++)push(a,`沿 next 前進到位置 ${i}。`,[i],[],{kind:'nodes'});if(o.op==='insert'){if(a.length<12){push(a,`建立節點 ${val}，先接好新節點的 next。`,[Math.min(x,a.length-1)],[],{kind:'nodes'});a.splice(x,0,val);push(a,`更新前驅節點的 next，節點 ${val} 已插入。`,[x],[x],{kind:'nodes'})}}else{if(x<a.length){a.splice(x,1);push(a,`重新連結指標，移除位置 ${x} 的節點。`,[],[],{kind:'nodes'})}else push(a,'刪除索引超出串列範圍。',[],[],{kind:'nodes'})}summary='走到第 i 個節點需 O(i)；如果已取得前驅指標，實際重接 next 僅需 O(1)。'}

else if(id==='sort'){a=a.slice(0,11);let act=[],count=0;function snap(msg,active=[],done=[]){if(fs.length<280)push(a,msg,active,done,{kind:'bar'})}snap('原始序列。每個長條高度代表數值。');let n=a.length;if(o.op==='bubble'){for(let i=0;i<n;i++){let swapped=false;for(let j=0;j<n-i-1;j++){snap(`比較索引 ${j} 與 ${j+1}。`,[j,j+1]);count++;if(a[j]>a[j+1]){[a[j],a[j+1]]=[a[j+1],a[j]];swapped=true;snap('相鄰逆序，進行交換。',[j,j+1])}}snap(`本輪結束，右端 ${i+1} 個元素已就位。`,[],Array.from({length:i+1},(_,x)=>n-1-x));if(!swapped)break}}

else if(o.op==='merge'){function merge(l,r){if(r-l<=1)return;let m=(l+r)>>1;merge(l,m);merge(m,r);let x=a.slice(l,m),y=a.slice(m,r),i=0,j=0,k=l;while(i<x.length||j<y.length){if(j===y.length||(i<x.length&&x[i]<=y[j]))a[k++]=x[i++];else a[k++]=y[j++];snap(`合併區間 [${l}, ${m}) 和 [${m}, ${r})。`,[k-1])}snap(`區間 [${l},${r}) 已排序。`,Array.from({length:r-l},(_,z)=>z+l))}merge(0,n)}

else if(id==='hash'){let m=bounded(o.m,3,11,7);let bucket=Array.from({length:m},()=>[]),v=nums(o.values,16);push([],`初始化 ${m} 個空桶。`,[],[],{kind:'hash',buckets:bucket.map(x=>x.slice())});for(let key of v){let idx=((key%m)+m)%m;let old=bucket[idx].length;bucket[idx].push(key);push([],`插入 ${key}：h(${key})=${idx}${old?'，發生碰撞！用 chaining 接在原桶後面':''}。`,[idx],[],{kind:'hash',buckets:bucket.map(x=>x.slice())})}summary=`元素數 ${v.length}，桶數 ${m}，負載率 α = ${(v.length/m).toFixed(2)}；理想平均查找 O(1)，最差 O(n)。`}
else if(id==='bst'){let v=nums(o.values,15),tree=Array(127).fill(null);push([],`空 BST：每次插入必須維持左小右大的性質。`,[],[],{kind:'tree'});for(let x of v){let idx=0;while(idx<tree.length&&tree[idx]!==null){push(tree.slice(),`插入 ${x}，比較節點 ${tree[idx]}。`,[idx],[],{kind:'tree',treeNote:'BST：左子樹較小，右子樹較大'});idx=x<tree[idx]?idx*2+1:idx*2+2}if(idx<tree.length){tree[idx]=x;push(tree.slice(),`在新的位置插入 ${x}。`,[idx],[],{kind:'tree',treeNote:'BST：左子樹較小，右子樹較大'})}else push(tree.slice(),'示範樹過深，略過這次插入。',[],[],{kind:'tree'})}summary='BST 查找成本取決於高度 h：O(h)；平衡時 O(log n)，退化時 O(n)。'}
else if(id==='heap'){let h=[];push(h,'從空 Min-Heap 開始（用陣列儲存完全二元樹）。',[],[],{kind:'bar'});for(let key of nums(o.values,10)){h.push(key);let i=h.length-1;push(h,`插入 ${key} 到尾端。`,[i],[],{kind:'bar'});while(i>0){let p=(i-1)>>1;if(h[p]<=h[i])break;[h[p],h[i]]=[h[i],h[p]];push(h,`子節點較小，與父節點交換，上浮。`,[p,i],[],{kind:'bar'});i=p}}if(o.op==='pop'&&h.length){let removed=h[0],last=h.pop();if(h.length){h[0]=last;push(h,`取出最小值 ${removed}，末端值 ${last} 移到根。`,[0],[],{kind:'bar'});let i=0;while(true){let l=2*i+1,r=l+1,m=i;if(l<h.length&&h[l]<h[m])m=l;if(r<h.length&&h[r]<h[m])m=r;if(m===i)break;[h[i],h[m]]=[h[m],h[i]];push(h,'將較小子節點與父節點交換，下沉。',[i,m],[],{kind:'bar'});i=m}}else push(h,`取出唯一元素 ${removed}，堆積為空。`,[],[],{kind:'bar'})}push(h,`Min-Heap 根為 ${h.length?h[0]:'空'}。`,[0],[],{kind:'bar'});summary='維持父 ≤ 子。插入與取出最小值 O(log n)，peek O(1)。'}
