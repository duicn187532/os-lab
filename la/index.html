function home(){active='lesson';$('#app').innerHTML=`<section class="hero"><div class="eyebrow">CS LAB · MATHEMATICS TRACK</div><h1>線性代數<br>從幾何到 AI 模型</h1><p>不用程式碼假裝數學公式。從向量、矩陣到特徵分解，以標準數學排版、可操作的圖形和逐步推理，建立真正的理解。</p><div class="metrics"><div class="metric"><strong>20</strong>章教材</div><div class="metric"><strong>20</strong>互動實驗</div><div class="metric"><strong>60</strong>題測驗</div></div><p><a class="btn primary" href="#/0/lesson">開始學習 →</a></p></section><div class="cards">${chapters.map((x,i)=>`<a href="#/${i}/lesson" class="card"><small>CHAPTER ${String(i).padStart(2,'0')} · ${x.mins} MIN ${state.done[i]?'· 已完成':''}</small><h3>${esc(x.title)}</h3><p>${esc(x.idea)}</p></a>`).join('')}</div>`;nav()}
const chapterNotations=["<span class=\"tex\"><b>u</b>, <b>v</b></span>：向量；分量表示各座標軸上的數值；+：逐分量相加。","<span class=\"tex\">‖<b>u</b>‖</span>：向量長度；<span class=\"tex\"><i>u</i><sub><i>i</i></sub></span>：第 i 個分量；Σ：各分量平方求和；√：平方根。","<span class=\"tex\"><b>u</b> · <b>v</b></span>：內積；<span class=\"tex\"><i>θ</i></span>：兩向量夾角；<span class=\"tex\">‖<b>u</b>‖</span>：向量長度；cos：餘弦。","<span class=\"tex\"><i>A</i>, <i>B</i></span>：矩陣；<span class=\"tex\"><i>a</i><sub><i>i</i><i>j</i></sub></span>：第 i 列第 j 欄元素；m：列數；n：欄數。","<span class=\"tex\"><i>C</i> = <i>A</i><i>B</i></span>：矩陣乘積；<span class=\"tex\"><i>C</i><sub><i>i</i><i>j</i></sub></span>：結果第 i 列第 j 欄；k：共同維度索引；Σ：求和。","<span class=\"tex\"><b>v</b><sub><i>i</i></sub></span>：第 i 個向量；<span class=\"tex\"><i>c</i><sub><i>i</i></sub></span>：線性組合係數；span：所有線性組合構成的集合。","<span class=\"tex\"><i>c</i><sub><i>i</i></sub></span>：係數；<span class=\"tex\"><b>v</b><sub><i>i</i></sub></span>：向量；0：零向量；僅零係數能得到零向量表示線性獨立。","<span class=\"tex\"><i>A</i></span>：係數矩陣；<span class=\"tex\"><b>x</b></span>：未知數向量；<span class=\"tex\"><b>b</b></span>：常數向量。","RREF：簡化列階梯形；<span class=\"tex\"><i>R</i><sub><i>i</i></sub></span>：第 i 列；列交換、倍乘、列相加不改變解集合。","<span class=\"tex\">det(<i>A</i>)</span>：行列式；a、b、c、d：2×2 矩陣的四個元素；非零表示可逆。","<span class=\"tex\"><i>A</i><sup>−1</sup></span>：反矩陣；I：單位矩陣；<span class=\"tex\"><i>A</i><i>A</i><sup>−1</sup> = <i>I</i></span> 表示逆運算。","<span class=\"tex\"><i>T</i></span>：線性變換；<span class=\"tex\"><i>A</i></span>：其矩陣表示；<span class=\"tex\"><b>x</b></span>：輸入向量；<span class=\"tex\"><i>A</i><b>x</b></span>：輸出向量。","<span class=\"tex\"><i>A</i></span>：方陣；<span class=\"tex\"><b>v</b></span>：非零特徵向量；<span class=\"tex\"><i>λ</i></span>：特徵值。","<span class=\"tex\"><b>u</b></span>：投影方向；<span class=\"tex\"><b>v</b></span>：被投影向量；·：內積；<span class=\"tex\">‖<b>u</b>‖<sup>2</sup></span>：長度平方。","<span class=\"tex\"><b>v</b><sub><i>i</i></sub></span>：原始向量；<span class=\"tex\"><b>q</b><sub><i>i</i></sub></span>：正交單位向量；proj：投影算子。","rank(A)：矩陣秩；null(A)：零空間；n：欄數；秩－零度定理為 rank + nullity = n。","<span class=\"tex\"><i>A</i> = <i>U</i>Σ<i>V</i><sup><i>T</i></sup></span>：奇異值分解；U、V：正交矩陣；Σ：非負奇異值的對角矩陣；T：轉置。","<span class=\"tex\"><i>X</i></span>：資料矩陣；<span class=\"tex\"><i>μ</i></span>：均值；<span class=\"tex\"><i>C</i></span>：共變異矩陣；特徵向量表示主成分方向。","<span class=\"tex\"><i>W</i></span>：權重矩陣；<span class=\"tex\"><b>x</b></span>：輸入；<span class=\"tex\"><b>b</b></span>：偏差；<span class=\"tex\"><b>y</b></span>：輸出。","<span class=\"tex\"><i>A</i></span>：矩陣；<span class=\"tex\"><b>x</b></span>：向量；<span class=\"tex\"><i>λ</i></span>：特徵值；Σ：求和或奇異值矩陣，須依上下文判斷。"];
function lesson(i){let x=chapters[i];return `<div class="section"><h2>先理解核心概念</h2><p>${esc(x.idea)}</p><h3>標準數學式</h3><div class="formula" role="math" aria-label="${esc(x.latex)}">${x.formula}</div><div class="notation-explanation"><strong>符號意義</strong><p>${chapterNotations[i]}</p></div><h3>具體例子</h3><p>${esc(x.example)}</p></div><div class="section"><h3>容易誤解的地方</h3><p>${esc(x.trap)}</p><p class="muted">實驗採 2×2 矩陣與二維向量縮小展示；用它理解結構，再推廣至一般 n 維。</p></div><div class="section"><h3>練習用 Python 驗證</h3><pre class="code">import numpy as np\nA = np.array([[2., 1.], [1., 3.]])\nx = np.array([2., 1.])\nprint('A @ x =', A @ x)\nprint('det(A) =', np.linalg.det(A))\nprint('eigenvalues =', np.linalg.eigvals(A))</pre><p class="muted">Python 用於驗算與工程實作；上方數學式才是正式的數學表達。</p></div>`}
function draw(){const type=chapters[current].lab, A=[[a,b],[c,d]],det=a*d-b*c, v=[2,1],mul=[2*a+b,2*c+d],dot=2*a+c, norm=Math.hypot(a,c);let msg='';let points=[[0,0],[a,c],[a+b,c+d],[b,d]];const X=x=>300+x*27,Y=y=>145-y*27;let grid='';for(let n=-9;n<=9;n++){grid+=`<line x1="${X(n)}" y1="0" x2="${X(n)}" y2="270" stroke="#253449"/><line x1="0" y1="${Y(n)}" x2="600" y2="${Y(n)}" stroke="#253449"/>`}const line=(x1,y1,x2,y2,col,w=3)=>`<line x1="${X(x1)}" y1="${Y(y1)}" x2="${X(x2)}" y2="${Y(y2)}" stroke="${col}" stroke-width="${w}" marker-end="url(#arrow)"/>`;let shapes='';if(['det','span','independent','transform','inverse','eigen','rank','svd','pca','challenge','multiply','add','system','gauss','gram'].includes(type)){shapes+=`<polygon points="${points.map(q=>X(q[0])+','+Y(q[1])).join(' ')}" fill="#83e6c922" stroke="#83e6c9" stroke-width="2"/>`;shapes+=line(0,0,a,c,'#83e6c9')+line(0,0,b,d,'#8fb8ff');msg=`A = [[${a}, ${b}], [${c}, ${d}]]\ndet(A) = ${det}; A(2,1) = (${mul.join(', ')})`;}else{shapes+=line(0,0,a,c,'#83e6c9')+line(0,0,b,d,'#8fb8ff');msg=`u = (${a}, ${c}); v = (${b}, ${d})\nu·v = ${a*b+c*d}; ||u|| = ${norm.toFixed(3)}`;}
if(type==='norm')msg=`||u|| = √(${a}² + ${c}²) = ${norm.toFixed(4)}`;
if(type==='dot')msg=`u·v = ${a}×${b} + ${c}×${d} = ${a*b+c*d}`;
if(type==='det')msg=`det(A) = ${a}×${d} − ${b}×${c} = ${det}\n有向面積縮放倍率 = ${det}`;
if(type==='inverse')msg=det===0?'det(A) = 0，矩陣不可逆':`A⁻¹ = (1/${det}) [[${d}, ${-b}], [${-c}, ${a}]]`;
if(type==='independent'||type==='rank')msg=`det(A) = ${det}；${det?'兩個欄向量線性獨立，rank = 2':'兩個欄向量線性相依，rank < 2'}`;
if(type==='system'||type==='gauss')msg=det===0?'係數矩陣奇異：需再檢查增廣矩陣判斷無解或無限多解':`解 A x = (5,1)：x = (${((5*d-b)/det).toFixed(3)}, ${((a-5*c)/det).toFixed(3)})`;
if(type==='eigen'||type==='svd'||type==='pca'){let tr=a+d,dis=Math.sqrt(Math.max(0,(a-d)**2+4*b*c));msg=`tr(A) = ${tr}; det(A) = ${det}\n特徵方程 λ² − ${tr}λ + ${det} = 0`+( ((a-d)**2+4*b*c)>=0 ? `\n實特徵值 = ${((tr+dis)/2).toFixed(3)}, ${((tr-dis)/2).toFixed(3)}`:'\n此矩陣沒有實特徵值');if(type==='svd'||type==='pca')msg+='\n提醒：SVD 奇異值須從 AᵀA 的非負特徵值開根號；PCA 須先中心化資料。';}
if(type==='projection'){const den=a*a+c*c,k=den?(a*2+c)/den:0;shapes+=line(0,0,2,1,'#f9c47a');shapes+=line(0,0,k*a,k*c,'#ff9b9b');msg=den?`proj_u(2,1) = (${(k*a).toFixed(3)}, ${(k*c).toFixed(3)})`:'零向量不可作為投影軸';}
if(type==='attention')msg=`Q = (2,1), K₁ = (${a},${c}), K₂ = (${b},${d})\n分數 = (${dot}, ${2*b+d}) / √2\n注意：真實注意力還需要 softmax 與 V 加權。`;
$('#viz').innerHTML=`<svg viewBox="0 0 600 270" aria-label="二維向量和矩陣變換示意"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#b8c9db"/></marker></defs>${grid}<line x1="0" y1="${Y(0)}" x2="600" y2="${Y(0)}" stroke="#5b6b7c"/><line x1="${X(0)}" y1="0" x2="${X(0)}" y2="270" stroke="#5b6b7c"/>${shapes}<text x="18" y="25" fill="#83e6c9" font-size="14">u / 第一欄</text><text x="18" y="47" fill="#8fb8ff" font-size="14">v / 第二欄</text></svg>`;$('#result').textContent=msg+`\n步驟 ${step}: `+(step===0?'讀取初始向量／矩陣':step===1?'檢查維度與分量':step===2?'執行線性運算':'比較幾何與代數結果');}
let current=0;function lab(){return `<div class="section"><h2>可操作的數學實驗</h2><p>調整 2×2 矩陣的四個元素；圖形和計算結果同步更新。實驗使用一般數值運算，教材公式使用正式數學排版。</p><div class="labControls">${['a','b','c','d'].map(k=>`<label>${k}<input type="number" step="1" min="-5" max="5" id="in-${k}" value="${({a,b,c,d})[k]}"></label>`).join('')}<button class="btn" id="reset">重設</button><button class="btn primary" id="next">下一步 →</button></div><div class="viz" id="viz"></div><div class="result" id="result" aria-live="polite"></div><p class="muted">教學用二維例子。某些進階主題（SVD、PCA）在此顯示必要的先備運算，不宣稱此簡化圖已完成整個演算法。</p></div>`}
function quiz(i){let x=chapters[i];return `<div class="section"><h2>理解檢核</h2>${x.quiz.map((q,j)=>`<div class="quiz"><strong>${j+1}. ${esc(q.q)}</strong>${q.options.map((o,k)=>`<button class="choice" data-q="${j}" data-a="${k}">${esc(o)}</button>`).join('')}<p class="muted" id="why${j}"></p></div>`).join('')}<button class="btn primary" id="complete">✓ 標記本章完成</button></div>`}
function notes(i){return `<div class="section"><h2>個人學習筆記</h2><p class="muted">儲存在此瀏覽器，並不會跨裝置同步。</p><textarea id="notes" placeholder="記下你的推導、疑問、理解…">${esc(state.notes[i]||'')}</textarea><p><button class="btn primary" id="saveNotes">儲存筆記</button></p></div>`}
function chapter(i,tab){current=i;active=tab;let x=chapters[i];$('#app').innerHTML=`<div class="eyebrow">CHAPTER ${String(i).padStart(2,'0')} / 19</div><h1>${esc(x.title)}</h1><p class="muted">${esc(x.idea)}</p><div class="tabs">${[['lesson','閱讀講義'],['lab','互動實驗'],['quiz','章末測驗'],['notes','學習筆記']].map(([id,t])=>`<a class="tab ${tab===id?'active':''}" href="#/${i}/${id}">${t}</a>`).join('')}</div>${tab==='lab'?lab():tab==='quiz'?quiz(i):tab==='notes'?notes(i):lesson(i)}<div class="footer"><a href="#/${Math.max(0,i-1)}/lesson">← 上一章</a>　·　<a href="#/${Math.min(chapters.length-1,i+1)}/lesson">下一章 →</a></div>`;if(tab==='lab'){step=0;['a','b','c','d'].forEach(k=>$('#in-'+k).addEventListener('input',e=>{({a:(v)=>a=v,b:(v)=>b=v,c:(v)=>c=v,d:(v)=>d=v})[k](Number(e.target.value)||0);step=0;draw()}));$('#next').onclick=()=>{step=(step+1)%4;draw()};$('#reset').onclick=()=>{a=2;b=1;c=1;d=3;chapter(i,'lab')};draw()}if(tab==='quiz'){$('#complete').onclick=()=>{state.done[i]=true;save();nav();$('#complete').textContent='✓ 已完成'};document.querySelectorAll('.choice').forEach(el=>el.onclick=()=>{const j=+el.dataset.q,k=+el.dataset.a,q=x.quiz[j];state.answers[i+'-'+j]=k;save();document.querySelectorAll(`[data-q="${j}"]`).forEach(z=>z.classList.toggle('correct',+z.dataset.a===q.answer));el.classList.toggle('wrong',k!==q.answer);$('#why'+j).textContent=(k===q.answer?'答對！':'還可以再想想。')+' '+q.why})}if(tab==='notes'){$('#saveNotes').onclick=()=>{state.notes[i]=$('#notes').value;save();$('#saveNotes').textContent='✓ 已儲存'}}nav();$('#side').classList.remove('open')}
function render(){let m=location.hash.match(/^#\/(\d+)(?:\/(lesson|lab|quiz|notes))?/);if(m){chapter(Math.min(19,+m[1]),m[2]||'lesson')}else home()}window.addEventListener('hashchange',render);$('#menu').onclick=()=>$('#side').classList.toggle('open');render();
</script></body></html>
