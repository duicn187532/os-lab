</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand"><div class="brand-top"><div class="brand-icon">Σ</div><div><strong>DM <span>LAB</span></strong><br><small>DISCRETE MATHEMATICS</small></div></div><a class="hub" href="../">← 返回 CS LAB 入口網</a></div><div class="searchbox"><input type="search" id="search" placeholder="搜尋章節、公式或概念…" aria-label="搜尋章節"></div><nav class="sidebar-list" id="sidebarList" aria-label="課程列表"></nav><div class="sidefoot"><small>MY LEARNING PROGRESS</small><div class="track"><span id="progress" style="width:0%"></span></div><small id="progressText">0 / 24 章完成</small></div></aside><div id="overlay" class="overlay"></div><main class="main"><header class="top"><div class="top-actions"><button class="iconbtn mobilemenu" id="menuBtn" aria-label="開啟章節選單">☰</button><div class="crumb" id="breadcrumb">DM LAB</div></div><div class="top-actions"><a class="iconbtn" href="../" title="CS LAB 首頁" aria-label="返回入口網">⌂</a><button class="iconbtn" id="themeBtn" aria-label="切換深淺色">☀</button></div></header><div class="wrap" id="mainContent"></div></main></div><div class="toast" id="toast" hidden></div><script>const COURSES = [{"id":0,"title":"命題與真值表","category":"邏輯","tag":"Propositional Logic","mins":35,"lab":"truth","question":"電腦如何判斷「如果…那麼…」？","analogy":"命題像開關：每個開關只能亮（真）或滅（假），邏輯連接詞把開關組成電路。","core":"命題是能判定真假的敘述。¬P、P∧Q、P∨Q、P→Q 與 P↔Q 形成複合命題；真值表逐列窮舉所有賦值。","concepts":["n 個獨立命題變數有 2ⁿ 列真值組合；這就是窮舉法的規模。","P∧Q 兩者都真才真；P∨Q 至少一個真就真，採包含式 OR。","P→Q 只在 P 真、Q 假時為假；等價於 ¬P∨Q。","重言式在每列都真，矛盾式在每列都假，或然式在不同列真假皆有。"],"steps":["先辨識原子命題 P、Q。","列出 00、01、10、11 四種賦值。","由內而外算 ¬、∧、∨、→、↔，最後檢查最後一欄。"],"worked":"若 P=「下雨」、Q=「帶傘」，P→Q 在「沒有下雨但帶傘」時為真；此處的「真」是形式邏輯，不代表因果關係。","trap":"不要把材料蘊涵 P→Q 誤認為日常語言的因果承諾；也不要把 OR 當成互斥。","code":"from itertools import product\nfor p,q in product([False,True], repeat=2):\n    print(p,q,(not p) or q)","quiz":[{"q":"P→Q 在哪個情況為假？","a":["P 假、Q 假","P 真、Q 假","P 假、Q 真","P 真、Q 真"],"correct":1,"hint":"只檢查承諾被違反的情況。","why":"前件成立卻沒有後件，才違反 P→Q。"},{"q":"P∨Q 採包含式 OR，當 P、Q 都真時？","a":["真","假","無法決定","只有 XOR 才真"],"correct":0,"hint":"OR 是「至少有一個」。","why":"包含式 OR 允許兩者同時為真。"},{"q":"3 個命題變數需要幾列真值表？","a":["3","6","8","9"],"correct":2,"hint":"每個變數有兩種可能。","why":"2³=8。"}]},{"id":1,"title":"邏輯等價、德摩根與正規形","category":"邏輯","tag":"Normal Forms","mins":40,"lab":"normal","question":"如何讓兩段條件判斷等價？","analogy":"把不同寫法的規則整理成相同的標準件，就像化簡電路或整理 SQL WHERE 條件。","core":"邏輯等價意指任意賦值下真值都相同。德摩根律將否定推入括號；CNF 是子句的合取，DNF 是項的析取。","concepts":["¬(P∧Q)≡¬P∨¬Q；¬(P∨Q)≡¬P∧¬Q。","P→Q≡¬P∨Q；P↔Q≡(P→Q)∧(Q→P)。","CNF 形如 (P∨Q)∧(¬P∨R)；SAT 求解器廣泛使用 CNF。","DNF 形如 (P∧Q)∨(¬P∧R)；同一函數有多種等價表示。"],"steps":["移除 →、↔。","用德摩根律與雙重否定將 ¬ 推向原子。","若要 CNF，分配 ∨ over ∧；最後用真值表驗證。"],"worked":"¬(P∧Q) 與 (¬P∨¬Q) 在 4 種 P,Q 賦值皆相同；但 ¬P∧¬Q 不等價，例如 P=真、Q=假。","trap":"德摩根律不只是改括號：∧、∨ 必須互換；分配律也可能使表示式暴增。","code":"def f(p,q): return not (p and q)\ndef g(p,q): return (not p) or (not q)\nassert all(f(p,q)==g(p,q) for p in (0,1) for q in (0,1))","quiz":[{"q":"¬(P∨Q) 等價哪一個？","a":["¬P∨¬Q","¬P∧¬Q","P∧Q","P→Q"],"correct":1,"hint":"否定整個 OR 需要都不成立。","why":"¬(P∨Q)≡¬P∧¬Q。"},{"q":"(P∨Q)∧(¬P∨R) 是？","a":["DNF","XOR","CNF","不可表示"],"correct":2,"hint":"CNF 的最外層用 AND 連接子句。","why":"兩個 OR 子句由 AND 連接。"},{"q":"P→Q 的等價式？","a":["P∨Q","¬P∨Q","P∧Q","¬Q∨P"],"correct":1,"hint":"當 P 假時結果必真。","why":"材料蘊涵等價 ¬P∨Q。"}]},{"id":2,"title":"述詞邏輯與量詞","category":"邏輯","tag":"Quantifiers","mins":40,"lab":"quant","question":"「所有」、「存在」與反例到底差在哪？","analogy":"全稱量詞是「每個人都過關」，存在量詞是「至少一人過關」，找反例就像找出不符規則的一筆資料。","core":"述詞 P(x) 需指定變數的論域才有真值。∀x P(x) 表示每個元素成立；∃x P(x) 表示至少一個元素成立。","concepts":["¬∀x P(x)≡∃x ¬P(x)：否定所有人成立，只需一個反例。","¬∃x P(x)≡∀x ¬P(x)：不存在符合者，表示全部不符合。","∀x∃y R(x,y) 和 ∃y∀x R(x,y) 一般不等價，量詞次序很重要。","論域（domain）決定變數可代入誰；不能不寫論域就隨意判斷。"],"steps":["先固定論域，例如 {1,2,3,4}。","把 P(x) 替換為具體條件，例如 x 是偶數。","逐個檢查並記錄真值，再依 ∀ 或 ∃ 聚合。"],"worked":"在論域 {1,2,3,4}，∀x「x 為偶數」為假，∃x「x 為偶數」為真；全稱的反例可取 x=1。","trap":"「並非全部通過」不等於「全部都未通過」；量詞否定時要同時翻轉 ∀/∃。","code":"U=[1,2,3,4]\nprint(all(x%2==0 for x in U))  # False\nprint(any(x%2==0 for x in U))  # True","quiz":[{"q":"¬∀x P(x) 等價於？","a":["∀x ¬P(x)","∃x ¬P(x)","∃x P(x)","∀x P(x)"],"correct":1,"hint":"一個反例就能推翻「所有」。","why":"將 ¬ 移入量詞時 ∀ 換成 ∃。"},{"q":"∃x P(x) 需要證明？","a":["每個 x 成立","至少一個見證者成立","沒有反例","P 必是恆真"],"correct":1,"hint":"exists = 有一個就足夠。","why":"舉出滿足 P 的具體 x 即可。"},{"q":"∀x∃y R(x,y) 與 ∃y∀x R(x,y)？","a":["恆等價","一般不等價","一定都假","一定都真"],"correct":1,"hint":"「每人有一位朋友」不代表「大家有同一位朋友」。","why":"量詞順序會改變承諾。"}]},{"id":3,"title":"集合、冪集與集合運算","category":"集合與關係","tag":"Sets and Power Sets","mins":35,"lab":"sets","question":"集合的交集、差集為何常用在資料過濾？","analogy":"想像資料庫的兩張會員名單：交集是兩邊都有的人，差集是只在 A 名單的人。","core":"集合忽略順序及重複；常見操作包括 A∪B、A∩B、A−B、A△B；冪集 P(A) 含 A 的所有子集合。","concepts":["若 A 含 n 個不同元素，|P(A)|=2ⁿ，因每個元素都可選或不選。","A−B 是屬於 A 但不屬於 B，與 B−A 不同。","對稱差 A△B=(A−B)∪(B−A)。","空集合 ∅ 是任意集合的子集；∅ 與 {∅} 是不同集合。"],"steps":["先把集合去重、整理成元素清單。","依運算符定義逐元素判定是否保留。","對冪集為每個元素枚舉 0/1 選擇。"],"worked":"A={1,2,3}、B={3,4}，A∩B={3}、A−B={1,2}、A△B={1,2,4}、|P(A)|=8。","trap":"集合與串列不同：{1,1,2} 與 {1,2} 是同一集合；順序也不影響相等。","code":"A={1,2,3}; B={3,4}\nprint(A|B,A&B,A-B,A^B)\nprint(2**len(A))","quiz":[{"q":"A={1,2}, B={2,3} 的交集？","a":["{1,2,3}","{2}","{1}","∅"],"correct":1,"hint":"找兩邊都出現的元素。","why":"交集僅含 2。"},{"q":"有 4 個元素的集合，冪集大小？","a":["4","8","16","24"],"correct":2,"hint":"每個元素有選或不選兩種情況。","why":"2⁴=16。"},{"q":"∅ 和 {∅} 的關係？","a":["相同","後者有一個元素","前者有一個元素","都不是集合"],"correct":1,"hint":"大括號包住空集合，仍形成一個元素。","why":"|∅|=0，|{∅}|=1。"}]},{"id":4,"title":"二元關係、閉包與等價類","category":"集合與關係","tag":"Relations","mins":45,"lab":"relation","question":"哪些規則才能算是「相等或同一群」？","analogy":"社群的「互相關注」是關係，學校的「同班」可把學生分成一群群等價類。","core":"R⊆A×A 是二元關係；自反、對稱、反對稱、遞移是不同性質。等價關係需自反、對稱、遞移。","concepts":["自反：每個 a 都滿足 aRa。","對稱：aRb ⇒ bRa；反對稱：aRb 且 bRa ⇒ a=b，兩者不是互斥的否定。","遞移：aRb 且 bRc ⇒ aRc。","等價關係把集合分割成互不重疊的等價類；偏序則需自反、反對稱、遞移。"],"steps":["列出關係中的有序對 (a,b)。","對每個性質逐項尋找支持或反例。","若 R 自反、對稱又遞移，計算每個元素的等價類。"],"worked":"A={1,2,3}，R={(1,1),(2,2),(3,3),(1,2),(2,1)} 是等價關係，等價類為 {1,2} 和 {3}。","trap":"對稱不等於反對稱：只有互相成對時都必為同一元素，才是反對稱。","code":"R={(1,1),(2,2),(3,3),(1,2),(2,1)}\nprint(all((b,a) in R for a,b in R))","quiz":[{"q":"等價關係必須滿足？","a":["自反、對稱、遞移","自反、反對稱、遞移","對稱且反對稱","只有遞移"],"correct":0,"hint":"記住 equivalence 是「同一組」的標準。","why":"三條件為自反、對稱、遞移。"},{"q":"R 包含 (1,2)，若 R 對稱則還需？","a":["(1,1)","(2,1)","(2,2)","(3,3)"],"correct":1,"hint":"交換座標。","why":"對稱要求 aRb ⇒ bRa。"},{"q":"偏序關係需要？","a":["自反、對稱、遞移","自反、反對稱、遞移","非自反、對稱","只有反對稱"],"correct":1,"hint":"偏序與等價關係的第二個性質不同。","why":"偏序用反對稱，而非對稱。"}]},{"id":5,"title":"函數、單射、滿射與雙射","category":"集合與關係","tag":"Functions","mins":45,"lab":"function","question":"為什麼只有雙射能完美一對一配對？","analogy":"將每位學生分配到座位：有人共用座位不是單射、有空座位不是滿射；都沒有就是雙射。","core":"函數 f:A→B 對每個 A 中元素指定唯一 B 中輸出。單射不撞值、滿射覆蓋 B、雙射兼具。","concepts":["函數不要求不同輸入得到不同輸出；唯一性要求每個輸入只有一個輸出。","單射（injective）：f(a)=f(b) ⇒ a=b。","滿射（surjective）：每個 b∈B 都存在 a∈A 使 f(a)=b。","有限集 A、B 大小相同時，單射、滿射、雙射相互等價。"],"steps":["確認每個定義域元素都有且僅有一個對應。","計算所有輸出並檢查是否重複。","與對應的 B 比較是否全部被覆蓋。"],"worked":"A={1,2,3},B={a,b,c}，f(1)=a,f(2)=b,f(3)=c 是雙射；若改 f(3)=b，既非單射亦非滿射。","trap":"只看圖中出現的輸出，不一定能判定滿射；必須先知道對應域 B。","code":"A=[1,2,3]; B={1,2,3}\nf={1:2,2:3,3:1}\nprint(len(set(f.values()))==len(A),set(f.values())==B)","quiz":[{"q":"函數的單射性是？","a":["每個輸入只一個輸出","不同輸入不會有相同輸出","覆蓋所有對應域","必有反函數"],"correct":1,"hint":"單射是防止「撞值」。","why":"兩輸入撞同一值就不是單射。"},{"q":"函數的滿射性是？","a":["輸出互異","每個 B 元素被命中","每個 B 只有一個原像","A 和 B 必等大"],"correct":1,"hint":"滿射重點在「無遺漏」。","why":"B 的每個元素至少有一個前像。"},{"q":"若 f 是雙射，可以確定？","a":["存在反函數","A 一定無限","B 為空","所有值相同"],"correct":0,"hint":"雙射可逐一反向找回唯一輸入。","why":"一對一且覆蓋讓反向對應成為函數。"}]},{"id":6,"title":"證明方法：直接、逆否與反證","category":"證明與歸納","tag":"Proof Techniques","mins":50,"lab":"proof","question":"怎樣不是靠測試幾個數，就能證明「永遠成立」？","analogy":"測試是抽查商品，數學證明是驗證生產規則必然保證品質。","core":"形式化證明由定義、已知條件和有效推論構成。直接證明、逆否命題、反證法適用不同形式。","concepts":["直接法：由 P 出發推得 Q。","逆否法：證明 ¬Q→¬P，等價於 P→Q。","反證法：假設命題不成立，推得與已知事實矛盾。","找反例即可推翻全稱命題，但有限次成功測試不能證明無限多個情況。"],"steps":["將命題寫成清楚的「對所有 n，若 P 則 Q」。","選擇證明策略，寫明假設與目標。","每一步只用定義、已知或已證結果，不跳步。"],"worked":"證明「n² 為偶數 ⇒ n 為偶數」：以逆否法假設 n 為奇數，寫 n=2k+1，則 n²=4k(k+1)+1 為奇數，故逆否命題成立。","trap":"例子可以用來建立猜想，但不等於證明；形式證明也不是「一眼可見」。","code":"def odd_square(n):\n    return (n*n)%2 == 1\n# 枚舉僅做 sanity check；正式結論由代數證明。\nprint(all(odd_square(n) for n in range(-9,10,2)))","quiz":[{"q":"證明 P→Q 的逆否命題是？","a":["Q→P","¬P→¬Q","¬Q→¬P","P∧Q"],"correct":2,"hint":"否定並交換前後件。","why":"P→Q ≡ ¬Q→¬P。"},{"q":"推翻「所有整數都有性質 X」最有效？","a":["列出 100 個成立","找一個反例","只問 AI","畫一張圖"],"correct":1,"hint":"全稱只需一個失敗情況就不成立。","why":"全稱命題的反例足以推翻原命題。"},{"q":"反證法首先做什麼？","a":["直接接受結論","假設待證命題的否定","只做數值實驗","先求導數"],"correct":1,"hint":"從相反情況開始導向矛盾。","why":"反證法假設 ¬P 並推得矛盾。"}]},{"id":7,"title":"數學歸納法與強歸納法","category":"證明與歸納","tag":"Induction","mins":50,"lab":"induction","question":"只驗證第一張骨牌與推倒機制，為何能保證全部倒下？","analogy":"骨牌歸納：第一張會倒，而且每張倒都能推倒下一張，因此無限列骨牌逐張倒下。","core":"普通歸納證 P(n₀)，再證 P(k)⇒P(k+1)。強歸納在步驟中可假設從 n₀ 到 k 所有命題成立。","concepts":["基底 n=n₀ 一定要驗證；跳過就可能證錯。","歸納假設只准用 P(k)，不能直接把 P(k+1) 當作已知。","強歸納與普通歸納在證明能力上等價，但形式不同。","遞迴演算法正確性常利用歸納法證明。"],"steps":["寫出 P(n)，例如 1+⋯+n=n(n+1)/2。","基底 n=1：左邊 1，右邊 1。","假設 n=k 成立，加上 k+1 後代數化簡為 (k+1)(k+2)/2。"],"worked":"若 S(k)=k(k+1)/2，則 S(k+1)=k(k+1)/2+(k+1)=(k+1)(k+2)/2。","trap":"驗證很多 n 並不是歸納法；歸納法的核心是對任意 k 的推進步驟。","code":"def formula(n):return n*(n+1)//2\nfor n in range(1,8):print(n,sum(range(1,n+1)),formula(n))","quiz":[{"q":"數學歸納法最基本的兩個部分？","a":["測試與除錯","基底與歸納步驟","排序與搜尋","必要與充分"],"correct":1,"hint":"想到骨牌第一張及下一張。","why":"基底保證開始，步驟保證可傳遞。"},{"q":"證 1+…+n=n(n+1)/2，步驟應加入？","a":["k","k+1","2k","1/k"],"correct":1,"hint":"從 S(k) 走到 S(k+1)。","why":"新增的項是 k+1。"},{"q":"強歸納法允許在證 P(k+1) 時假設？","a":["只有 P(k+1)","P(1)…P(k) 全成立","P(k+2)","完全沒有假設"],"correct":1,"hint":"強歸納用更完整的前面資訊。","why":"可用所有較小情況作推進。"}]},{"id":8,"title":"計數原理與鴿籠原理","category":"組合計數","tag":"Counting Principles","mins":40,"lab":"count","question":"密碼組合數如何快速算？","analogy":"先選衣服再選褲子是乘法原理；從兩類互斥商品選一種是加法原理。","core":"加法原理用於互斥選擇，乘法原理用於連續獨立（或逐步計數）的選擇。鴿籠原理給出必然碰撞的下界。","concepts":["m 種上衣搭配 n 種褲子共 mn 種穿法。","m、n 兩個不相交類別擇一共 m+n 種。","把 N 個物品放進 k 個盒，至少一盒有 ⌈N/k⌉ 個。","允許重複的長度 n、每位 k 種字元共有 kⁿ 種。"],"steps":["先問選擇是「選 A 或 B」還是「先 A 再 B」。","確認類別是否重疊；若重疊不能直接相加。","對碰撞問題計算平均分配的上整數。"],"worked":"5 人分進 2 台電梯，至少有一台乘坐 ≥⌈5/2⌉=3 人；與實際分配無關。","trap":"乘法原理不要求機率獨立，但要求各步選擇數可正確計算；重複項不能被加法原理雙重計數。","code":"import math\nprint(3*4)  # 穿搭\nprint(math.ceil(13/4))  # 某個盒子的最少保證","quiz":[{"q":"3 種上衣與 4 種褲子，搭配數？","a":["7","12","24","81"],"correct":1,"hint":"依序完成兩個選擇。","why":"3×4=12。"},{"q":"13 顆球放入 4 盒，必有一盒至少？","a":["3","4","5","13"],"correct":1,"hint":"取 13/4 的上整數。","why":"⌈13/4⌉=4。"},{"q":"兩個互斥類別各有 7 和 3 種，擇一有？","a":["21","10","4","7"],"correct":1,"hint":"互斥且只選一個時用加法。","why":"7+3=10。"}]},{"id":9,"title":"排列、組合與二項式係數","category":"組合計數","tag":"Permutations and Combinations","mins":45,"lab":"comb","question":"從 8 人選 3 人，何時考慮順序？","analogy":"選三人上台是組合；選冠、亞、季軍是排列，因名次不同算不同結果。","core":"排列 P(n,r)=n!/(n−r)!，組合 C(n,r)=n!/(r!(n−r)!)；二項式定理 (a+b)ⁿ 的係數為 C(n,k)。","concepts":["排列關心順序，組合不關心順序。","n! 表示 n 個不同物品的所有排列數。","C(n,r)=C(n,n−r)，由選入與排除的對應得到。","Pascal identity：C(n,r)=C(n−1,r−1)+C(n−1,r)。"],"steps":["確認 n 個物件中選 r 個，是否允許重複。","判斷結果是否區分順序；有順序用 P、無順序用 C。","檢查 0≤r≤n 後代入公式。"],"worked":"從 5 人選隊長、副隊長：P(5,2)=20；只選 2 人小組：C(5,2)=10。","trap":"不要把「是否有順序」跟「是否有重複」混為一談；兩個維度可以獨立變動。","code":"from math import comb,perm\nprint(perm(5,2),comb(5,2))","quiz":[{"q":"5 人選 2 人委員，不分職位共有？","a":["20","10","5","25"],"correct":1,"hint":"無順序用 C。","why":"C(5,2)=10。"},{"q":"5 人選冠亞軍，名次不同算不同共有？","a":["10","15","20","25"],"correct":2,"hint":"有順序用 P。","why":"P(5,2)=5×4=20。"},{"q":"C(n,0) 的值為？","a":["0","1","n","n!"],"correct":1,"hint":"從 n 個物品一個也不選只有一種方法。","why":"空選法恰為 1。"}]},{"id":10,"title":"容斥原理","category":"組合計數","tag":"Inclusion-Exclusion","mins":40,"lab":"inclusion","question":"兩張重疊的名單，怎麼不重複計數？","analogy":"兩個社團的總人數，不能直接把各社人數加起來，因為雙社社員會重複。","core":"|A∪B|=|A|+|B|−|A∩B|；對三集合要再加回三者交集。容斥原理交替加減以修正重複。","concepts":["雙集合：|A∪B|=|A|+|B|−|A∩B|。","三集合：先加單集合，減雙交集，再加三交集。","互斥集合的交集為空，才可直接加總。","容斥也能計算「至少符合一個條件」的機率。"],"steps":["先分辨研究母體與各集合。","將重複計到的交集扣掉。","核對結果介於最大單集合數與總和之間。"],"worked":"喜歡茶的 15 人、喜歡咖啡的 12 人，兩者都喜歡 5 人，至少一種有 15+12−5=22 人。","trap":"沒有「至少一種」與「恰好一種」的區別，常導致公式套錯。","code":"A=set(range(15));B=set(range(10,22))\nprint(len(A|B),len(A)+len(B)-len(A&B))","quiz":[{"q":"|A|=9、|B|=8、|A∩B|=3，聯集大小？","a":["20","14","17","3"],"correct":1,"hint":"把重複算的交集扣一次。","why":"9+8−3=14。"},{"q":"兩集合互斥代表？","a":["A=B","A∩B=∅","A⊆B","A∪B=∅"],"correct":1,"hint":"同時屬於兩者的元素不存在。","why":"互斥 = 交集為空。"},{"q":"三集合容斥最後一項要？","a":["減三重交集","加三重交集","乘三重交集","忽略三重交集"],"correct":1,"hint":"三重交集被先加 3 次再減 3 次。","why":"必須再加一次三重交集。"}]},{"id":11,"title":"遞迴關係與閉合形式","category":"遞迴與數列","tag":"Recurrences","mins":50,"lab":"recurrence","question":"為什麼遞迴程式的時間可能呈指數成長？","analogy":"存錢每月增加固定金額是遞迴，費波那契數列則以之前兩個狀態推下一個。","core":"遞迴關係描述序列項之間的依賴；初始條件決定唯一解。演算法常用 T(n) 描述遞迴成本。","concepts":["F(0)=0,F(1)=1,F(n)=F(n−1)+F(n−2)。","同一遞迴若初始值不同，通常有不同序列。","T(n)=T(n−1)+O(1) ⇒ T(n)=O(n)。","T(n)=2T(n/2)+O(n)（標準假設下）⇒ T(n)=Θ(n log n)。"],"steps":["寫清楚基本情況與遞迴式。","由已知項逐一推出新項。","求複雜度時要同時計算遞迴分支數與每層工作量。"],"worked":"F(0..7)=0,1,1,2,3,5,8,13。純遞迴 Python 會重複算大量重疊子問題，動態規劃可消除重算。","trap":"「遞迴關係的數列長得快」不代表「計算這個數列的演算法一定慢」，需區分數值成長與演算法成本。","code":"def fib(n):\n    a,b=0,1\n    for _ in range(n):a,b=b,a+b\n    return a\nprint([fib(i) for i in range(8)])","quiz":[{"q":"若 F(0)=0,F(1)=1，F(5) 為？","a":["3","5","8","13"],"correct":1,"hint":"從前兩項相加。","why":"0,1,1,2,3,5。"},{"q":"遞迴關係要確定唯一序列，通常還需？","a":["排序方式","初始條件","圖的邊數","模數"],"correct":1,"hint":"從哪裡開始算？","why":"缺乏基底通常無法唯一決定序列。"},{"q":"T(n)=T(n−1)+O(1) 的時間階通常為？","a":["O(1)","O(log n)","O(n)","O(2ⁿ)"],"correct":2,"hint":"每次 n 少 1，約做 n 次。","why":"累加 n 次常數工作，得到 O(n)。"}]},{"id":12,"title":"生成函數","category":"遞迴與數列","tag":"Generating Functions","mins":50,"lab":"genfunc","question":"能把整條數列變成一個代數式嗎？","analogy":"生成函數像「壓縮包」：係數分別記錄各項數列，代數運算則對應數列組合。","core":"普通生成函數 A(x)=Σₙ≥₀ aₙxⁿ，是形式冪級數；重點常是係數，而非把 x 當數字求值。","concepts":["對常數 1 數列，A(x)=1/(1−x)，視為形式冪級數。","對 aₙ=n，A(x)=x/(1−x)²。","兩生成函數相乘，其 xⁿ 係數是卷積 cₙ=Σₖ aₖ bₙ₋ₖ。","生成函數可用於解線性遞迴、組合計數、分配問題。"],"steps":["先列出 a₀,a₁,a₂,…。","把數列編碼為 Σ aₙxⁿ。","需要組合物件時用多項式相乘，讀出目標次方係數。"],"worked":"若 A(x)=1+x+x²、B(x)=1+x，則 A(x)B(x)=1+2x+2x²+x³；係數 2 表示總次數 1 有 2 種拆分。","trap":"生成函數中的無限級數可以當形式符號操作；不要在沒有收斂條件時直接宣稱對所有實數 x 都成立。","code":"A=[1,1,1];B=[1,1]\nC=[sum(A[i]*B[k-i] for i in range(len(A)) if 0<=k-i<len(B)) for k in range(len(A)+len(B)-1)]\nprint(C)","quiz":[{"q":"數列 1,1,1,… 的普通生成函數是？","a":["x/(1−x)²","1/(1−x)","eˣ","1−x"],"correct":1,"hint":"想等比級數 1+x+x²+…。","why":"形式冪級數等於 1/(1−x)。"},{"q":"相乘兩個生成函數，係數對應？","a":["逐項差","卷積","微分","排序"],"correct":1,"hint":"考慮各種次方如何相加得到 n。","why":"乘法的第 n 項是所有指數分拆的係數乘積之和。"},{"q":"A(x)=1+x，A(x)² 的 x 項係數？","a":["0","1","2","4"],"correct":2,"hint":"(1+x)(1+x) 展開。","why":"1+2x+x²，係數為 2。"}]},{"id":13,"title":"整除、最大公因數與歐幾里得演算法","category":"數論","tag":"GCD & Euclid","mins":45,"lab":"euclid","question":"為什麼求 gcd 不必測遍所有整數？","analogy":"你想把長 252 與 105 的兩條緞帶切成相同最長段，切割與剩餘反覆進行就能找到答案。","core":"若 b|a 代表 a=kb。歐幾里得演算法利用 gcd(a,b)=gcd(b,a mod b)，直到餘數為 0。","concepts":["整除 a|b：存在整數 k 使 b=ak。","gcd(a,b) 是共同正因數中的最大者。","gcd(a,b)=gcd(b,a mod b) 是演算法正確性不變量。","擴展歐幾里得算法可求 ax+by=gcd(a,b) 的 Bézout 係數。"],"steps":["輸入非零非負整數 a,b。","每輪令 (a,b) ← (b,a mod b)。","當 b=0，a 即 gcd；可回代尋找 Bézout 係數。"],"worked":"252=2×105+42，105=2×42+21，42=2×21+0，所以 gcd(252,105)=21。","trap":"若輸入包含負數，需說明 gcd 通常取非負值；gcd(0,0) 的慣例視定義而異。","code":"def gcd(a,b):\n    while b:a,b=b,a%b\n    return a\nprint(gcd(252,105))","quiz":[{"q":"gcd(21,14) 為？","a":["1","3","7","14"],"correct":2,"hint":"7 能整除兩者。","why":"21 與 14 的最大公因數為 7。"},{"q":"歐幾里得演算法每步做？","a":["a,b=b,a%b","a,b=a+b,b","a,b=a*b,b","a,b=b,0"],"correct":0,"hint":"餘數不會改變 gcd。","why":"gcd(a,b)=gcd(b,a mod b)。"},{"q":"252 除以 105 的餘數？","a":["21","42","63","105"],"correct":1,"hint":"252−2×105。","why":"餘數為 42。"}]},{"id":14,"title":"模運算、同餘與 RSA 基礎","category":"數論","tag":"Modular Arithmetic","mins":50,"lab":"mod","question":"時鐘、循環索引與公開金鑰有何關聯？","analogy":"時鐘過 12 點從 1 點重新開始；模運算也是把整數按餘數分類。","core":"a≡b(mod m) 表示 m|(a−b)。若 gcd(a,m)=1，則 a 在模 m 下存在乘法反元素。","concepts":["模運算下可先對加法、乘法取餘數。","不是每個整數都有模逆：a 的模 m 逆元存在 iff gcd(a,m)=1。","快速冪用平方遞減指數，約 O(log e) 次乘法。","RSA 基於模冪與數論，但安全性需合格金鑰產生、填充與實作；教學小數字不安全。"],"steps":["選定正模數 m。","將整數化為 0…m−1 的標準代表元。","需要逆元時先用 gcd(a,m) 檢查互質。"],"worked":"17 mod 5=2；3×5≡1(mod 7)，所以 3 在模 7 的乘法反元素是 5。","trap":"不要將整數除法直接搬到模運算中；只有除數可逆時才能合法約去。","code":"print(17%5)\nprint(pow(3,5,7))\nprint(pow(3,-1,7))  # 5","quiz":[{"q":"17 mod 5 等於？","a":["1","2","3","4"],"correct":1,"hint":"17=3×5+2。","why":"餘數 2。"},{"q":"3 在模 7 下的逆元？","a":["2","3","4","5"],"correct":3,"hint":"找 x 使 3x mod 7=1。","why":"3×5=15≡1(mod7)。"},{"q":"若 gcd(a,m)≠1，a 的模 m 乘法逆元？","a":["必存在","不存在","等於 0","一定是 a"],"correct":1,"hint":"互質是逆元存在的充要條件。","why":"不互質時無法求 1 的乘法表示。"}]},{"id":15,"title":"圖與握手引理","category":"圖論","tag":"Graphs & Degrees","mins":45,"lab":"graph","question":"社群關係、路網與服務依賴如何抽象成圖？","analogy":"城市是點、道路是線；抽象成圖後，才能用通用演算法處理關係問題。","core":"圖 G=(V,E) 由頂點 V、邊 E 組成。無向圖的度數和等於 2|E|，稱握手引理。","concepts":["無向邊 {u,v} 不分方向；有向邊 (u,v) 有方向。","無向圖每條非自迴圈邊對兩端各貢獻一次度數。","任意有限無向圖的奇度數頂點數必為偶數。","鄰接串列適合稀疏圖；鄰接矩陣適合常數時間查邊但需要 Θ(|V|²) 空間。"],"steps":["列出頂點及邊集合。","統計每點連到多少條邊。","把度數相加並比對 2×邊數。"],"worked":"路徑 A–B–C 加上 A–C，三個頂點度數各是 2，總度數 6=2×3。","trap":"圖論中的「度」與角度無關；自迴圈在無向圖的度數計 2。","code":"edges=[(0,1),(1,2),(2,0)]\ndeg=[sum(i in e for e in edges) for i in range(3)]\nprint(deg,sum(deg)==2*len(edges))","quiz":[{"q":"無向圖有 5 條邊，度數總和？","a":["5","10","25","不一定"],"correct":1,"hint":"每條邊貢獻兩端。","why":"握手引理 Σdeg(v)=2|E|=10。"},{"q":"有限無向圖的奇度頂點數必？","a":["奇數","偶數","質數","零"],"correct":1,"hint":"所有度數之和是偶數。","why":"奇數相加要得偶數，個數必偶。"},{"q":"稀疏圖通常適合用？","a":["鄰接串列","巨大完整鄰接矩陣","ASCII 字串","只有堆疊"],"correct":0,"hint":"只存實際存在的鄰居。","why":"鄰接串列通常為 O(V+E) 空間。"}]},{"id":16,"title":"BFS、DFS 與連通性","category":"圖論","tag":"Graph Traversal","mins":50,"lab":"traverse","question":"怎麼找一群人是否彼此可達？","analogy":"BFS 像水波由近到遠擴散；DFS 像走迷宮先走到底再折返。","core":"BFS 用佇列逐層探索，能求無權圖的最少邊數路徑；DFS 用遞迴或堆疊深入探索。","concepts":["BFS 無權最短路的距離是邊數，不是任意加權成本。","DFS 適合連通分量、拓樸排序與回溯搜尋。","鄰接串列表示下，兩者時間 O(V+E)。","遍歷順序可能依鄰居排序而異，不能把某一順序當成唯一答案。"],"steps":["從指定起點入列（或入堆疊）並標記。","重複取出節點，檢查未探索鄰居。","訪問結束時，已見節點即起點可達的分量。"],"worked":"圖 A–B、A–C、B–D、C–E，BFS(A) 的典型順序為 A,B,C,D,E；DFS 可能是 A,B,D,C,E。","trap":"如果使用 DFS 尋找無權最短路，可能找不到最少邊數的路徑。","code":"from collections import deque\ng={0:[1,2],1:[0,3],2:[0,4],3:[1],4:[2]}\nq=deque([0]);seen={0}\nwhile q:\n    v=q.popleft();print(v)\n    for w in g[v]:\n        if w not in seen:seen.add(w);q.append(w)","quiz":[{"q":"無權圖求最少邊數路徑常用？","a":["DFS","BFS","Merge Sort","K-means"],"correct":1,"hint":"按層探索、先看到距離 1 再距離 2。","why":"BFS 逐層可求無權最短路。"},{"q":"BFS 的關鍵資料結構？","a":["Queue","Heap","HashMap 必不可少","Binary Search"],"correct":0,"hint":"先進先出才能按層展開。","why":"用 FIFO 佇列。"},{"q":"BFS/DFS 鄰接串列版時間複雜度？","a":["O(V+E)","O(VE²)","O(2ᵛ)","O(1)"],"correct":0,"hint":"每點與每邊都只處理常數次。","why":"O(V+E)。"}]},{"id":17,"title":"Euler 路徑與 Hamilton 路徑","category":"圖論","tag":"Paths and Cycles","mins":45,"lab":"euler","question":"走遍每條路一次與拜訪每個城市一次，是兩個不同問題！","analogy":"郵差想每條街恰好走一次（Euler）；旅行者想每個城市恰好訪問一次（Hamilton）。","core":"Euler trail 重點是每條邊恰一次；Hamilton path 重點是每個頂點恰一次，兩者判定難度差異很大。","concepts":["連通的非零度子圖若所有頂點度數偶數，存在 Euler 迴路。","恰好 2 個奇度頂點，存在開放 Euler 路徑但無 Euler 迴路。","Euler 判定有簡單度數條件；Hamilton 一般圖無類似簡單充分必要度數判準。","無向圖若有孤立點，Euler 條件看非零度子圖是否連通。"],"steps":["統計每個頂點度數。","檢查所有非孤立點是否連通。","奇度點數為 0/2/其他，分別判斷迴路/開放路徑/不存在。"],"worked":"路徑 A–B–C 的端點 A,C 為奇度，所以有 Euler 路徑 A→B→C，但無 Euler 迴路。","trap":"Euler 條件只處理「每邊」一次，不適用「每點」一次的 Hamilton 問題。","code":"def euler_kind(degrees):\n    odd=sum(d%2 for d in degrees)\n    return \"circuit\" if odd==0 else \"trail\" if odd==2 else \"none\"\nprint(euler_kind([1,2,1]))","quiz":[{"q":"Euler 路徑主要要求？","a":["每個點恰一次","每條邊恰一次","最短總距離","圖無迴路"],"correct":1,"hint":"Euler 解「走街道」問題。","why":"Euler path 遍歷每條邊恰好一次。"},{"q":"連通無向圖恰有 2 個奇度頂點？","a":["一定有 Euler 迴路","有開放 Euler 路徑","必無 Euler 路徑","必有 Hamilton 迴路"],"correct":1,"hint":"0 奇度才能回起點，2 奇度從一端走到另一端。","why":"恰兩個奇度點存在開放 Euler path。"},{"q":"Hamilton 路徑主要要求？","a":["每條邊走過","每個頂點恰一次","每條邊權重相同","所有頂點偶度"],"correct":1,"hint":"Hamilton 解「拜訪城市」問題。","why":"Hamilton 重點是每個頂點。"}]},{"id":18,"title":"樹、生成樹與二元樹","category":"圖論","tag":"Trees","mins":45,"lab":"tree","question":"目錄階層、語法樹與網路無迴圈骨架有什麼共同點？","analogy":"公司組織架構像樹；每位成員往上只有一路徑，沒有循環指揮關係。","core":"無向樹是連通且無環的圖。含 n 頂點的樹恰有 n−1 條邊，任兩點之間有唯一簡單路徑。","concepts":["等價刻畫：連通且無環；或連通且 |E|=|V|−1。","加入一條樹外邊必產生一個迴路；移除任一邊則不再連通。","二元樹每個節點最多兩個子節點。","最小生成樹（MST）用於連通無向加權圖，最小化覆蓋所有頂點的邊權總和。"],"steps":["給定節點與邊，確認連通性。","檢查邊數是否 n−1、是否有環。","用 DFS/BFS 或 Union-Find 驗證樹特性。"],"worked":"5 個頂點的無向樹恰有 4 條邊；若在已連通的樹上再加邊，會產生環。","trap":"「每個節點至多有兩個子節點」是二元樹條件，但不是「高度必是 log n」；偏斜二元樹高度可達 n。","code":"n=6\nprint(\"edges in tree\",n-1)\n# 驗證樹也要考慮連通性與無環","quiz":[{"q":"n 個頂點的樹有幾條邊？","a":["n","n−1","n+1","2n"],"correct":1,"hint":"任何樹都是無環連通。","why":"樹的邊數為 n−1。"},{"q":"對一棵樹加入非既有邊會？","a":["保持無環","產生環","刪除頂點","變成有向圖"],"correct":1,"hint":"樹中本來兩頂點間已有唯一簡單路徑。","why":"加一條邊封閉路徑形成環。"},{"q":"二元樹的定義限制？","a":["最多兩個子節點","必有兩個子節點","所有葉高度相同","一定平衡"],"correct":0,"hint":"binary 指子節點數上限。","why":"允許 0、1 或 2 個子節點。"}]},{"id":19,"title":"偏序、Hasse 圖與格","category":"集合與關係","tag":"Partial Orders","mins":50,"lab":"poset","question":"任務依賴與版本相容性為何不是線性順序？","analogy":"專案任務只能比較一部分先後關係：有些任務彼此不依賴，沒有誰一定先。","core":"偏序是自反、反對稱、遞移的二元關係；Hasse 圖省略自反邊及遞移冗餘邊，只畫覆蓋關係。","concepts":["全序任意兩元素可比較；偏序允許不可比較的元素。","a≺b 為覆蓋關係，若 a<b 且不存在 a<c<b。","格（lattice）要求任兩元素存在唯一的最小上界（join）與最大下界（meet）。","集合以 ⊆ 排序形成格；join 是聯集、meet 是交集。"],"steps":["選定元素集合與順序關係，例如整除。","列出可比較對，省略 a=a 的反射邊。","移除由其他中間元素推得的遞移邊，形成 Hasse 圖。"],"worked":"在 {1,2,3,6} 以整除排序，Hasse 覆蓋邊為 1→2、1→3、2→6、3→6；2 與 3 不可比較。","trap":"Hasse 圖的向上線條不是一般有向圖中的任意邊；它特意刪去了自反與遞移邊。","code":"A=[1,2,3,6]\nprint([(a,b) for a in A for b in A if a!=b and b%a==0])","quiz":[{"q":"偏序要求哪些性質？","a":["自反、反對稱、遞移","對稱、反對稱、反自反","只有對稱","只有傳遞"],"correct":0,"hint":"請和「等價關係」比較。","why":"偏序三性質為自反、反對稱、遞移。"},{"q":"Hasse 圖通常會省略？","a":["所有邊","自反與遞移邊","所有頂點","不可比較資訊"],"correct":1,"hint":"僅保留覆蓋關係。","why":"Hasse 圖省去自反與傳遞冗餘邊。"},{"q":"以集合包含 ⊆ 作偏序，join(A,B) 是？","a":["A∩B","A∪B","A−B","∅"],"correct":1,"hint":"最小的共同上界要同時包含 A 與 B。","why":"join 就是聯集。"}]},{"id":20,"title":"布林代數與數位邏輯電路","category":"邏輯","tag":"Boolean Algebra","mins":45,"lab":"circuit","question":"CPU 的加法器為什麼可用 AND、OR、NOT 組成？","analogy":"布林閘是只能接受 0/1 的小零件；許多零件組合成電腦的算術與控制電路。","core":"布林代數以 0/1 表示真假，XOR、AND、OR、NOT 可組出加法器。半加器 Sum=A⊕B，Carry=A∧B。","concepts":["XOR 當兩輸入不同時為 1。","半加器只有 2 個輸入，Sum=A⊕B、Carry=A∧B。","全加器加入 Carry-in：Sum=A⊕B⊕Cin。","NAND 或 NOR 可作為功能完備閘（可表示任意布林函數）。"],"steps":["設定二進位輸入 A、B，必要時 Cin。","先求 XOR 作和位。","對 Carry 使用 AND（半加器）或多項布林式（全加器）。"],"worked":"A=1、B=1 的半加器：Sum=0、Carry=1，代表二進位 1+1=10。","trap":"半加器不能處理上一位傳來的進位 Cin；要串接多位元加法通常需要全加器。","code":"for a,b in [(0,0),(0,1),(1,0),(1,1)]:\n    print(a,b,\"sum\",a^b,\"carry\",a&b)","quiz":[{"q":"半加器 Sum 的公式？","a":["A∧B","A∨B","A⊕B","¬A"],"correct":2,"hint":"1+1 的和位是 0。","why":"XOR 對不同輸入才輸出 1。"},{"q":"1+1 的半加器 Carry？","a":["0","1","2","不定"],"correct":1,"hint":"二進位 10 的高位。","why":"Carry=A AND B=1。"},{"q":"半加器沒有考慮？","a":["A","B","Cin","Sum"],"correct":2,"hint":"多位元加法需要傳入上一位進位。","why":"半加器不處理 Carry-in。"}]},{"id":21,"title":"離散機率與條件機率","category":"機率","tag":"Discrete Probability","mins":50,"lab":"prob","question":"推薦系統、測試與抽樣推論怎麼算機率？","analogy":"從袋中隨機抽球，是有限樣本空間的入門例子；條件機率等於先縮小可觀察世界。","core":"有限且等可能的樣本空間中，P(A)=|A|/|Ω|。條件機率 P(A|B)=P(A∩B)/P(B)，P(B)>0。","concepts":["獨立 P(A∩B)=P(A)P(B)，與互斥是不同概念。","Bayes：P(A|B)=P(B|A)P(A)/P(B)。","期望值 E[X]=Σx xP(X=x)，是加權平均。","二項分布 P(X=k)=C(n,k)pᵏ(1−p)ⁿ⁻ᵏ，前提為固定次數、獨立且成功機率固定。"],"steps":["明確定義所有基本結果的樣本空間。","列出事件 A、B 的結果集合。","依等可能或已知分布計算聯集、交集與條件機率。"],"worked":"公平六面骰，A=偶數、B=大於 3，A∩B={4,6}，P(A|B)=2/3，因 B={4,5,6}。","trap":"互斥不表示獨立：若 P(A)>0,P(B)>0，互斥事件反而不可能獨立。","code":"omega=range(1,7)\nA={x for x in omega if x%2==0}\nB={x for x in omega if x>3}\nprint(len(A&B)/len(B))","quiz":[{"q":"公平六面骰擲出偶數機率？","a":["1/6","1/3","1/2","2/3"],"correct":2,"hint":"2,4,6 三個結果。","why":"3/6=1/2。"},{"q":"P(A|B) 的分母是？","a":["P(A)","P(B)","P(A∩B)","1−P(B)"],"correct":1,"hint":"事件 B 已知發生。","why":"P(A|B)=P(A∩B)/P(B)。"},{"q":"獨立事件滿足？","a":["P(A∩B)=0","P(A∩B)=P(A)P(B)","A⊆B","A=B"],"correct":1,"hint":"獨立表示知道 A 不改變 B 的機率。","why":"獨立事件的交集機率為兩者機率乘積。"}]},{"id":22,"title":"有限自動機與形式語言","category":"自動機","tag":"Finite Automata","mins":50,"lab":"dfa","question":"如何用簡單狀態機識別字串模式？","analogy":"驗票閘門只需記住幾個狀態，不必記住乘客所有歷史；DFA 也是靠有限狀態決定接受與否。","core":"確定性有限自動機 DFA=(Q,Σ,δ,q₀,F)，每個狀態對每個輸入字元都有唯一下一狀態。","concepts":["Q 是有限狀態集合，Σ 是字母表，δ:Q×Σ→Q 是轉移函數。","從初始狀態 q₀ 逐字元轉移，最後落在 F 才接受。","DFA 可辨識正規語言，但不能辨識所有上下文無關語言。","有限狀態記憶力有限，無法一般性地計數任意深度的巢狀括號。"],"steps":["決定要接受的模式，例如所有以 01 結尾的二進位字串。","設計追蹤相關尾碼的少數狀態。","逐字元依轉移表移動，最終判斷是否處於接受狀態。"],"worked":"接受「以 01 結尾」的 DFA 可設 q0（不匹配）、q1（尾碼 0）、q2（尾碼 01 且接受）；字串 1101 可接受，1010 不可。","trap":"只有在讀完全部字元後才看是否接受；中途進入接受狀態，後續字元仍可能使結果不接受。","code":"def accept(s):return s.endswith(\"01\")\nfor s in [\"01\",\"1101\",\"1010\"]:print(s,accept(s))","quiz":[{"q":"DFA 的接受條件是？","a":["中途曾進接受狀態","讀完後位於接受狀態","任意狀態都接受","字串必長度偶數"],"correct":1,"hint":"最後一個字元處理完再判斷。","why":"最終狀態屬於 F 才接受。"},{"q":"DFA 每個狀態對每個字元的轉移有幾個？","a":["0 或多個","恰好 1 個","至少 2 個","無限個"],"correct":1,"hint":"D 是 deterministic。","why":"δ 是函數 Q×Σ→Q。"},{"q":"DFA 能辨識哪些語言？","a":["所有語言","正規語言","所有圖","所有可計算語言"],"correct":1,"hint":"DFA 能力有界。","why":"DFA 與正規表達式辨識相同一類正規語言。"}]},{"id":23,"title":"迴圈不變量與演算法正確性","category":"證明與歸納","tag":"Loop Invariants","mins":50,"lab":"invariant","question":"程式跑出正確範例，為何還不能說演算法正確？","analogy":"迴圈不變量是每次迴圈檢查時都成立的保證，就像接力賽每棒都必須持有接力棒。","core":"要證明迴圈正確性，常證初始化、保持性、終止時的不變量結合退出條件能推出結果；另需證明終止。","concepts":["初始化：第一次進入迴圈前不變量成立。","保持性：假設本輪前成立，本輪執行後仍成立。","終止時：結合停止條件與不變量導出後置條件。","總正確性需要部分正確性加上終止證明（例如嚴格遞減變量）。"],"steps":["指定演算法的前置、後置條件。","提出足以連結每一步與結果的不變量。","逐一檢查初始化、保持、終止與終止性。"],"worked":"求 1…n 的和：處理完 i 個數後維持 s=1+⋯+i。初始化 i=0,s=0；更新 s←s+i+1、i←i+1；結束 i=n 得目標。","trap":"不變量不是「程式每次都有進步」；應是具體、可檢查、可用於證明結果的性質。","code":"n=5;s=0\nfor i in range(1,n+1):\n    s+=i\n    assert s==i*(i+1)//2\nprint(s)","quiz":[{"q":"迴圈不變量證明哪一步確保開始時成立？","a":["終止","初始化","保持性","排序"],"correct":1,"hint":"第一次迭代前先驗證。","why":"Initialization 指第一次迴圈前成立。"},{"q":"部分正確性加上什麼得到總正確性？","a":["更多註解","終止性","隨機測試","速度提升"],"correct":1,"hint":"如果程式永遠不結束，是否符合預期？","why":"需要證明程式會終止。"},{"q":"迴圈不變量的保持性是？","a":["只在第一輪成立","前一輪成立推得下一輪也成立","只要輸出正確就成立","需每輪人工修正"],"correct":1,"hint":"對任意一輪做歸納步驟。","why":"保持性確保執行一步不破壞條件。"}]}];

function h(v){return String(v).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
const bool=v=>v?'真':'假';
function table(headers,rows,mark=-1){return `<div class="tablewrap"><table class="matrix"><thead><tr>${headers.map(s=>`<th>${h(s)}</th>`).join('')}</tr></thead><tbody>${rows.map((r,i)=>`<tr class="${i===mark?'selected':''}">${r.map(c=>`<td>${h(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;}
function pill(items,color=''){return `<div class="chipslab">${items.map(x=>`<span class="labpill ${color}">${h(x)}</span>`).join('')}</div>`;}
function stage(label,desc,visual='',sub=''){return {label,desc,visual,sub};}
function block(label,text){return `<div class="boxnum"><span class="minor">${h(label)}</span><strong>${h(text)}</strong></div>`;}
function metric(pairs){return `<div class="labmetrics">${pairs.map(([k,v])=>block(k,v)).join('')}</div>`;}
function bars(vals,hot=[]){let max=Math.max(1,...vals);return `<div class="bars">${vals.map((v,i)=>`<div class="barcol"><div class="bar ${hot.includes(i)?'hot':''}" style="height:${Math.round(12+v/max*87)}%"></div><b>${h(v)}</b><span>${i}</span></div>`).join('')}</div>`;}
function graphView(names,edges,active=[],opt={}){const n=names.length;const pos=names.map((_,i)=>({x:170+Math.cos(-Math.PI/2+i*2*Math.PI/n)*123,y:150+Math.sin(-Math.PI/2+i*2*Math.PI/n)*103}));const lines=edges.map(e=>{let [u,v]=e;return `<line x1="${pos[u].x}" y1="${pos[u].y}" x2="${pos[v].x}" y2="${pos[v].y}" stroke="${active.includes(u)&&active.includes(v)?'#79f8d2':'#586e91'}" stroke-width="${active.includes(u)&&active.includes(v)?'3':'2'}"/>`;}).join('');return `<div class="graphpad"><svg viewBox="0 0 340 300" role="img" aria-label="圖論節點及其邊">${lines}${names.map((name,i)=>`<circle cx="${pos[i].x}" cy="${pos[i].y}" r="22" fill="${active.includes(i)?'#8ff2cf':'#1b3051'}" stroke="${active.includes(i)?'#cff8e6':'#82a8e6'}" stroke-width="2"/><text x="${pos[i].x}" y="${pos[i].y+5}" fill="${active.includes(i)?'#08251f':'#f6faff'}" text-anchor="middle" font-size="15" font-weight="750">${h(name)}</text>`).join('')}</svg></div>`;}
function gcd(a,b){while(b)[a,b]=[b,a%b];return a;}
function C(n,r){if(r<0||r>n)return 0;r=Math.min(r,n-r);let v=1;for(let i=1;i<=r;i++)v=v*(n-i+1)/i;return Math.round(v);}
function labFrames(type,v){let f=[];const push=(title,explain,visual='',sub='')=>f.push(stage(title,explain,visual,sub));

 const answer=e.target.closest('[data-answer]');if(answer&&state.id!==null){const [qi,choice]=answer.dataset.answer.split(':').map(Number),c=COURSES[state.id],q=c.quiz[qi];if(!state.answers[c.id])state.answers[c.id]={};if(state.answers[c.id][qi])return;
  const key=`${c.id}-${qi}`;if(choice===q.correct){state.answers[c.id][qi]=true;state.attempts[key]=0;if(Object.values(state.answers[c.id]).filter(Boolean).length===3){state.done[c.id]=true;toast('✓ 已通過本章測驗！');}else toast('✓ 正確');persist();render();}else{state.attempts[key]=(state.attempts[key]||0)+1;state[`wrong_${c.id}_${qi}`]=choice;renderPanel();}return}
 const copy=e.target.closest('[data-copy]');if(copy){let text=copy.dataset.copy==='notes'?(state.notes[state.id]||''):COURSES[state.id].code;if(!text){toast('目前沒有可以複製的內容');return}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast('已複製到剪貼簿')).catch(()=>toast('瀏覽器限制複製，請手動選取內容'));}else toast('請手動選取內容複製');return}
 if(e.target.closest('#themeBtn')){state.theme=state.theme==='dark'?'light':'dark';persist();setTheme();return}
 if(e.target.closest('#menuBtn')){$('sidebar').classList.toggle('open');$('overlay').classList.toggle('open');return}
 if(e.target.closest('#overlay')){$('sidebar').classList.remove('open');$('overlay').classList.remove('open');return}
});
document.addEventListener('change',e=>{const t=e.target;if(t.matches('[data-field]')&&state.id!==null){const c=COURSES[state.id],id=state.id,key=t.dataset.field;if(!state.labValues[id])state.labValues[id]={};state.labValues[id][key]=t.type==='range'||t.type==='number'?Number(t.value):t.value;state.frameIndices[id]=0;renderPanel();}});
document.addEventListener('input',e=>{if(e.target.id==='notes'&&state.id!==null){state.notes[state.id]=e.target.value;persist();/* Autosaved in localStorage */}if(e.target.id==='search'){state.filter=e.target.value;sidebar();}if(e.target.matches('[data-field][type=range]')){let span=e.target.nextElementSibling;if(span&&span.classList.contains('labvalue'))span.textContent=e.target.value;}});
$('themeBtn').addEventListener('click',()=>{});
render();
</script></body></html>
