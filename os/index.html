const lessons = [{"id":0,"unit":"基礎","title":"電腦到底如何執行程式？","short":"從 0、1 到 CPU 指令","minutes":18,"icon":"▣","ask":"當你按下「執行 Python」，真正開始動的是誰？","analogy":"把 CPU 想成只會依照菜譜一步一步做菜的廚師；RAM 是工作檯，SSD 是倉庫；暫存器是廚師手上正拿著的材料。作業系統是廚房的調度者，負責讓很多人安全共用廚房。","why":"CPU 不理解 Python 或 C 的語法，只執行機器指令。程式執行前，需先取得可執行指令與執行環境；OS 建立行程、安排記憶體與執行緒，CPU 才能取得指令。","details":[["指令週期","簡化成 Fetch（取指）→ Decode（解碼）→ Execute（執行）→ Retire（提交）。真實 CPU 可能管線化、亂序執行；這裡先抓住邏輯。"],["關鍵暫存器","PC / IP 指向下一個待執行的指令位置；SP 指向堆疊；一般暫存器保存運算數或結果。PC 不是行程 ID。"],["記憶體階層","暫存器、快取、RAM、SSD：通常越接近 CPU 越快且越小。檔案在 SSD 上，執行時會用到 RAM（含快取與虛擬記憶體）。"],["從硬體推導 OS","單個 CPU 核心在同一個硬體執行脈絡中，瞬間只能沿著一個指令流進行。多工作需要排程、時脈中斷，以及儲存／恢復執行狀態。"]],"steps":["程式碼經編譯或解譯環境準備成可執行指令","OS 建立執行環境、位址空間與執行緒","CPU 從 PC 指示的位置取出指令","重複取指、解碼、執行；必要時與 OS 互動"],"caveat":"「CPU 每秒只跑一個程式」並不精確：現代 CPU 有多核心、SMT，也可能指令並行。先以「單一邏輯核心」思考，之後再擴展。","lab":"cpu","code":["C","int a = 7;\nint b = 5;\nint c = a + b;   // 編譯後才是 CPU 能執行的指令"],"quiz":[["下面哪一個最接近 PC（Program Counter）的作用？",["目前使用多少 RAM","指出接下來預期執行的指令位置","記錄程式總行數"],1,"想想 CPU 需要知道「下一步去哪裡」","PC / IP 追蹤指令流位置。"],["為什麼程式檔案存在 SSD，卻仍需要 RAM？",["CPU 通常透過記憶體階層存取正在執行的指令與資料","SSD 不能儲存程式","RAM 會永久保留資料"],0,"SSD 與 RAM 在速度、存取模型與角色有差別","OS 與硬體利用 RAM／快取提供執行中所需的資料與指令。"]]},{"id":1,"unit":"基礎","title":"Kernel 與 System Call","short":"程式如何請作業系統幫忙","minutes":17,"icon":"◇","ask":"為什麼你的程式不能直接替所有程序修改記憶體？","analogy":"應用程式像住客，核心像大樓管理員。住客不能直接打開其他房間；要開門、使用公共設施，必須透過有檢查權限的櫃台。","why":"特權模式是硬體協助實現的保護邊界。User mode 限制危險操作；Kernel mode 才能執行特權指令與管理保護資源。","details":[["Kernel 與作業系統","Kernel 是 OS 中具有特權且核心的部分；OS 還可包括系統函式庫、工具、服務。"],["System Call","程式透過標準 API，最終可能觸發 syscalls，例如 read、write、open、fork。函式呼叫不等於系統呼叫，printf 也不等於單一 write。"],["Interrupt vs Exception","硬體中斷（interrupt）通常由外部裝置／時脈觸發；exception 由當前指令引起；system call 是程式主動受控進入核心的機制。"],["切換成本","進出 kernel mode 不一定就是 context switch。Context switch 涉及切換執行的執行緒／行程與相關執行狀態。"]],"steps":["應用程式執行到 read() 等函式","必要時呼叫系統呼叫介面，進入核心","核心驗證 fd、權限及資料位置","執行請求並回到使用者模式"],"caveat":"「有 system call 就一定換 Process」是錯的；模式切換（mode switch）與上下文切換（context switch）是兩個不同概念。","lab":"syscall","code":["C","#include <unistd.h>\n\nint main(void) {\n    const char m[] = \"hello\\n\";\n    write(STDOUT_FILENO, m, sizeof(m) - 1);\n    return 0;\n}"],"quiz":[["呼叫 read() 時，哪項敘述最合理？",["必然產生新行程","可能經由系統呼叫由核心執行存取","可以略過任何權限檢查"],1,"想想檔案存取是公共資源操作","讀取涉及核心管控的資源，通常經 OS 系統呼叫處理。"],["System call 造成的模式切換，是否必然造成行程切換？",["是","否"],1,"模式和執行主體是不同維度","陷入核心可以在原執行緒上處理並返回，不必換行程。"]]},{"id":2,"unit":"執行","title":"Process：一個程式如何活起來？","short":"行程狀態、PCB、fork / exec","minutes":22,"icon":"◉","ask":"一個程式開兩次，會變成什麼？","analogy":"一份食譜（Program）能讓兩位廚師各自開工（兩個 Process）。同一份食譜，不代表他們共用同一張工作檯和材料。","why":"Process 是 OS 管理資源與位址空間的重要單位，而 Thread 是可執行、可排程的執行流。程式檔不是執行中的行程。","details":[["PCB","Process Control Block 會保存 PID、狀態、資源、排程和相關執行脈絡等資訊；具體欄位依 OS 實作不同。"],["五狀態模型","New → Ready → Running → Waiting / Blocked → Ready → Terminated，是真正 OS 複雜狀態的教學抽象。"],["fork / exec / wait","在 POSIX 世界，fork 建立子行程；exec 將當前行程的程式映像替換；wait 類呼叫回收子行程狀態。三者不是同一個動作。"],["Context switch","切出目前執行緒、儲存暫存器等必要狀態，再切入另一執行緒。快取/TLB 與位址空間的影響視情境與架構而定。"]],"steps":["行程建立後進入 Ready","Scheduler 選中，進入 Running","I/O 等待會進入 Blocked，完成後返回 Ready","完成執行，進入 Terminated"],"caveat":"「Blocked 就是在慢慢使用 CPU」是錯的。Blocked 的執行緒通常不占用 CPU 執行時間，正在等待事件。","lab":"process","code":["C","#include <unistd.h>\n#include <sys/wait.h>\n#include <stdio.h>\n\nint main(void) {\n  pid_t pid = fork();\n  if (pid == 0) puts(\"child\");\n  else if (pid > 0) { wait(NULL); puts(\"parent\"); }\n}"],"quiz":[["一個執行緒因等待磁碟 I/O 暫停，它最接近哪個狀態？",["Running","Blocked / Waiting","Terminated"],1,"等待事件 != 正在 CPU 上執行","I/O 等待中通常是 Blocked；完成後回到 Ready。"],["fork 與 exec 的關係是？",["fork 複製／建立子行程；exec 替換程式映像","fork 只開新 Thread；exec 只是暫停","兩者同義"],0,"一個關乎建立行程，另一個關乎載入不同程式","POSIX fork 與 exec 負責不同工作。"]]},{"id":3,"unit":"執行","title":"Thread 與並行","short":"共享資源、執行緒、Concurrency","minutes":16,"icon":"⋈","ask":"為什麼兩個 Thread 改同一個變數時會互相影響？","analogy":"一家公司（Process）有好幾位員工（Threads）。大家共用辦公室文件（位址空間），但各有自己的工作進度和筆記頁（PC、Stack、暫存器）。","why":"Thread 在一個行程中共享多數資源；這讓溝通便宜，也讓資料競爭更容易發生。Concurrency 是有多個進行中的工作，Parallelism 是同時用硬體執行。","details":[["共享與私有","同一 Process 的 Threads 通常共用 code、heap、全域資料與開啟的檔案；各自有 stack、PC、register context。"],["並行 vs 平行","單核也可 concurrency：工作 A、B 輪流；多核才可能同時在不同核心 parallel 執行。"],["I/O-bound vs CPU-bound","大量等待 I/O 的程式適合事件迴圈或並行 I/O；CPU-bound 要考慮核心數、語言 runtime 與同步成本。"],["Python / Go 的差別","Goroutine 是 Go runtime 管理的工作單位；Python asyncio task 由事件迴圈協作調度；它們不等於 OS thread。"]],"steps":["Process 配置共享的位址空間","多個 Thread 擁有各自 Stack 與 PC","OS／Runtime 決定何時執行每個工作","共同資料需要同步協定"],"caveat":"「Thread 越多一定越快」是錯的；切換、鎖、資源競爭和記憶體都可能拖慢速度。","lab":"race","code":["C","// 假設 x 為共享變數：\n// Thread A: x = x + 1;\n// Thread B: x = x + 1;\n// 兩行各自並非天生的原子操作。"],"quiz":[["同一 Process 裡的兩個 Thread，一般不共享什麼？",["Heap","Global data","各自的 Stack"],2,"想想每個執行流自己的函式呼叫紀錄","每個 Thread 有獨立 stack 與 PC；Heap 與全域變數通常共享。"],["Concurrency 一定需要兩個 CPU 核心嗎？",["需要","不需要"],1,"單核輪流切換是否也能處理多個工作？","單核交錯執行即有 concurrency，但不代表同時 parallel。"]]},{"id":4,"unit":"排程","title":"CPU Scheduling 動手算","short":"FCFS、SJF、SRTF、Round Robin","minutes":28,"icon":"▤","ask":"如果三個工作都在排隊，你會先服務誰？","analogy":"CPU 像只有一個窗口的櫃台。FCFS 先到先辦；SJF 先處理短單；Round Robin 每人輪流用固定時間。公平與整體效率未必一致。","why":"多個 Ready 執行緒競爭有限的 CPU 時間，Scheduler 決定下一個執行誰；不同政策影響等待時間、回應時間、周轉時間與公平性。","details":[["FCFS","先到先服務，非搶先式。簡單但長工作在前容易產生 convoy effect。"],["SJF／SRTF","SJF 選最短 CPU burst，非搶先；SRTF 可以被更短的剩餘工作搶先。實務上無法完美預知未來的 burst。"],["Round Robin","每個可執行工作輪流使用至多 q 單位時間，時間片太小會增加切換負擔，太大則接近 FCFS。"],["三個指標","Turnaround = completion − arrival；Waiting = turnaround − CPU burst（在單次 CPU burst、無 I/O 的教學模型）；Response = first start − arrival。"]],"steps":["每個工作先設定 Arrival 與 Burst","選擇排程策略及時間片","一次向前推進 1 tick，觀察 Gantt","比較完成時間、等待、回應、周轉"],"caveat":"下方是單 CPU、整數時間、無 I/O、無切換成本的教學模擬，不能直接等同 Linux CFS／EEVDF。","lab":"schedule","code":["Python","jobs = [(\"P1\", 0, 6), (\"P2\", 1, 3), (\"P3\", 2, 4)]\n# arrival, CPU burst\n# 計算 CT, TAT, WT, RT 時要先畫時間線"],"quiz":[["在教學模型中，Waiting Time 的計算方式？",["完成時間 - 到達時間 - CPU Burst","到達時間 + Burst","首次開始時間 - 到達時間"],0,"先算 Turnaround，再扣真正使用 CPU 的時間","WT = CT − AT − BT。"],["RR 的 time quantum 很大，大到所有工作都能一次做完時，它趨近？",["SRTF","FCFS","最佳優先權"],1,"每個工作輪到時都直接做完","當 q 不造成搶先，執行順序類似 FCFS。"]]},{"id":5,"unit":"並行","title":"Race Condition 與 Deadlock","short":"Mutex、Semaphore、原子性","minutes":25,"icon":"⚑","ask":"兩個執行緒各加 1，為何最後可能只加 1？","analogy":"兩個人同時拿到「庫存 10」的影印紙，都在紙上改成 11，最後貼回去的是 11 而非 12。這就是遺失更新（lost update）。","why":"x = x + 1 通常是讀、計算、寫等多步驟。當它們交錯執行，就可能覆蓋彼此結果。Mutex 用互斥保護 Critical Section。","details":[["Race Condition","結果依執行順序而變化，且至少一部分順序不受正確同步約束。Data race 在不同語言的記憶體模型下有更精確定義。"],["Mutex","一次只允許一個執行流進入被保護的臨界區。需要正確加鎖／解鎖，也應盡量縮短持鎖時間。"],["Semaphore","使用計數來協調可同時使用的資源數或事件數；不應當成任意的共用整數。"],["Deadlock","四個必要條件：互斥、持有並等待、不可搶奪、循環等待；只要破壞其中一項便能防止這類死鎖。"]],"steps":["兩個 Thread 都讀到 x=0","各自在本地算出 1","都將 1 寫回共享記憶體","若以 mutex 串行化，就能避免此交錯"],"caveat":"「加了 Mutex 就永遠正確」也不對：仍可能忘記保護其他共享狀態，或因不一致鎖順序導致死鎖。","lab":"race","code":["C","// 教學偽碼\nlock(m);\nx = x + 1;\nunlock(m);"],"quiz":[["兩個 Thread 對 x 同時執行 x++，結果錯誤通常因為？",["x++ 一定是單一不可分割指令","讀改寫的操作可能互相交錯","RAM 只能存放整數"],1,"把 x++ 拆成 load/add/store","一般情況下讀改寫不可假設天然具備原子性。"],["以下哪個不是 deadlock 的四個必要條件？",["循環等待","不可搶奪","CPU 使用率高"],2,"想想是資源等待關係，不是負載高低","CPU 使用率高並不是 Coffman 死鎖必要條件。"]]},{"id":6,"unit":"記憶體","title":"位址、分頁與 TLB","short":"虛擬位址如何變成實體位址","minutes":25,"icon":"⌗","ask":"為什麼不同程式都可能認為自己有從 0 開始的記憶體？","analogy":"每個住戶有自己的房間號碼（虛擬位址），但大樓總務知道真正的樓層與位置（實體位址）。同一個號碼在不同住戶的房間不是同一塊空間。","why":"虛擬記憶體提供隔離和簡化的位址模型。MMU 依頁表轉換虛擬位址；TLB 快取最近使用過的轉譯。","details":[["Page 與 Frame","虛擬位址切成等大 Pages；實體記憶體切成同大小的 Frames，頁表紀錄對應關係與權限。"],["VPN + Offset","Page Size = 2^k 時，offset 有 k bits；VPN = floor(VA / page size)，offset = VA mod page size。"],["位址轉譯","TLB hit 可較快取得對應；miss 需要查頁表。找不到有效映射可能發生 page fault，亦可能是非法存取。"],["保護","頁表還能提供可讀、可寫、可執行等保護資訊。不同 Process 可以對應到不同的實體框。"]],"steps":["輸入虛擬位址 VA","按 Page Size 拆成 VPN 與 offset","透過 TLB／頁表找到 PFN","PA = PFN × Page Size + offset"],"caveat":"Page Fault 不必然等於「硬碟太慢」：缺頁處理可能映射零頁、載入檔案、copy-on-write 或判定非法訪問。","lab":"paging","code":["Python","page_size = 4096\nva = 0x1234\nvpn, offset = divmod(va, page_size)\nprint(hex(vpn), hex(offset))"],"quiz":[["Page Size = 4 KiB 時，offset 需要幾個 bits？",["10","12","16"],1,"4 KiB = 4096 = 2 的幾次方？","4096 = 2^12，所以 offset 占 12 bits。"],["TLB 通常快取的是？",["虛擬位址到實體框等位址轉譯資訊","完整 SSD 的所有檔案","每個 Thread 的程式碼"],0,"「Translation Lookaside Buffer」的 Translation 是關鍵","TLB 主要快取位址轉譯以減少頁表存取。"]]},{"id":7,"unit":"記憶體","title":"Virtual Memory 與 Page Fault","short":"Demand Paging、FIFO、LRU","minutes":24,"icon":"▥","ask":"記憶體明明不夠大，為什麼程式有時還能繼續執行？","analogy":"你的辦公桌（RAM）很小，但文件很多（虛擬位址空間）。常用文件放桌上，不常用的暫時收起；要用時再拿回來。","why":"Demand Paging 可先不載入全部頁面，真的存取時才讓 OS 決定如何提供頁面。當頁框有限，就需要置換策略。","details":[["Page Fault Flow","處理器偵測無有效對映 → trap → 核心判斷合法性 → 取得頁框與必要內容 → 更新映射 → 重試指令。"],["FIFO","替換最早進入頁框者，簡單但可能出現 Belady’s anomaly。"],["LRU","替換最久未被存取者，利用近期使用局部性；精確實作成本高，真實 OS 多用近似方案。"],["Thrashing","工作集合大於可用記憶體等情況，系統頻繁缺頁，花很多時間搬資料而非做有用工作。"]],"steps":["設定 3 個 Page Frames","逐次存取頁面參考序列","命中不需缺頁；未命中必須載入／置換","比較 FIFO / LRU 故障次數與置換頁"],"caveat":"實驗中的「缺頁」簡化成所需頁不在目前的 3 個 frame；真實 OS 的缺頁和 page cache／交換機制更複雜。","lab":"replacement","code":["Python","refs = [7, 0, 1, 2, 0, 3, 0, 4]\nframes = 3\n# 每一步紀錄頁框與 hit/fault"],"quiz":[["以下哪項是 LRU 的核心判斷？",["最早載入","最久沒被使用","頁面編號最大"],1,"R = Recent","Least Recently Used：最久未使用者被置換。"],["Page Fault 一定表示程式有錯嗎？",["是","否"],1,"合法但尚未載入的頁也會產生缺頁事件","Demand Paging 下的合法頁可能需要缺頁處理才能載入。"]]},{"id":8,"unit":"儲存","title":"File System 是如何存檔的？","short":"inode、fd、buffer、fsync","minutes":20,"icon":"▧","ask":"write() 成功後，拔掉電源，資料一定還在嗎？","analogy":"你請店員「幫我記在帳本」；店員先寫在白板（快取）後說好，並不等於已刻在永久保存的帳本（持久儲存）。","why":"檔案系統同時處理命名、目錄、空間配置、權限與持久性。寫入的回傳時機與真正的耐久化不是一回事。","details":[["File Descriptor","開啟檔案後，Process 使用整數 fd 引用核心管理的開啟檔案狀態。檔名不是 fd。"],["inode／metadata","Unix 類檔案系統通常由 inode 存檔案中繼資料、資料區塊指向等；目錄將名稱映射到檔案身分。"],["Page Cache","write 通常可先更新核心快取，再由系統回寫；持久性語意依檔案系統、掛載模式及硬體而異。"],["fsync","fsync 請求同步檔案資料及所需 metadata；崩潰一致性還需考慮 rename、directory fsync 和硬體保證。"]],"steps":["應用程式發出 write","資料先進入核心緩衝／page cache（一般情況）","背景寫回可能把髒資料提交到儲存裝置","fsync 等同步方法提供更強的持久性請求"],"caveat":"本模擬只展示「快取 ≠ 持久化」；真實儲存層有日誌、控制器快取、排序與斷電保護等差異。","lab":"storage","code":["C","int fd = open(\"data.txt\", O_WRONLY | O_CREAT, 0644);\nwrite(fd, \"OK\", 2);\nfsync(fd);  // 強化資料持久化要求\nclose(fd);"],"quiz":[["write() 成功是否一定等於斷電後資料仍在？",["是","不一定"],1,"系統可能先寫入哪裡？","write 成功通常不能單獨保證資料已在持久媒體安全保存。"],["fd（File Descriptor）比較像？",["作業系統在行程內使用的開啟檔案識別號","全世界唯一的檔名","磁碟扇區的位置"],0,"它是 Process 用來引用核心開啟檔案狀態的整數","fd 不是檔名或實體磁區。"]]},{"id":9,"unit":"儲存","title":"I/O、中斷與驅動程式","short":"為何等待 I/O 不浪費 CPU","minutes":17,"icon":"⇄","ask":"SSD 正在讀資料時，CPU 必須一直空轉嗎？","analogy":"向餐廳點餐後，你不用站在廚房門口反覆問菜好了沒；可以先去辦別件事，餐點完成後再通知你。","why":"OS 可讓等待裝置事件的執行緒阻塞，改去排程其他工作；裝置完成後靠中斷、輪詢或其他機制通知，再使等待者可繼續。","details":[["Device Driver","驅動程式把 OS 的通用 I/O 請求轉為特定裝置能理解的操作。"],["Interrupt","裝置可藉由中斷通知 CPU；實際 I/O 可能結合 DMA、提交佇列、輪詢及完成佇列。"],["Blocking／Non-blocking","阻塞描述呼叫是否等待；同步／非同步描述完成通知與控制流程，兩組概念不能完全畫等號。"],["Throughput／Latency","吞吐量是單位時間工作量，延遲是一筆請求耗時；批次化和佇列可能提高吞吐但增加尾端延遲。"]],"steps":["程式執行 read()","若需要等待，執行緒轉為 Waiting","裝置執行 I/O；CPU 可跑其他 Ready 工作","完成後 OS 喚醒執行緒，再排程"],"caveat":"對 page cache 命中的 read()，可能無需真的等待磁碟；教科書會先從需要 I/O 的典型路徑講起。","lab":"syscall","code":["Python","with open(\"sample.txt\", \"rb\") as f:\n    data = f.read()   # 上層 API 不等於 1 次硬體讀取"],"quiz":[["阻塞等待磁碟 I/O 的 Thread，通常？",["一直占用 CPU 直到 I/O 完成","釋出 CPU，等待完成通知","自動變成新的 Process"],1,"前面 Process state 的 Waiting 想想看","Blocked thread 通常不持續占 CPU 執行。"],["read() 呼叫一定讓 SSD 運轉嗎？",["一定","不一定，可能命中 page cache"],1,"若資料之前讀過且在記憶體呢？","快取命中可能省下裝置 I/O。"]]},{"id":10,"unit":"系統","title":"Protection 與 Security","short":"權限、隔離、最小特權","minutes":18,"icon":"⬡","ask":"為什麼一般應用程式不能修改 Kernel？","analogy":"每間教室有門禁；你能走自己的教室，但不能因為拿著自己的鑰匙就開別人的門。門禁系統還會記錄誰可以去哪裡。","why":"OS 必須維持程序、使用者與核心之間的保護邊界，否則單一程式就可能破壞整個系統或取得機密。","details":[["Authentication／Authorization","身份驗證辨識你是誰；授權確認你能做什麼。"],["Access Control","Unix 權限位、ACL、能力模型與 sandbox 等機制控制資源存取。"],["Memory Protection","頁表與 CPU 特權模式協助阻止程式直接存取未授權位址。"],["Least Privilege","僅給執行工作所需權限，將弱點影響範圍縮小。"]],"steps":["識別提出請求的主體","根據憑證與權限規則進行檢查","授權後執行操作，否則拒絕","必要時記錄安全事件"],"caveat":"擁有 root 或管理員權限也不代表能繞過所有隔離與硬體保護，例如某些安全啟動與虛擬化隔離。","lab":"classify","code":["Bash","ls -l secret.txt\nchmod 600 secret.txt   # 擁有者可讀寫；他人不可"],"quiz":[["「我知道你是誰」比較接近哪個？",["Authentication","Authorization"],0,"確認身份與檢查權限不是同一回事","Authentication 是身分驗證；Authorization 是授權。"],["最小特權原則強調？",["給所有程式最高權限","只給完成工作必須的權限"],1,"若應用程式遭攻擊，希望它拿到多少能力？","最小特權能降低可能受害範圍。"]]},{"id":11,"unit":"系統","title":"Virtual Machine vs Container","short":"兩種隔離方式","minutes":17,"icon":"◫","ask":"Docker Container 裡面到底有沒有自己的 Kernel？","analogy":"VM 像不同棟的大樓，各自有完整的水電管理系統；Container 像同一棟大樓內隔出的不同套房，共用底層管理與設施，但生活空間互相隔離。","why":"Virtual Machine 透過 hypervisor 虛擬化硬體，可運行自己的 guest kernel；一般 OS 容器共用 host kernel，以 namespaces、cgroups 等實現隔離與資源控制。","details":[["Hypervisor","提供虛擬 CPU、記憶體與裝置環境，讓 guest OS 執行。"],["Container","封裝程序、依賴與隔離的檔案／網路視角，但其程序仍受 host kernel 管理。"],["namespace / cgroups","Linux namespaces 分隔可見資源，cgroups 管控及統計 CPU、記憶體等資源。"],["安全邊界","容器隔離不是 VM 完全相同的邊界；風險模型與宿主環境關係密切。"]],"steps":["Docker 啟動一組隔離的程序","程序仍透過 host kernel syscall","cgroup 約束或統計資源","VM 的 guest 會有自己核心並經虛擬硬體執行"],"caveat":"「Docker 就是輕量 VM」只可當初步類比，若拿來推導 Kernel 邊界會出錯。","lab":"classify","code":["Bash","docker run --rm ubuntu:24.04 uname -a\n# 一般 Linux container 的 uname 可見 host kernel 特性"],"quiz":[["一般 Linux Container 的 Process 使用哪個 Kernel？",["容器自行開機的一顆完整 Kernel","Host Kernel"],1,"從 syscall 進入的是誰？","容器程序通常共用宿主核心。"],["一般 VM 相較容器，較明顯的特徵？",["可執行自己的 guest kernel","一定比容器更快"],0,"VM 的「客體作業系統」想想看","VM 可執行獨立的 guest OS 與 Kernel。"]]},{"id":12,"unit":"系統","title":"效能與觀測","short":"瓶頸、負載、Latency、Throughput","minutes":18,"icon":"▦","ask":"CPU 使用率 100%，系統一定表現最好嗎？","analogy":"餐廳廚師全程忙碌，不代表客人很快拿到餐；如果訂單塞車或配料跟不上，客人反而等很久。","why":"OS 效能分析需要先看時間花在哪裡，然後有證據地辨別 CPU、記憶體、I/O、鎖、網路或應用程式瓶頸。","details":[["CPU Utilization","忙碌程度 ≠ 每筆請求體驗；也要檢查排隊時間與 CPU throttling。"],["Latency vs Throughput","優化批次可能改善 throughput，同時讓單筆延遲惡化。"],["Memory pressure","關注 RSS、page faults、swap、OOM 等訊號，別只看剩餘 RAM 數字。"],["性能分析流程","提出假設 → 收集指標 → 重現負載 → 改一個因素 → 對照測試，避免憑感覺優化。"]],"steps":["先找使用者感受到的延遲／錯誤","辨認是 CPU、I/O、鎖或排隊","蒐集數據並確認假設","一次變更一個因素，再觀察結果"],"caveat":"單看 top／工作管理員中的 CPU% 或 RAM% 無法直接判定瓶頸；需要情境與時序資料。","lab":"classify","code":["Bash","top           # CPU / process\nvmstat 1      # memory/swap/scheduler\niostat -x 1   # storage（若已安裝）"],"quiz":[["服務端 p95 latency 飆高，但平均 CPU 不高，最好的第一步？",["立即換更快 CPU","蒐集等待、I/O、鎖與佇列等指標","直接加倍 Thread"],1,"先定位瓶頸，才有可解釋的改善","低 CPU 使用率也可能嚴重被 I/O、鎖或外部服務阻塞。"],["Throughput 與 Latency？",["永遠同方向改善","不同指標，有時互相取捨"],1,"批次提升每秒處理量時，個別請求會不會等更久？","吞吐與延遲在佇列和批次策略下可能形成取捨。"]]},{"id":13,"unit":"整合","title":"案例：一個 API 請求的旅程","short":"串起 Process、Scheduling、I/O","minutes":21,"icon":"➝","ask":"瀏覽器向 API 發出請求，背後哪些 OS 機制被用到？","analogy":"外送訂單跨越接單、備餐、物流，單看任何一個環節都無法說明整張訂單的延遲；API 也跨越網路、排程、記憶體、檔案與資料庫。","why":"真正的系統不分章節：一個請求可能從網路中斷、socket 佇列、worker thread、資料庫 I/O，到回傳 response。","details":[["Network path","網卡接收到資料，核心網路堆疊處理 socket，應用程式被喚醒或取得通知。"],["Execution path","事件迴圈或工作執行緒處理請求，OS / Runtime 決定執行時機。"],["Memory path","請求、buffer、物件佔用虛擬記憶體；可能碰上快取與 page faults。"],["Storage path","資料庫可能讀 page cache 或存取磁碟，也可能等待遠端服務。"]],"steps":["NIC 收到封包；核心將資料導向 socket","Worker 從等待變為可執行、得到 CPU","應用程式查資料、可能因 I/O 等待","完成後經 socket 回覆用戶端"],"caveat":"實際路徑因同步／非同步設計、網路堆疊、TLS 終止位置和資料庫架構不同。","lab":"syscall","code":["Python","def request_flow():\n    # socket -> schedule -> handler -> I/O -> response\n    pass"],"quiz":[["API 處理中等待外部資料庫回覆時，正在處理該請求的 OS Thread 可能？",["進入等待，CPU 執行其他工作","必然永久占用 CPU"],0,"等待外部事件對照 Process State","阻塞式 I/O 可以讓執行緒等待，CPU 執行別的工作；事件迴圈則可轉去服務其他 task。"],["API p99 延遲高，應先假定 CPU 不夠嗎？",["應該","不應該，需要量測路徑"],1,"單筆請求橫跨哪些環節？","應量測網路、應用、儲存、佇列和鎖等因素。"]]},{"id":14,"unit":"實驗","title":"系統工具與 C 實驗","short":"用實驗觀察真實系統","minutes":20,"icon":"⌘","ask":"如果只是背概念，怎麼知道真實 Linux 跟你想的一樣？","analogy":"學游泳不能只看示意圖；OS 也是，要讓程式真的執行並觀察 PID、記憶體、檔案與排程。","why":"理論模型用來理解原理；實驗讓你辨別哪些是真實現象、哪些是為教學簡化的假設。","details":[["Lab A：Process","用 fork / wait 比較父子程序 PID，觀察輸出順序與 OS 排程。"],["Lab B：Thread","用 pthread 建立 Thread，加入 mutex 前後比較共享計數是否正確。"],["Lab C：Memory","用 malloc、/proc/<pid>/maps、top 等工具觀察位址、RSS 與記憶體。"],["Lab D：I/O","對照 write、fsync 與 file descriptor，測試不同批次策略的差異。"]],"steps":["先對現象寫出預測","執行程式與紀錄輸出","比對預測，確認簡化模型限制","寫下修正後的解釋"],"caveat":"真實進程行為會受作業系統版本、編譯器、工作負載和環境影響。Windows 可用 WSL2 進行 Linux POSIX 練習。","lab":"process","code":["Bash","gcc -Wall -Wextra -O0 fork_demo.c -o fork_demo\n./fork_demo\nps -ef | head"],"quiz":[["觀察 OS 行為最好的學習方式是？",["先預測、實驗、比對觀察與模型","只背一個固定輸出順序"],0,"同一段程式可能因排程而有不同觀察","先建立可反駁的預測再測試，可將觀察化為理解。"],["在 Windows 11 上練習 POSIX fork()，推薦環境？",["一般 cmd 原生執行 fork","Linux／WSL2","只能購買另一台機器"],1,"POSIX 函式在什麼系統較直接可用？","WSL2 提供 Linux 使用者環境，非常適合這些實驗。"]]},{"id":15,"unit":"複習","title":"最終整合與自我檢核","short":"用一個模型串起 OS","minutes":25,"icon":"★","ask":"你能不看講義，從啟動程式一直說到讀檔回傳嗎？","analogy":"當你能從「餐廳」一路講到廚師、排隊、倉庫、門禁、送餐，而不會把不同角色混淆，就代表這個模型逐漸完整。","why":"真正理解是能跨章節解釋現象、畫流程圖、手算模型，還能指出簡化模型與真實 Linux 的差距。","details":[["執行鏈","Program → Process → Thread → Scheduler → CPU → System Call → Device / I/O。"],["資料鏈","VA → VPN + Offset → TLB / Page Table → PFN → Physical Memory；缺頁時有 OS 協助。"],["正確性鏈","Concurrent Threads → Shared Data → Race → Synchronization → Deadlock 風險與設計。"],["可靠性鏈","File Write → Page Cache → Writeback → fsync／持久性；容器 vs VM 是另外一種隔離設計。"]],"steps":["先從第 0 章口述完整執行路徑","能手算排程和分頁轉譯","能解釋競爭條件並提出同步策略","能用 Linux 工具對照預測和現實"],"caveat":"完成網頁測驗表示基本觀念過關，不代表已具備 Kernel 開發技能；下一步是 xv6、C 與 Linux 原始碼。","lab":"schedule","code":["Text","Program ≠ Process ≠ Thread\nMode switch ≠ Context switch\nConcurrency ≠ Parallelism\nwrite() success ≠ guaranteed persistence"],"quiz":[["要安全修改共享變數，第一個該檢查的核心問題？",["有沒有正確同步所有讀改寫操作","Thread 名稱夠不夠長"],0,"看操作是否能以原子性方式完成","共享資料正確性需要同步，不能依賴固定的執行順序。"],["下列哪個描述最精確？",["Virtual Memory 是把 SSD 改名叫 RAM","Virtual Memory 是位址抽象與保護機制，必要時可搭配次級儲存","Virtual Memory 等於 CPU Cache"],1,"區分「位址」與「資料暫存」","虛擬記憶體是位址空間抽象／保護，並非僅僅 swap。"]]}];
'use strict';
const $=id=>document.getElementById(id);
const h=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const units=['基礎','執行','排程','並行','記憶體','儲存','系統','整合','實驗','複習'];
const KEY='os_lab_2026_v1';
function load(){try{return JSON.parse(localStorage.getItem(KEY))||{done:{},notes:{},last:0}}catch(_){return {done:{},notes:{},last:0}}}
let store=load();
if(!store.done)store.done={}; if(!store.notes)store.notes={};
const state={page:'home',lesson:0,tab:'learn',lab:{},quiz:{i:0,tries:0,wrong:[],revealed:false,correct:false},search:''};
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(_){}}
function countDone(){return Object.keys(store.done).length}
function renderSidebar(){
 $('progressNum').textContent=countDone()+' / '+lessons.length;
 $('progressPct').textContent=Math.round(100*countDone()/lessons.length)+'%';
 $('progressBar').style.width=(100*countDone()/lessons.length)+'%';
 const word=state.search.toLowerCase();
 $('sidebarNav').innerHTML=units.map(unit=>{
  const group=lessons.filter(l=>l.unit===unit && (`${l.id} ${l.title} ${l.short} ${l.ask}`.toLowerCase().includes(word)));
  if(!group.length)return '';
  return `<div class="navGroup"><div class="navGroupTitle">${h(unit)}</div>`+group.map(l=>`<button class="nav-item ${state.page==='lesson'&&state.lesson===l.id?'active':''}" data-go="${l.id}"><span class="nav-num">${String(l.id).padStart(2,'0')}</span><span style="min-width:0;flex:1"><div class="nmain">${h(l.title)}</div><div class="nsub">${h(l.short)}</div></span>${store.done[l.id]?'<span class="nav-check">✓</span>':''}</button>`).join('')+`</div>`;
 }).join('') || '<p class="tiny" style="padding:12px">找不到相符章節</p>';
}
function scrollMain(){window.scrollTo({top:0,behavior:'smooth'});$('side').classList.remove('open');$('backdrop').classList.remove('show')}
function navigate(id,tab='learn'){
 state.page='lesson';state.lesson=id;state.tab=tab;state.lab={};state.quiz={i:0,tries:0,wrong:[],revealed:false,correct:false};store.last=id;save();render();scrollMain();

function goHome(){state.page='home';render();scrollMain()}
function render(){renderSidebar();if(state.page==='home'){renderHome();return} renderLesson()}

 $('crumb').innerHTML='作業系統 / <b>課程地圖</b>';
 const done=countDone();
 $('content').innerHTML=`<section class="hero"><div class="eyebrow">THE OPERATING SYSTEMS FIELD GUIDE</div><h1>從 CPU 的第一條指令，<br>理解整套作業系統。</h1><p>不要死記名詞。先用生活類比理解問題，再走進 Kernel、排程、同步與記憶體；親手操作實驗，再用問題驗證自己是否真的懂。</p><div class="heroStats"><span class="statPill">16 章系統化課程</span><span class="statPill">9 類可操作模擬器</span><span class="statPill">32 題互動挑戰</span><span class="statPill">離線可用</span></div><div class="btnrow" style="margin-top:24px"><button class="btn primary" data-go="${done ? store.last : 0}">${done?'繼續學習':'從第 0 章開始'} →</button><button class="btn secondary" data-go="4" data-tab="lab">直接體驗 CPU 排程</button></div></section>
 <div class="paper" style="margin:20px 0"><div class="labelWithIcon">◎ 如何使用這套教材</div><div class="grid2" style="margin-top:13px"><div class="micro"><h4>01 — 先白話，再深入</h4><p>每章先回答一個直覺問題，再學對應的硬體與 OS 原理。</p></div><div class="micro"><h4>02 — 先預測，再操作</h4><p>在模擬器中改變條件，看看自己的預測是否正確。</p></div><div class="micro"><h4>03 — 測驗只出一題</h4><p>每題有兩次作答機會；答錯會給提示，最後講明原因。</p></div><div class="micro"><h4>04 — 自動保留進度</h4><p>章末完成紀錄與個人筆記保存在目前瀏覽器，不上傳伺服器。</p></div></div></div>

 <div class="courseGrid">${lessons.map(l=>`<button class="courseCard" data-go="${l.id}"><div class="metric-line"><span class="num">CH ${String(l.id).padStart(2,'0')} · ${h(l.unit)}</span>${store.done[l.id]?'<span class="pillDone">已完成</span>':`<span class="tiny">約 ${l.minutes} 分鐘</span>`}</div><h3>${h(l.title)}</h3><p>${h(l.short)}</p></button>`).join('')}</div>
 <p class="tiny" style="margin-top:30px">教學定位：原創互動教材；以《Operating System Concepts》常見的學科主線為參考，不是該書的翻譯或線上副本。模擬器都有教學假設，請與真實作業系統行為區分。</p>`;
}

 <div class="tabbar" role="tablist" aria-label="本章學習階段"><button class="tab ${state.tab==='learn'?'active':''}" data-tab="learn" role="tab" aria-selected="${state.tab==='learn'}">① 從觀念出發</button><button class="tab ${state.tab==='lab'?'active':''}" data-tab="lab" role="tab" aria-selected="${state.tab==='lab'}">② 動手模擬</button><button class="tab ${state.tab==='quiz'?'active':''}" data-tab="quiz" role="tab" aria-selected="${state.tab==='quiz'}">③ 章末挑戰 ${store.done[l.id]?'✓':''}</button></div>
 <div id="lessonStage"></div><div class="footerNav"><button class="btn secondary" id="prevLesson" ${l.id===0?'disabled':''} data-go="${Math.max(0,l.id-1)}">← 上一章</button><button class="btn secondary" id="nextLesson" ${l.id===15?'disabled':''} data-go="${Math.min(15,l.id+1)}">下一章 →</button></div>`;
 renderStage();
}

function scheduleSim(jobs,algo,q){const rows=jobs.map((p,i)=>({...p,index:i,remaining:p.burst,first:null,done:null}));let t=0,trace=[],running=null,quantumLeft=0,ready=[],arrived=new Set();const max=120,total=rows.reduce((a,p)=>a+p.burst,0);while(rows.some(p=>p.remaining>0)&&t<max){
  if(algo==='RR'){
   rows.filter(p=>p.arr===t && !arrived.has(p.id)).forEach(p=>{ready.push(p);arrived.add(p.id)});
   if(running && quantumLeft===0 && running.remaining>0){ready.push(running);running=null}
   if(!running){running=ready.shift()||null;quantumLeft=q}
  }else if(algo==='FCFS'||algo==='SJF'){
   if(!running){const pool=rows.filter(p=>p.remaining>0&&p.arr<=t);pool.sort((a,b)=>algo==='FCFS'?(a.arr-b.arr || a.index-b.index):(a.burst-b.burst||a.arr-b.arr||a.index-b.index));running=pool[0]||null}
  }else if(algo==='SRTF'){
   const pool=rows.filter(p=>p.remaining>0&&p.arr<=t).sort((a,b)=>a.remaining-b.remaining||a.arr-b.arr||a.index-b.index);running=pool[0]||null;
  }
  if(!running){trace.push('idle');t++;continue}
  if(running.first===null)running.first=t;trace.push(running.id);running.remaining--;if(algo==='RR')quantumLeft--;t++;
  if(running.remaining===0){running.done=t;running=null}
 }
 return {trace,rows:rows.map(p=>({...p,tat:p.done-p.arr,wt:p.done-p.arr-p.burst,rt:p.first-p.arr})),total};}
function drawSchedule(){const s=state.lab;const sol=scheduleSim(s.jobs,s.algo,s.quantum);const reached=Math.min(s.t,sol.trace.length);return `<div class="control-row"><label>排程政策 <select class="select" data-setting="algo">${['FCFS','SJF','SRTF','RR'].map(x=>`<option ${s.algo===x?'selected':''}>${x}</option>`).join('')}</select></label>${s.algo==='RR'?`<label>Time quantum <input class="number" type="number" min="1" max="12" data-setting="quantum" value="${s.quantum}"></label>`:''}</div><div class="table-wrap"><table class="dataTable"><thead><tr><th>工作</th><th>到達時間 (AT)</th><th>CPU 執行時間 (BT)</th></tr></thead><tbody>${s.jobs.map((p,i)=>`<tr><td><strong>${p.id}</strong></td><td><input class="number" type="number" min="0" max="15" value="${p.arr}" data-job="${i}" data-field="arr"></td><td><input class="number" type="number" min="1" max="16" value="${p.burst}" data-job="${i}" data-field="burst"></td></tr>`).join('')}</tbody></table></div><div class="labNote">先猜：RR 的 quantum 從 2 改成 10，Gantt 圖會有什麼不同？本實驗假設單 CPU、無 I/O、無 context switch 成本，時刻 t 新到的工作先排入佇列，再把用完時間片但未完成的工作重新排隊。</div><div class="labBoard"><div class="metric-line"><strong>Gantt Chart</strong><span class="tiny">已走 ${reached} / ${sol.trace.length} ticks</span></div><div class="gantts">${sol.trace.map((id,i)=>`<div class="slice ${id.toLowerCase()} ${i>=reached?'unseen':''}"><strong>${id==='idle'?'·':id}</strong><small>${i}</small></div>`).join('')}<div class="slice idle" style="flex:0 0 24px;border-color:transparent;background:transparent"><small>${sol.trace.length}</small></div></div></div><div class="btnrow">${labBtn('step','+1 tick →',reached>=sol.trace.length,'primary')}${labBtn('all','執行全部',reached>=sol.trace.length)}${labBtn('restart','回到時間 0',reached===0)}</div>${reached===sol.trace.length?`<div class="labBoard"><div class="metric-line"><strong>完整結果</strong><span class="tiny">CT: Completion / WT: Waiting / RT: Response</span></div><div class="table-wrap"><table class="dataTable"><thead><tr><th>工作</th><th>CT</th> function calcRace(lock,t){const actions=lock?[['A','read'],['A','inc'],['A','write'],['B','read'],['B','inc'],['B','write']]:[['A','read'],['B','read'],['A','inc'],['B','inc'],['A','write'],['B','write']];let x=0;const local={A:null,B:null};let desc='尚未開始。共享變數 x = 0。';for(let i=0;i<t;i++){let [who,what]=actions[i];if(what==='read'){local[who]=x;desc=`Thread ${who} 讀取共享 x=${x} 到自己的暫存。`}if(what==='inc'){local[who]++;desc=`Thread ${who} 本地 +1，暫存值=${local[who]}。`}if(what==='write'){x=local[who];desc=`Thread ${who} 寫回共享 x=${x}。`}}return {actions,x,local,desc}}
function drawRace(){const s=state.lab,r=calcRace(s.lock,s.t);return `<div class="control-row"><label><input type="checkbox" id="lockMode" ${s.lock?'checked':''}> 啟用 Mutex：先讓 A 完成臨界區，B 才進入</label></div><div class="labNote">先預測：同樣讓 A、B 各執行一次 +1，沒有鎖且都先讀取的情況下，最後是 1 還是 2？</div><div class="labBar" style="margin:13px 0"><div class="miniStat"><span>共享變數 x</span><strong class="labValue">${r.x}</strong></div><div class="miniStat"><span>Thread A 暫存</span><strong class="labValue">${r.local.A??'—'}</strong></div><div class="miniStat"><span>Thread B 暫存</span><strong class="labValue">${r.local.B??'—'}</strong></div></div><div class="labBoard"><div class="topic-label">指令交錯（目前 ${s.t} / 6）</div><div class="steps">${r.actions.map(([who,op],i)=>`<div class="step" style="padding:8px 0;opacity:${i<s.t?1:.35}"><span class="step-num" style="background:${who==='A'?'#285a48':'#2d5071'}">${who}</span><p style="font-family:ui-monospace,monospace">${op==='read'?'local = x':op==='inc'?'local = local + 1':'x = local'}</p>${i===s.t-1?'<span class="pillDone">最新一步</span>':''}</div>`).join('')}</div></div><div class="labNote">${h(r.desc)} ${s.t===6?'執行結束：現在請比較開啟／關閉鎖後的最終 x。':''}</div><div class="btnrow">${labBtn('step','下一個操作 →',s.t===6,'primary')}${labBtn('all','直接執行完畢',s.t===6)}</div>`}
function drawPaging(){const s=state.lab;let raw=(s.addr||'').trim();let va=/^0x[\da-f]+$/i.test(raw)?parseInt(raw,16):/^\d+$/.test(raw)?Number(raw):NaN;let good=Number.isSafeInteger(va)&&va>=0&&va<=65535;let vpn=good?Math.floor(va/4096):0,offset=good?va%4096:0;let table={0:3,1:7,2:1,3:4};let mapped=good&&Object.hasOwn(table,vpn);let pa=mapped?table[vpn]*4096+offset:0;return `<div class="labNote" style="margin:0 0 15px">先預測：頁面大小是 4 KiB，虛擬位址 0x1234 的 offset 是多少？試著手算後再看分解。</div><div class="control-row"><label>16-bit 虛擬位址 <input id="vaInput" class="textInput" value="${h(s.addr)}" placeholder="0x1234 或 4660" spellcheck="false"></label>${labBtn('calc','轉譯地址 →',false,'primary')}</div>${good?`<div class="labBar" style="margin:17px 0"><div class="miniStat"><span>VA</span><strong class="labValue">0x${va.toString(16).padStart(4,'0')}</strong></div><div class="miniStat"><span>VPN（高 4 bits）</span><strong class="labValue">${vpn}</strong></div><div class="miniStat"><span>Offset（低 12 bits）</span><strong class="labValue">0x${offset.toString(16).padStart(3,'0')}</strong></div></div><div class="labBoard"><div class="topic-label">教學頁表：VPN → PFN</div><div class="refcells">${Object.entries(table).map(([v,p])=>`<div class="refcell ${Number(v)===vpn?'active':''}" style="width:100px">${v} → ${p}</div>`).join('')}</div></div>${mapped?`<div class="labNote">命中映射：PA = PFN ${table[vpn]} × 4096 + offset ${offset} = <strong>0x${pa.toString(16)}（${pa}）</strong>。PFN 是 Physical Frame Number；相同 offset 原封不動保留。</div>`:`<div class="labNote">這個簡化頁表沒有 VPN ${vpn} 的有效映射。存取時會觸發分頁例外，OS 再判定是否合法，或是否需要配置／載入頁面。</div>`}`:`<div class="quizFeedback miss">請輸入 0x0000～0xffff 或 0～65535 範圍的位址。</div>`}<p class="tiny">4 KiB = 4096 = 2¹²，所以 16-bit VA = 4-bit VPN + 12-bit offset；此處的頁表僅示範 0–3。</p>`}
function simulateReplacement(l){let frames=[],queue=[],last={},history=[];for(let i=0;i<l.t;i++){const page=l.refs[i];let hit=frames.includes(page),victim=null;if(hit){last[page]=i}else{if(frames.length<l.capacity){frames.push(page);queue.push(page)}else if(l.algo==='FIFO'){victim=queue.shift();frames[frames.indexOf(victim)]=page;queue.push(page)}else{victim=frames.slice().sort((a,b)=>last[a]-last[b])[0];frames[frames.indexOf(victim)]=page}last[page]=i}history.push({page,hit,victim,frames:frames.slice()})}return {frames,history,hit:history.filter(x=>x.hit).length,fault:history.filter(x=>!x.hit).length};}
function drawReplacement(){const s=state.lab,r=simulateReplacement(s);return `<div class="control-row"><label>策略 <select class="select" data-setting="algo"><option ${s.algo==='FIFO'?'selected':''}>FIFO</option><option ${s.algo==='LRU'?'selected':''}>LRU</option></select></label><span class="tiny">3 Frames · 序列固定，用來比較兩種策略</span></div><div class="labNote">先預測：如果參考序列重複讀到 0，FIFO 和 LRU 會如何判定要換掉哪一頁？</div><div class="topic-label" style="margin:13px 0 5px">頁面參考序列</div><div class="refcells">${s.refs.map((p,i)=>`<div class="refcell ${i===s.t-1?'active':''}" style="opacity:${i<s.t?1:.4}">${p}</div>`).join('')}</div><div class="labBoard"><div class="topic-label">目前頁框（步驟 ${s.t} / ${s.refs.length}）</div><div class="frameRow">${Array.from({length:s.capacity},(_,i)=>`<div class="frame ${r.frames[i]===undefined?'empty':''}">${r.frames[i]??'—'}</div>`).join('')}</div><div class="labBar" style="margin-top:14px"><div class="miniStat"><span>Hit</span><strong class="labValue">${r.hit}</strong></div><div class="miniStat"><span>Fault</span><strong class="labValue">${r.fault}</strong></div></div></div>${s.t>0?`<div class="labNote">頁面 ${r.history.at(-1).page}：${r.history.at(-1).hit?'Hit，頁已在 Frame 中':`Page Fault${r.history.at(-1).victim===null?'，使用空頁框':`，置換頁 ${r.history.at(-1).victim}`}`}。</div>`:''}<div class="btnrow">${labBtn('step','讀取下一頁 →',s.t>=s.refs.length,'primary')}${labBtn('all','跑完整個序列',s.t>=s.refs.length)}</div>`}
function drawStorage(){const s=state.lab;return `<div class="labNote" style="margin:0 0 13px">先預測：資料 v2 只寫進快取後立刻斷電，重新開機讀到的是 v1 還是 v2？</div><div class="twoBoxes"><div class="store"><strong>RAM / Page Cache</strong><div class="value">${h(s.cache)}</div><span class="explainTag">${s.dirty?'● Dirty（尚未同步）':'○ 與持久層一致'}</span></div><div class="store"><strong>持久儲存（簡化）</strong><div class="value">${h(s.disk)}</div><span class="explainTag">重新開機能留下的資料</span></div></div><div class="btnrow">${labBtn('write','write("v2")',false,'primary')}${labBtn('flush','fsync() / 同步快取')}${labBtn('crash','⚡ 模擬斷電',false,'warn')}</div><div class="labNote">${h(s.msg)}<br><span class="tiny">教學模型：未同步的 dirty cache 在斷電時完全消失；真實 writeback 時間與耐久保證依 OS、檔案系統與裝置而異。</span></div>`}
const classifyQuestions=[{q:'一般使用者程式呼叫一個普通 C 函式，必然會進 Kernel Mode 嗎？',choices:['必然','不一定'],answer:1,why:'函式呼叫和 System Call 不相同。'},{q:'某個 Linux Container 內的程序呼叫 open()，使用哪個 Kernel 處理？',choices:['Container 自己的 guest Kernel','Host Kernel'],answer:1,why:'一般容器程序共用 Host Kernel。'},{q:'一個 Thread 正在等待 I/O，它最適合放在哪個狀態？',choices:['Ready','Waiting / Blocked'],answer:1,why:'完成事件通知後才會回 Ready。'}];
function drawClassify(){const s=state.lab,q=classifyQuestions[s.i];return `<div class="quizMeta">情境快問快答 · ${s.i+1} / ${classifyQuestions.length}</div><h3 style="font-size:19px;line-height:1.5">${h(q.q)}</h3><div class="classifyChoices">${q.choices.map((c,i)=>`<button class="choice" style="width:auto;flex:1" data-classify="${i}" ${s.answered?'disabled':''}>${h(c)}</button>`).join('')}</div>${s.answered?`<div class="quizFeedback ${s.correct?'':'miss'}">${s.correct?'答對！':'想想為什麼這樣。'} ${h(q.why)}</div><div class="btnrow">${labBtn('nextClass','下一個情境 →',s.i===classifyQuestions.length-1,'primary')}</div>`:''}`}
function labAction(a){const s=state.lab;switch(s.type){case 'cpu':if(a==='next')s.t=Math.min(12,s.t+1);if(a==='interrupt')s.interrupt=!s.interrupt;break;case 'process':{const map={dispatch:['Ready','Running','Scheduler 選中行程，Ready → Running。'],block:['Running','Waiting','等待 I/O，Running → Waiting。'],timeout:['Running','Ready','時間片用完，Running → Ready。'],wake:['Waiting','Ready','I/O 完成，Waiting → Ready（尚未直接跑在 CPU 上）。'],exit:['Running','Terminated','程式結束，Running → Terminated。']};const e=map[a];if(e&&s.status===e[0]){s.status=e[1];s.history.push(e[2])}}break;case 'syscall':if(a==='next')s.t=Math.min(6,s.t+1);if(a==='prev')s.t=Math.max(0,s.t-1);break;case 'schedule':{const len=scheduleSim(s.jobs,s.algo,s.quantum).trace.length;if(a==='step')s.t=Math.min(len,s.t+1);if(a==='all')s.t=len;if(a==='restart')s.t=0;break}case 'race':if(a==='step')s.t=Math.min(6,s.t+1);if(a==='all')s.t=6;break;case 'paging':if(a==='calc')s.addr=$('vaInput').value;break;case 'replacement':if(a==='step')s.t=Math.min(s.refs.length,s.t+1);if(a==='all')s.t=s.refs.length;break;case 'storage':if(a==='write'){s.cache='v2';s.dirty=true;s.msg='write 成功：資料在 RAM 快取中變成 v2，但持久層仍是 '+s.disk+'。'}if(a==='flush'){s.disk=s.cache;s.dirty=false;s.msg='模擬 fsync：將快取內容同步到持久層。'}if(a==='crash'){s.cache=s.disk;s.dirty=false;s.msg='模擬斷電再重啟：RAM 內容清空，從持久層重新取得 '+s.disk+'。'}break;case 'classify':if(a==='nextClass'){s.i=Math.min(classifyQuestions.length-1,s.i+1);s.answered=false;s.correct=false}break;}drawLab()}
// 單一事件委派，避免重畫 DOM 後遺失事件處理。
document.addEventListener('click',e=>{
 const btn=e.target.closest('button');if(!btn)return;
 if(btn.hasAttribute('data-go')){navigate(Number(btn.dataset.go),btn.dataset.tab||'learn');return}
 if(btn.hasAttribute('data-tab')){setTab(btn.dataset.tab);return}
 if(btn.hasAttribute('data-answer')){submitAnswer(Number(btn.dataset.answer));return}
 if(btn.hasAttribute('data-lab')){labAction(btn.dataset.lab);return}
 if(btn.hasAttribute('data-classify')){const s=state.lab;s.answered=true;s.correct=Number(btn.dataset.classify)===classifyQuestions[s.i].answer;drawLab();return}
 if(btn.id==='resetLab'){state.lab=createLabState(lessons[state.lesson].lab);drawLab();return}
 if(btn.id==='nextQuiz'){nextQuiz();return}
 if(btn.id==='retryQuiz'){state.quiz={i:0,tries:0,wrong:[],revealed:false,correct:false};renderQuiz(lessons[state.lesson]);return}
 if(btn.id==='homeBtn'||btn.id==='homeFinish'){goHome();return}
 if(btn.id==='copyCode'){navigator.clipboard?.writeText(lessons[state.lesson].code[1]).then(()=>{btn.textContent='已複製 ✓';setTimeout(()=>btn.textContent='複製',1400)}).catch(()=>{btn.textContent='可手動選取複製'});return}
 if(btn.id==='menu'){$('side').classList.toggle('open');$('backdrop').classList.toggle('show');return}
 if(btn.id==='notesTop'){if(state.page==='home')navigate(store.last||0);setTab('learn');setTimeout(()=>$('noteArea')?.scrollIntoView({behavior:'smooth',block:'center'}),10);return}
 if(btn.id==='scrollTop'){window.scrollTo({top:0,behavior:'smooth'});return}
});
document.addEventListener('input',e=>{if(e.target.id==='noteArea'){store.notes[state.lesson]=e.target.value;save()}if(e.target.id==='search'){state.search=e.target.value;renderSidebar()}});
document.addEventListener('change',e=>{
 const el=e.target,s=state.lab;if(el.id==='lockMode'){s.lock=el.checked;s.t=0;drawLab();return}
 if(el.hasAttribute('data-setting')){const field=el.dataset.setting;if(s.type==='schedule'||s.type==='replacement'){if(field==='algo')s.algo=el.value;if(field==='quantum')s.quantum=Math.max(1,Math.min(12,Number(el.value)||2));s.t=0;drawLab()}return}
 if(el.hasAttribute('data-job')&&s.type==='schedule'){const idx=Number(el.dataset.job),field=el.dataset.field,val=Number(el.value);s.jobs[idx][field]=Math.max(field==='arr'?0:1,Math.min(field==='arr'?15:16,Number.isFinite(val)?Math.floor(val):1));s.t=0;drawLab();return}
});
$('backdrop').addEventListener('click',()=>{$('side').classList.remove('open');$('backdrop').classList.remove('show')});
render();

</script>
</body></html>
