name: OS LAB Textbook Validation

on:
  pull_request:
    paths:
      - 'os/**'
      - 'tests/os-review.cjs'
      - 'tests/os-maple-review.cjs'
      - 'tests/os-textbook-review.cjs'
      - 'tests/os-judge-native.cjs'
      - 'tests/os-student-verify.cjs'
      - '.github/workflows/pages.yml'
      - 'tests/os-examples-compile.cjs'
      - 'tests/os-crossbrowser-semantic.cjs'
      - 'tests/os-browser-wasm.cjs'
      - 'tests/os-browser-judge.cjs'
      - 'tests/os-browser-multilang.cjs'
      - 'tests/os-crossbrowser.cjs'
      - '.github/workflows/os-textbook-check.yml'

concurrency:
  group: os-textbook-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  textbook-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate 29 chapters, labs, questions and Judge data
        run: |
          node tests/os-textbook-review.cjs
          node os/linux-labs/l3-verify.cjs --all
          node tests/os-scheduling-model.cjs
          node tests/os-banker-model.cjs

  judge-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile C/C++ and execute Python/JavaScript starters; validate all expected outputs
        run: node tests/os-judge-native.cjs
      - name: Compile and grade four real student-language FIFO implementations (reject mutants)
        run: node tests/os-student-verify.cjs
      - name: Compile and run all repaired textbook code snippets
        run: node tests/os-examples-compile.cjs

  posix-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile C experiments with warnings as errors
        run: |
          mkdir -p /tmp/os-lab-bins
          cc -std=c11 -Wall -Wextra -Werror os/linux-labs/pipe-demo.c -o /tmp/os-lab-bins/pipe-demo
          cc -std=c11 -Wall -Wextra -Werror -pthread os/linux-labs/condvar-demo.c -o /tmp/os-lab-bins/condvar-demo
          cc -std=c11 -Wall -Wextra -Werror os/linux-labs/cow-demo.c -o /tmp/os-lab-bins/cow-demo
          cc -std=c11 -Wall -Wextra -Werror os/linux-labs/durable-replace.c -o /tmp/os-lab-bins/durable-replace
      - name: Verify output and deterministic exit status
        run: |
          set -eu
          test "$(/tmp/os-lab-bins/pipe-demo)" = "hello IPC"
          test "$(/tmp/os-lab-bins/condvar-demo)" = "ready=1 seen=1"
          test "$(/tmp/os-lab-bins/cow-demo)" = "parent=5"
          /tmp/os-lab-bins/durable-replace /tmp/os-lab-fs-test
          test "$(cat /tmp/os-lab-fs-test/file.txt)" = "durable demo"

  l4-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce both Linux service modes and check metrics and log integrity
        run: python3 os/linux-labs/l4/selftest.py

  chromium-maple:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-lab
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: duicn187532/self-research
          path: self-research
          sparse-checkout: |
            assets/maple
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium and Playwright
        working-directory: os-lab
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
      - name: Run all OS LAB interactions and Maple regressions
        working-directory: os-lab
        run: |
          node tests/poc-server.cjs "$GITHUB_WORKSPACE" 8000 >/tmp/os-poc-server.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/os-lab/os/ >/dev/null; then break; fi
            sleep 1
          done
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-review.cjs
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-maple-review.cjs
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-browser-judge.cjs

  cross-browser-semantic:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-lab
      - uses: actions/checkout@v4
        with:
          repository: duicn187532/self-research
          path: self-research
          sparse-checkout: |
            assets/maple
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright engine
        working-directory: os-lab
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
      - name: Test semantic correctness, MathML and touch-sized responsive layouts
        working-directory: os-lab
        env:
          ENGINE: ${{ matrix.engine }}
          TEST_URL: http://localhost:8000/os-lab/os/
        run: |
          node tests/poc-server.cjs "$GITHUB_WORKSPACE" 8000 >/tmp/os-cross-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/os-lab/os/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/os-crossbrowser-semantic.cjs

  cross-browser-semantic-webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-lab
      - uses: actions/checkout@v4
        with:
          repository: duicn187532/self-research
          path: self-research
          sparse-checkout: |
            assets/maple
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright engine
        working-directory: os-lab
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
      - name: Test semantic correctness, MathML and touch-sized responsive layouts
        working-directory: os-lab
        env:
          ENGINE: webkit
          TEST_URL: http://localhost:8000/os-lab/os/
        run: |
          node tests/poc-server.cjs "$GITHUB_WORKSPACE" 8000 >/tmp/os-cross-browser.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/os-lab/os/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/os-crossbrowser-semantic.cjs

  browser-multilang:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-lab
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium / Playwright
        working-directory: os-lab
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Download integrity-verified WASM runtimes
        working-directory: os-lab
        run: bash shared/code/tools/vendor.sh
      - name: Judge C, C++ and Python in the actual browser sandbox
        working-directory: os-lab
        run: |
          node tests/poc-server.cjs "$GITHUB_WORKSPACE" 8000 >/tmp/os-lab-multilang-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/os-lab/os/ >/dev/null && break
            sleep 1
          done
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-browser-multilang.cjs
      - name: Execute real WASM/Pyodide SRTF, LRU, Banker and COW regressions
        working-directory: os-lab
        run: |
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-browser-wasm.cjs

  cross-browser:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium]
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-lab
      - uses: actions/checkout@v4
        with:
          repository: duicn187532/self-research
          path: self-research
          sparse-checkout: |
            assets/maple
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install one Playwright engine
        working-directory: os-lab
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
      - name: Validate L2/L3 MathML, interaction and mobile layouts
        working-directory: os-lab
        env:
          ENGINE: ${{ matrix.engine }}
        run: |
          node tests/poc-server.cjs "$GITHUB_WORKSPACE" 8000 >/tmp/os-crossbrowser-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/os-lab/os/ >/dev/null && break
            sleep 1
          done
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-crossbrowser.cjs
  cross-browser-webkit:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          path: os-lab
      - uses: actions/checkout@v4
        with:
          repository: duicn187532/self-research
          path: self-research
          sparse-checkout: |
            assets/maple
          sparse-checkout-cone-mode: true
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install one Playwright engine
        working-directory: os-lab
        run: |
          npm install --no-save --no-package-lock playwright@1.58.2
      - name: Validate L2/L3 MathML, interaction and mobile layouts
        working-directory: os-lab
        env:
          ENGINE: webkit
        run: |
          node tests/poc-server.cjs "$GITHUB_WORKSPACE" 8000 >/tmp/os-crossbrowser-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:8000/os-lab/os/ >/dev/null && break
            sleep 1
          done
          TEST_URL=http://localhost:8000/os-lab/os/ node tests/os-crossbrowser.cjs
