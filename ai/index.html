</style></head><body><div class="app"><aside class="sidebar" id="sidebar"><a class="brand" href="#/" aria-label="返回首頁"><span class="brandMark">A<span>·</span>I</span><span class="brandTitle">AI <strong>LAB</strong><small>ALGORITHMS · MODELS · SYSTEMS</small></span></a><div class="sideIntro">讓神經網路、模型公式與演算法，能被親手觀察與驗證。</div><div class="progressWrap"><div class="progressTitle"><span>學習進度</span><strong id="progressText">0 / 24</strong></div><div class="progressTrack"><div id="progressBar"></div></div></div><div class="sideCaption">COURSE MAP · 24 CHAPTERS</div><nav class="chapterNav" id="chapterNav" aria-label="課程章節"></nav><div class="sideFoot"><button class="subtleBtn" id="clearBtn">↺ 清除我的學習紀錄</button><small>進度與筆記僅保存在目前的瀏覽器。</small><small><a href="../">← 返回 OS LAB</a>　<a href="../dsa/">DSA LAB ↗</a></small></div></aside><div class="backdrop" id="backdrop"></div><div class="workspace"><header class="topbar"><button id="menuBtn" class="menuBtn" aria-label="開啟章節選單">☰</button><div class="crumb"><span>AI LAB</span><span> / </span><span id="crumbName">學習總覽</span></div><div class="topRight"><span class="stateDot"></span> 本機模擬 · 離線教材 <button class="iconBtn" id="themeBtn" aria-label="切換深淺色" title="切換深淺色">☼</button></div></header><main id="main" tabindex="-1"></main><footer class="siteFoot">AI LAB · 繁體中文 · 原創概念教材 · 示意實驗不等於大型模型真實輸出 · 所有運算在你的裝置執行</footer></div></div><script>const CHAPTERS = [{"title":"AI 全貌：從規則到生成模型","subtitle":"先分清任務、資料、模型、訓練與推論的角色","tag":"起點","analogy":"把 AI 想成學習食譜的廚師：資料是練習菜色，模型是可調整的做法，訓練是修正做法，推論是拿學到的做法處理新訂單。","limit":"廚師有常識，模型未必有；模型可能把資料偏差一併學會，也不保證回答有事實根據。","sections":[["什麼是模型？","模型是一個把輸入 x 映射成預測 y 的可計算函數 fθ(x)。θ 是參數，訓練就是從資料找到適當的 θ。規則式系統則直接由人寫出規則，不一定有訓練階段。"],["學習範式","監督式學習使用帶答案的樣本；非監督式從資料找結構；強化學習透過行動與回饋學策略。深度學習是用多層神經網路學複雜函數，不等於所有 AI。"],["完整生命週期","定義問題 → 蒐集與切分資料 → 建立 baseline → 訓練與調參 → 獨立測試 → 部署推論 → 監測漂移與回饋。訓練集不等於測試集；模型準確不代表產品一定有用。"],["生成式與判別式","判別式模型重在預測類別或數值；生成式模型學習資料分布並生成新內容。LLM 常以預測下一個 token 訓練，再用對話微調或偏好最佳化改善互動。"]],"formula":"模型：ŷ = fθ(x)；訓練：找出讓 Loss(θ) 較小的 θ。","code":"def predict(x, w, b):\n    return w * x + b\n\nprint(predict(3, w=2, b=1))  # 7","lab":"pipeline","q":[["監督式學習需要哪種資料？",["只有輸入","輸入與對應答案","只有獎勵"],1,"監督式訓練需要標記或目標值供損失計算。"],["訓練與推論的差別？",["訓練更新參數；推論使用參數","兩者都必更新參數","推論不需要輸入"],0,"推論一般使用已學參數，不會自動更新權重。"],["哪個比較合理？",["先看測試集再選特徵","用獨立測試集做最終評估","只報訓練準確率"],1,"否則容易因資料洩漏或過度調參而高估效能。"]]},{"title":"向量與矩陣：模型的語言","subtitle":"內積、長度、維度與餘弦相似度","tag":"數學","analogy":"向量就像給每個物品一張數值身分證；模型可比較兩張身分證有多像。","limit":"相似向量不代表語義必然相同；向量的意義依賴訓練目標、尺度與資料分布。","sections":[["向量與維度","向量 x=[x₁,…,xₙ] 表示 n 個特徵。矩陣 W 把多個輸入特徵組合成新的輸出，神經網路中的線性層常使用 Wx+b。"],["內積與幾何","內積 x·y=Σxᵢyᵢ。兩個向量方向越接近，標準化後的內積通常越大；向量長度由 ||x||₂=√Σxᵢ² 計算。"],["相似度陷阱","餘弦相似度量方向而非數值總量；向量若為零向量則沒有餘弦相似度。檢索時需了解 embedding 模型的正規化、語言與距離設定。"],["矩陣維度檢查","若 W 為 m×n、x 為 n×1，則 Wx 為 m×1。維度不吻合無法相乘，這是理解深度模型 tensor shape 的基礎。"]],"formula":"cos(x,y) = (x·y) / (||x||₂||y||₂)，其中 x、y 均非零。","code":"import math\nx, y = [1, 2], [2, 1]\ndot = sum(a*b for a,b in zip(x,y))\nnorm = lambda v: math.sqrt(sum(t*t for t in v))\nprint(dot / (norm(x)*norm(y)))  # 0.8","lab":"vector","q":[["[1,2]·[3,4] 是多少？",["7","11","14"],1,"內積為 1×3 + 2×4 = 11。"],["餘弦相似度主要量測？",["方向夾角","向量分量之和","訓練參數總數"],0,"餘弦是兩向量標準化後的方向關係。"],["W 為 4×3、x 為 3×1，輸出維度是？",["3×1","4×1","4×3"],1,"內部維度 3 相符，輸出 4×1。"]]},{"title":"微分與梯度下降","subtitle":"從誤差函數推導參數更新","tag":"數學","analogy":"閉著眼睛走下山：梯度告訴你當地往哪邊最陡，學習率決定跨多大步。","limit":"梯度下降不是全域最佳保證；高學習率可能震盪，低學習率收斂慢，非凸函數有鞍點。","sections":[["導數是局部變化率","f′(w) 說明 w 增加一點時 f 大約改變多少。多變數時梯度 ∇L 是所有偏導數組成的向量。"],["梯度更新","wₜ₊₁ = wₜ − η∂L/∂w。η 是 learning rate。正梯度往左走；負梯度往右走。"],["損失與最佳化","損失衡量預測與目標差距。對 L(w)=(w−3)²，導數為 2(w−3)；最佳解 w=3。以實驗觀察不同 η 的收斂。"],["批次與雜訊","Batch GD 使用全部樣本算梯度，SGD 使用單樣本，Mini-batch 取折衷。梯度雜訊有時可幫助探索但也會增加波動。"]],"formula":"對 L(w)=(w−3)²：dL/dw=2(w−3)，更新 w ← w − η·2(w−3)。","code":"w, lr = -4.0, 0.2\nfor step in range(8):\n    grad = 2 * (w - 3)\n    w -= lr * grad\n    print(step, round(w, 4))","lab":"gradient","q":[["L=(w−3)² 在 w=5 的梯度？",["2","4","8"],1,"2×(5−3)=4。"],["學習率非常大可能造成？",["保證加速","震盪或發散","停止計算梯度"],1,"一步跨過最佳點太遠會反覆震盪或發散。"],["負梯度代表往哪個方向更新 w？",["增加","減少","不改變"],0,"w−η×負數 等於 w 增加。"]]},{"title":"機率、條件機率與 Bayes","subtitle":"理解先驗、證據與後驗","tag":"數學","analogy":"篩檢陽性就像煙霧警報響起：響了代表有可能著火，但要考慮原本失火的機率以及誤報率。","limit":"Bayes 只更新機率，不會修復錯誤的先驗或不適用的條件獨立假設。","sections":[["條件機率","P(A|B) 表示在已知 B 發生的條件下 A 的機率，通常與 P(B|A) 不同。"],["Bayes 定理","P(A|B)=P(B|A)P(A)/P(B)。P(A) 是 prior、P(B|A) 是 likelihood、P(A|B) 是 posterior。"],["基準率問題","當疾病很少見，即使測試靈敏度高，陽性者仍可能有相當比例是偽陽性。請用互動實驗改變盛行率驗證。"],["機率與不確定性","分類器的信心分數不一定等於真實機率。Calibration 衡量分數與實際事件頻率是否一致。"]],"formula":"P(疾病|陽性)=敏感度×盛行率 / [敏感度×盛行率 + 偽陽率×(1−盛行率)]。","code":"p, sens, spec = 0.01, 0.95, 0.90\ntrue_positive = sens*p\nfalse_positive = (1-spec)*(1-p)\nprint(true_positive/(true_positive+false_positive))","lab":"bayes","q":[["P(A|B) 與 P(B|A)？",["一定相等","通常不同","無法計算"],1,"已知 B 發生與已知 A 發生的條件不同。"],["疾病很罕見時，陽性者確診機率？",["必為 95%","需合併先驗與偽陽性","必為 50%"],1,"不能忽略基準率。"],["Posterior 指的是？",["先驗","更新證據後的機率","梯度"],1,"Posterior 即後驗機率。"]]},{"title":"線性迴歸與損失函數","subtitle":"MSE、參數、殘差與欠擬合","tag":"監督學習","analogy":"在散佈的點群中放一把尺，調整斜率與截距，讓尺盡量貼近資料的趨勢。","limit":"線性迴歸的「線性」是對參數線性；殘差小不代表因果關係，也不保證外插可信。","sections":[["模型與參數","ŷ=wx+b；w 決定斜率、b 決定截距。模型可延伸到多個特徵 ŷ=w·x+b。"],["MSE 的意義","MSE = (1/n)Σ(ŷ−y)²。平方讓大誤差被重罰，對極端值敏感。MAE 改用誤差絕對值，較不受極端值影響。"],["欠擬合與殘差","若資料明顯彎曲，直線可能無法描述；此時增加數據量不一定解決，需考慮特徵轉換或不同模型。"],["資料切分","使用 training 找參數、validation 選模型、test 報告最終泛化能力。絕對不要把測試資料拿回來當訓練訊號。"]],"formula":"MSE(w,b) = (1/n) Σᵢ (wxᵢ+b−yᵢ)²。","code":"points = [(0, 1), (1, 3), (2, 5)]\nw, b = 2, 1\nmse = sum((w*x+b-y)**2 for x,y in points)/len(points)\nprint(mse)  # 0","lab":"regression","q":[["ŷ=2x+1，x=4 時預測？",["7","9","11"],1,"2×4+1=9。"],["MSE 對大的離群誤差？",["特別敏感","完全不敏感","一律忽略"],0,"因為誤差被平方。"],["測試集最主要用途？",["調參","最終評估泛化","計算每次梯度"],1,"測試集應盡量保持獨立。"]]},{"title":"分類、Logistic Regression 與指標","subtitle":"Sigmoid、混淆矩陣與門檻取捨","tag":"監督學習","analogy":"信用風險模型就像門口的辨識員：先給出風險分數，再用門檻決定要不要攔下來。","limit":"分類閾值並非模型本身的真理；Accuracy 很高也可能漏掉稀少但重要的正例。","sections":[["由分數到機率","Logistic Regression 先算 z=w·x+b，再用 sigmoid(z)=1/(1+e^(−z)) 將分數映到 0–1。"],["分類門檻","決策是 p≥τ 判為正例。降低 τ 通常增加召回率，也可能增加偽陽性；必須依任務成本調整。"],["混淆矩陣","TP：正例判正；FP：負例判正；FN：正例判負；TN：負例判負。Precision=TP/(TP+FP)，Recall=TP/(TP+FN)。"],["校準與評估","Accuracy、F1、ROC-AUC、PR-AUC 衡量不同面向。極不平衡資料要關注基準率、PR 曲線與實際決策成本。"]],"formula":"Precision=TP/(TP+FP)；Recall=TP/(TP+FN)；F1=2PR/(P+R)。","code":"import math\nsigmoid=lambda z: 1/(1+math.exp(-z))\nfor x in [-2, 0, 2]:\n    p=sigmoid(x)\n    print(x, round(p,3), 'positive' if p>=.5 else 'negative')","lab":"classification","q":[["FN 是什麼？",["負例判正","正例判負","正例判正"],1,"False Negative：實際為正、預測為負。"],["下降分類門檻通常會？",["提高召回","降低召回","完全不變"],0,"更多樣本被判正，有助降低 FN，但可能提高 FP。"],["高度不平衡資料只看 Accuracy？",["足夠","不夠","等於 Recall"],1,"大量預測多數類也能有很高 Accuracy。"]]},{"title":"kNN：讓鄰居投票","subtitle":"距離、特徵尺度與決策邊界","tag":"監督學習","analogy":"搬到新社區，想知道附近房子價格：看最接近的幾間房，比較它們的結果。","limit":"近不代表同類。距離對特徵尺度很敏感；kNN 預測時要保存資料並做距離搜尋。","sections":[["k 與決策邊界","kNN 對新點找出 k 個最近的訓練樣本，分類時多數決、迴歸時平均。k 小易對噪音敏感；k 大易過度平滑。"],["尺度問題","若收入以百萬計、年齡以十位數計，未正規化時收入可能主宰歐氏距離。"],["距離與複雜度","歐氏距離 √Σ(xᵢ−yᵢ)²。暴力 kNN 每次查詢大致需檢查 n 個樣本，維度 d 時 O(nd)。"],["高維度困境","維度很高時距離差異可能變小，鄰居概念變得不穩定。可搭配特徵選擇、PCA 或近似最近鄰。"]],"formula":"d(x,y) = √Σ(xᵢ−yᵢ)²；預測 = 最近 k 個鄰居的多數類別。","code":"points=[(0,0,'A'), (1,1,'A'), (4,4,'B')]\nquery=(1.2,0.8)\nranked=sorted(points,key=lambda p:(p[0]-query[0])**2+(p[1]-query[1])**2)\nprint(ranked[0][2])","lab":"knn","q":[["k=1 的主要風險？",["噪音敏感","必然速度最快訓練","不需距離"],0,"最近單點可能是雜訊或異常值。"],["特徵量綱差異很大時？",["先標準化","忽略即可","調大 k 就好"],0,"距離計算可能被大數值尺度主導。"],["kNN 常被稱為？",["Lazy learner","Generative adversarial","Decision tree"],0,"kNN 大多將資料保留到預測時計算鄰居。"]]},{"title":"決策樹、Bagging 與 Boosting","subtitle":"資訊增益、過擬合與集成學習","tag":"監督學習","analogy":"決策樹像玩二十個問題：每次問一個能縮小不確定性的問題，最後抵達葉節點。","limit":"樹很容易記住訓練集；集成方法能改善泛化，但也有模型大小與解釋成本。","sections":[["分割的目標","決策樹找特徵閾值切分資料，期望子節點更純。可用 Gini impurity 或 entropy 衡量分類混雜程度。"],["過擬合","無限制生長的樹可把訓練樣本分得很細，但可能對新資料失效。可限制深度、葉節點最小樣本數等。"],["Random Forest","Bagging 在不同 bootstrap 樣本上訓練多棵樹，再投票或平均；特徵隨機性降低樹間相關。"],["Gradient Boosting","逐步新增弱學習器修正現有模型的誤差方向。與 Bagging 的平行建樹思路不同，通常對超參數更敏感。"]],"formula":"Gini(p) = 1 − Σₖ pₖ²；純節點的 Gini = 0。","code":"def gini(labels):\n    counts = {x: labels.count(x) for x in set(labels)}\n    n = len(labels)\n    return 1 - sum((c/n)**2 for c in counts.values())\nprint(gini(['A','A','B','B']))  # 0.5","lab":"tree","q":[["Gini=0 的節點表示？",["各類平均","樣本同一類","模型必定過擬合"],1,"純節點沒有類別混雜。"],["Random Forest 主要屬於？",["Bagging","Boosting","Clustering"],0,"對多棵有隨機性的樹做集成。"],["限制最大樹深通常是為了？",["控制模型複雜度","提高參數量","將訓練集加倍"],0,"限制深度能減少過度擬合。"]]},{"title":"非監督學習：K-means","subtitle":"群中心、距離與局部最佳","tag":"非監督學習","analogy":"把散落桌上的彩色積木分堆：先決定幾個代表點，再反覆把積木分給最近的代表點。","limit":"K-means 的群不一定代表真實類別；受初始中心、特徵尺度、離群點與 k 影響，偏好球狀群。","sections":[["K-means 的兩步","Assignment：每個樣本歸到最近的中心；Update：把中心移到同群樣本的平均位置。重複到收斂或達上限。"],["目標函數","最小化同群樣本到各自群中心的平方距離總和 WCSS。不同初始化可能落在不同局部極小值。"],["選 k 的方法","Elbow、Silhouette 與下游用途可輔助，但不存在永遠正確的 k。必須先判斷資料是否適合分群。"],["實務注意","先處理離群值、尺度與缺失；非球形或密度不同的群可能改用 DBSCAN、階層式分群等。"]],"formula":"WCSS = Σᵢ ||xᵢ − μ_{cluster(i)}||²。","code":"points=[1,2,3,8,9,10]\ncenters=[2.0,9.0]\nfor _ in range(3):\n    groups=[[x for x in points if abs(x-c)<=abs(x-centers[1-j])] for j,c in enumerate(centers)]\n    centers=[sum(g)/len(g) if g else centers[j] for j,g in enumerate(groups)]\nprint(centers)","lab":"kmeans","q":[["K-means 更新中心的位置？",["中位數","該群平均值","最大值"],1,"標準 K-means 使用均值做群中心。"],["WCSS 通常在每次有效迭代時？",["不增加","一定增加","變成負數"],0,"兩步都不會增加標準平方距離目標。"],["不同初始化可能？",["不同分群結果","永遠同一解","不影響收斂"],0,"可能得到不同局部最小值。"]]},{"title":"降維與 PCA","subtitle":"協方差、主成分與資訊保留","tag":"非監督學習","analogy":"把 3D 雕塑拍成 2D 照片：挑一個最能保留形狀差異的方向來投影。","limit":"保留最大變異不代表保留最大預測資訊；PCA 是線性方法，也不會自動理解語義。","sections":[["從中心化開始","對每個特徵扣掉訓練集平均，觀察各方向的散佈。未中心化時主方向可能受整體位置影響。"],["主成分","第一主成分是讓投影變異最大的單位方向；後續主成分與前面方向正交。"],["特徵值與保留率","可用協方差矩陣的 eigenvector 找方向，對應 eigenvalue 表示該方向變異。解釋變異比率為特徵值除以總和。"],["資料洩漏","資料標準化與 PCA 的參數必須只在 training fit，然後再 transform validation/test。"]],"formula":"投影 z = uᵀ(x−μ)；u 為單位主成分方向。","code":"points=[(1,1),(2,2),(3,3)]\nmean=[sum(p[d] for p in points)/len(points) for d in [0,1]]\nprint('center:', mean)\nprint('projection:', [((p[0]-mean[0])+(p[1]-mean[1]))/2**0.5 for p in points])","lab":"pca","q":[["第一主成分最大化？",["投影變異","標籤準確率","輸出 token"],0,"PCA 是無監督的變異最大化。"],["PCA 在所有資料先 fit 再切分？",["合理","容易資料洩漏","跟標準化無關"],1,"驗證與測試資訊不該進入 fit。"],["主成分之間（標準 PCA）？",["正交","必相等","相同方向"],0,"標準 PCA 的主方向互相正交。"]]},{"title":"感知器與神經網路","subtitle":"權重、偏置、啟動函數與多層表示","tag":"深度學習","analogy":"把簡單感測器串起來：第一層找基礎訊號，後面幾層將訊號組合成更抽象的模式。","limit":"神經元只是數學運算單元，不等同生物神經元；深層不代表一定準確，模型容量需要資料與正則化。","sections":[["一個人工神經元","輸入 x 經加權求和 z=w·x+b，再經 activation 函數 a=φ(z)，把線性組合轉成可表達非線性的輸出。"],["為什麼要有非線性","若每層都是線性映射，多層線性模型仍可合併成單層線性映射，難以學 XOR 等非線性關係。"],["常見啟動函數","ReLU=max(0,z)，Sigmoid 把值壓到 0–1，Tanh 到 −1–1。選擇取決於層型、輸出範圍與梯度特性。"],["MLP 與 XOR","有隱藏層的神經網路可組合多個線性邊界，處理 XOR。實作時看清每層形狀、參數量與輸出維度。"]],"formula":"第 ℓ 層：a⁽ˡ⁾ = φ(W⁽ˡ⁾a⁽ˡ⁻¹⁾ + b⁽ˡ⁾)。","code":"relu=lambda z: max(0.0,z)\nx=[1.0,-2.0]\nw=[0.5,0.2]\nb=0.1\nz=sum(a*b for a,b in zip(x,w))+b\nprint('z=',z,'activation=',relu(z))","lab":"neuron","q":[["所有層都沒有非線性會？",["等價於單一線性轉換","更能學 XOR","自動生成注意力"],0,"線性函數的組合依然線性。"],["ReLU(−3) 是？",["−3","0","3"],1,"ReLU 把負值截成 0。"],["Bias 的作用？",["平移決策函數","決定訓練資料大小","取代梯度"],0,"偏置允許模型不必經原點。"]]},{"title":"反向傳播與自動微分","subtitle":"用鏈式法則將誤差傳回各層","tag":"深度學習","analogy":"工廠產品出錯，反向追查每個工序貢獻了多少誤差，再分別調整機台。","limit":"反向傳播不是模型「倒著預測」；它計算梯度。自動微分也不等於符號微分或有限差分。","sections":[["計算圖","前向傳播把中間值存成計算圖，反向傳播從 Loss 出發，沿圖套用鏈式法則求參數偏導。"],["鏈式法則","若 L=(wx−y)²，則 dL/dw = 2(wx−y)×x；每個局部導數相乘傳遞。"],["梯度消失與爆炸","深網反覆相乘可能讓梯度很小或很大。ReLU、殘差連接、正規化、初始化與梯度裁剪可緩解特定問題。"],["Autograd 的角色","PyTorch 類框架會追蹤可微運算建計算圖；backward() 計算梯度，但 optimizer.step() 才更新參數。"]],"formula":"若 u=wx、L=(u−y)²，則 ∂L/∂w=2(u−y)x。","code":"x,y,w = 2.0,7.0,1.0\nu=w*x\nloss=(u-y)**2\ngrad=2*(u-y)*x\nprint('loss=',loss,'dL/dw=',grad)","lab":"backprop","q":[["反向傳播的主要產物？",["梯度","測試標籤","新資料"],0,"它有效率計算可微參數的導數。"],["d(wx)/dw 為？",["w","x","0"],1,"x 對 w 視為常數。"],["PyTorch 的 backward() 通常會？",["更新參數","計算梯度","切換成 eval mode"],1,"optimizer.step() 才執行權重更新。"]]},{"title":"泛化、正則化與最佳化器","subtitle":"L1/L2、Dropout、Early stopping、Adam","tag":"深度學習","analogy":"考試準備不能只背練習題答案；你要能解新題。正則化像限制過度複雜的解題技巧。","limit":"驗證集也可能被反覆調整到過擬合；正則化並非越強越好，Dropout 推論時一般需關閉。","sections":[["Bias–Variance","模型太簡單可能欠擬合，太複雜可能高方差。不同資料量、噪音及任務會改變最佳複雜度。"],["L1 與 L2","L1 懲罰權重絕對值和，可能產生稀疏權重；L2 懲罰平方和，傾向平滑縮小權重。"],["Dropout 與 Early stopping","Dropout 訓練時隨機遮蔽部分單元；Early stopping 依驗證指標停止訓練。兩者目標是提升泛化而不是讓訓練損失最小。"],["Adam、SGD 與資料切分","Adam 使用梯度動量與二階矩估計；SGD+momentum 更簡潔。要控制 seed、學習率與 leakage，並監控 train/validation gap。"]],"formula":"L_total = L_data + λ Σⱼ wⱼ²（L2 示意，常數因定義而異）。","code":"weights=[2.0,-3.0,0.5]\nlambda_=0.1\nl2_penalty=lambda_*sum(w*w for w in weights)\nprint('L2 penalty:',l2_penalty)","lab":"regularization","q":[["L2 的主要作用？",["懲罰過大權重","提高資料維度","刪掉測試集"],0,"它偏好較小參數幅度。"],["Early stopping 多依據？",["驗證集指標","測試集答案","模型參數總和"],0,"避免訓練太久而惡化泛化。"],["Dropout 在一般推論時？",["通常關閉","必須保持相同遮蔽","改用反向傳播"],0,"標準推論使用訓練框架設定的 eval mode。"]]},{"title":"CNN 與卷積","subtitle":"局部感受野、濾波器、池化","tag":"深度學習","analogy":"用一個小印章在照片上滑動：每個位置都測試同樣的形狀是不是出現了。","limit":"卷積輸出不是天然具有平移不變性；步幅、padding、池化與架構會影響位置敏感性。","sections":[["卷積運算","用小型 kernel 在圖片上滑動，計算局部點積。深度學習實務上的「卷積」常是互相關而非數學上反轉核的卷積。"],["參數共享","同一組 kernel 權重套用到所有位置，較全連接層省參數，且具有平移等變的性質（在適當邊界條件下）。"],["Stride 與 Padding","Stride 決定每次滑動幾格，Padding 決定邊界補齊；二者影響輸出 feature map 的尺寸。"],["Pooling","Max pooling 在區域取最大值，可減少空間解析度；代價可能是失去細節。現代架構也常用 strided convolution。"]],"formula":"輸出尺寸 = floor((N + 2P − K)/S) + 1（單維、無 dilation 示意）。","code":"img=[1,2,3,4,5]\nkernel=[1,-1]\nresult=[sum(img[i+j]*kernel[j] for j in range(2))\n        for i in range(len(img)-1)]\nprint(result)  # [-1,-1,-1,-1]","lab":"cnn","q":[["3×3 卷積核主要看？",["局部 3×3 區域","整張圖每一點","只有角落"],0,"局部感受野用共享權重掃過影像。"],["Stride 變大通常會？",["縮小輸出尺寸","增加輸出尺寸","不影響輸出"],0,"滑動位置變少。"],["深度學習框架常稱 Conv2d 的內積本質？",["互相關（常不反轉核）","矩陣反矩陣","二分搜尋"],0,"多數框架實作是 cross-correlation。"]]},{"title":"序列模型：RNN 與 LSTM","subtitle":"狀態、時間依賴與長期記憶","tag":"深度學習","analogy":"讀故事時帶著一張便利貼：每看到一個新字，就更新便利貼上的摘要，供下一步參考。","limit":"隱藏狀態不是可靠、無損的長期記憶；RNN 並行能力與長距依賴有先天限制。","sections":[["RNN 更新","hₜ = φ(Wₓxₜ + Wₕhₜ₋₁+b)。相同參數跨時間共享，每步的隱藏狀態受過去影響。"],["BPTT","時間展開後，反向傳播需穿過很多時間步，可能梯度消失或爆炸。截斷 BPTT 限制反傳長度。"],["LSTM / GRU","門控機制決定保留、寫入與輸出的訊息，使長期依賴較易學習；但不代表無限制記憶。"],["為何 Transformer 受到重視","Self-attention 讓位置能直接關聯其他位置，避免標準 RNN 的完全順序依賴，適合平行訓練。"]],"formula":"hₜ = tanh(Wₓxₜ + Wₕhₜ₋₁ + b)。","code":"import math\nh=0.0\nfor token in [1.0,0.5,-0.5,0.8]:\n    h=math.tanh(0.8*token+0.6*h)\n    print(round(h,3))","lab":"rnn","q":[["RNN 的 hₜ 主要依賴？",["xₜ 與 hₜ₋₁","只有最後輸出","資料筆數"],0,"當前輸入和上一個隱狀態決定新狀態。"],["LSTM 的門控作用？",["控制資訊流","加大像素尺寸","取代所有損失函數"],0,"門控制哪些資訊寫入、遺忘和讀出。"],["長序列 RNN 常見挑戰？",["梯度消失與順序瓶頸","不需梯度","沒有參數"],0,"時間展開容易導致難以學長距依賴。"]]},{"title":"Attention 與 Transformer","subtitle":"Query、Key、Value、多頭注意力","tag":"現代模型","analogy":"讀句子中的「它」時，先看整句裡哪些詞最相關，再加權收集資訊，而不是只盯前一個字。","limit":"注意力權重不等於模型可解釋性的充分證據；多頭注意力也不保證每個頭都有可讀語義。","sections":[["Q、K、V 的角色","Query 表示目前位置「要找什麼」，Key 表示每個位置「能匹配什麼」，Value 是被加權彙整的內容。"],["縮放點積注意力","Scores=QKᵀ/√dₖ，逐列 softmax 取得權重，再乘 V 得輸出。縮放避免內積在高維度時過大使 softmax 飽和。"],["Causal mask","自回歸 LLM 不能偷看未來 token，訓練與推論需用 mask 遮掉不允許的位置。"],["Transformer 區塊","常見組合：Multi-head attention、residual connection、normalization、feed-forward network。Encoder 與 decoder 的注意力遮罩和用途不同。"]],"formula":"Attention(Q,K,V) = softmax(QKᵀ/√dₖ)V。","code":"import math\nscores=[1.0,2.0,0.5]\nexp=[math.exp(s-max(scores)) for s in scores]\nweights=[e/sum(exp) for e in exp]\nvalues=[10,20,0]\nprint('attention output=',sum(w*v for w,v in zip(weights,values)))","lab":"attention","q":[["注意力輸出的來源？",["Value 的加權和","Query 的直接複製","Loss"],0,"注意力用權重對 V 做加權組合。"],["為什麼除以 √dₖ？",["控制內積尺度","讓模型不需訓練","消除 padding"],0,"降低高維點積過大造成 softmax 飽和。"],["Causal mask 避免？",["看到未來 token","梯度下降","所有 padding"],0,"自回歸模型只能依賴已可見 token。"]]},{"title":"Tokenization、Embedding 與位置","subtitle":"從文字變成模型可計算的序列","tag":"現代模型","analogy":"閱讀前先把句子拆成樂高積木，每塊積木得到一個編號，再查表變成可學習的向量。","limit":"Token 不等於字、詞或固定字元；不同 tokenizer 會用不同的切分法。位置資訊也不只一種設計。","sections":[["Tokenizer","BPE、WordPiece、Unigram 等把原始文字轉成 token ID。切分方式影響成本、上下文長度與多語言表現。"],["Embedding lookup","每個 token ID 查到一列可訓練向量，形成 shape = sequence length × hidden dimension 的矩陣。"],["位置編碼","因為 attention 本身不自然包含序列順序，需要額外位置訊息。方法包括 learned positions、正弦編碼與旋轉位置編碼 RoPE。"],["上下文長度","模型上下文長度有限，KV cache 可加速自回歸解碼卻需記憶體。token 費用與文字長度不是簡單等號。"]],"formula":"輸入嵌入 X ∈ ℝ^(T×d)；T 是 token 數，d 是 hidden dimension。","code":"vocab={'我':1,'愛':2,'AI':3,'<unk>':0}\ntokens=['我','愛','AI']\nids=[vocab.get(t,0) for t in tokens]\nprint(ids)  # [1,2,3]","lab":"token","q":[["Token 一定等於一個中文詞嗎？",["是","不一定","每個 token 一定兩個字"],1,"切詞方式依 tokenizer 及語料而異。"],["位置編碼的主要理由？",["提供序列順序資訊","改變 vocabulary 大小","執行 batch norm"],0,"讓模型可區別位置與順序。"],["Token embedding 的本質？",["可學習的查表向量","固定 one-hot 不能訓練","純文字直接入 GPU"],0,"Embedding 參數可透過訓練更新。"]]},{"title":"LLM 訓練、推論與 Sampling","subtitle":"預訓練、指令微調、溫度與 Top-k","tag":"現代模型","analogy":"一個接龍高手，先大量練習接下一個詞，之後再學如何遵循人類指令與偏好。","limit":"下一個 token 預測不等於查證事實；低溫度不保證無幻覺，高溫度也不代表更有創意的保證。","sections":[["預訓練目標","自回歸語言模型最大化序列中每個下一 token 的條件機率，常用 cross-entropy loss。"],["指令微調與偏好最佳化","SFT 使用示範回答對模型調整；偏好學習可使用 DPO、RLHF 等方法。它們影響回答風格與任務遵循，不能取代知識驗證。"],["推論逐 token 生成","模型輸出 logits → softmax → sampling → 附加 token → 重複。Temperature、Top-k、Top-p 影響取樣分布。"],["延遲與資源","Prefill 處理輸入提示；decode 階段逐 token 生成。KV cache 省重算但占記憶體。評估 TPS、TTFT、token 品質及併發。"]],"formula":"P(next token | prefix) = softmax(logits / temperature)。","code":"import math\nlogits=[2.0,1.0,0.0]\ntemperature=0.8\nv=[x/temperature for x in logits]\ne=[math.exp(x-max(v)) for x in v]\nprint([round(x/sum(e),3) for x in e])","lab":"sampling","q":[["Temperature 下降通常使分布？",["更集中於高分 token","更平均","完全隨機"],0,"較低溫度通常讓最高 logits 更突出。"],["LLM 一般如何產生回答？",["逐 token 自回歸生成","一次寫好整段文字再查字典","直接搜尋唯一答案"],0,"每步根據前綴產生下個 token 的分布。"],["KV cache 主要節省？",["重算歷史 token 的注意力 key/value","標記資料","GPU 硬體溫度"],0,"可重用先前位置的 K/V，但仍有顯存成本。"]]},{"title":"RAG 與向量檢索","subtitle":"Chunk、Embedding、Top-k、Rerank 與證據品質","tag":"應用系統","analogy":"開卷考時不只靠背誦：先從書架找相關段落，再根據段落回答，並註明來源。","limit":"檢索得到文件不等於文件正確、有效或適用；RAG 無法保證杜絕幻覺，也需防範檢索內容中的惡意指示。","sections":[["RAG 的步驟","文件切塊 → 建立檢索索引 → 問題向量化 → 召回候選 → rerank → 組裝證據 → LLM 生成與引用。"],["Sparse、Dense、Hybrid","BM25 側重詞項匹配；Dense Retrieval 擅長語義相似；Hybrid 可融合排名。不能假設向量相似度高就是權威性高。"],["評估維度","分別評估 Retrieval Recall@k、MRR、證據適用性、答案忠實度、引用正確性及 end-to-end 成功率。"],["來源治理","文件版本、有效期間、權威等級與適用範圍非常重要；須考慮敏感資料、prompt injection 與超時回退。"]],"formula":"Recall@k = 前 k 個檢索結果中命中相關證據的比例（單一查詢有多個相關項時）。","code":"documents=['存款利率規範','企業網銀登入流程','房貸申請辦法']\nquery='網銀登入'\nscores=[sum(1 for ch in query if ch in doc) for doc in documents]\nprint(sorted(zip(scores,documents),reverse=True))\n# 僅為詞字匹配示範；真實系統需更嚴謹的檢索器","lab":"rag","q":[["RAG 的 Retrieval 用途？",["找到外部證據","更新模型權重","改變 CPU 架構"],0,"RAG 讓模型在推論時取得外部上下文。"],["高相似度一定代表法律有效？",["是","否，需看版本／權威／範圍","只看 Top-1 即可"],1,"相關性與可靠性、時間有效性是不同維度。"],["Hybrid Retrieval 常結合？",["BM25 與向量檢索","BatchNorm 與 Dropout","CPU 與 SSD"],0,"融合關鍵字與語義匹配。"]]},{"title":"Agent、工具呼叫與工作流程","subtitle":"規劃、觀察、狀態、記憶與安全邊界","tag":"應用系統","analogy":"把模型想成專案助理：不只回答，也可以決定何時查資料、叫計算機、提交草稿，但每一步必須有授權和驗證。","limit":"Agent 不是模型具有自主意識；多次工具呼叫增加錯誤放大、成本、權限濫用與無限循環風險。","sections":[["Agent 的基本循環","讀取目標與可用工具 → 形成下一步行動 → 呼叫工具 → 取得結果 → 更新狀態 → 判斷停止。"],["Tool calling","工具要有明確 schema、參數驗證、權限及超時控制；模型生成的參數永遠要被視為不可信輸入。"],["記憶與上下文","工作記憶來自當次上下文，長期記憶需外部儲存與治理；記憶可能過時、衝突或跨情境誤用。"],["安全與評估","定義人工核准門檻、允許的操作、最大步數、重試策略、成本上限，並評估工具成功率、正確性與總任務達成率。"]],"formula":"狀態轉移：Sₜ₊₁ = update(Sₜ, actionₜ, observationₜ)；直到 done 或達安全上限。","code":"tools={'calculator': lambda x: x*2}\nsteps=[('decide','calculator'),('call',3),('observe',6),('finish','6')]\nfor state, item in steps:\n    print(state, item)\n# 示意：真實工具需驗證參數與權限","lab":"agent","q":[["Tool output 應當視為？",["無條件可信指令","待驗證資料","系統最高權限"],1,"工具結果可能包含不可信甚至惡意內容。"],["Agent 應設定最大步數的原因？",["控制成本與無限循環","讓 LLM 必然正確","讓模型參數增加"],0,"防止失控重試與成本爆炸。"],["長期記憶與單次上下文？",["完全相同","須有額外保存與版本治理","永不需要檢索"],1,"跨 session 記憶須外部保存並處理更新、權威與失效。"]]},{"title":"評估、資料品質與安全","subtitle":"分割、漂移、洩漏、偏差與系統驗收","tag":"落地","analogy":"像是醫療器材驗收：不只看一次考試分數，也得看不同情境、失敗案例、能否追溯及長期維護。","limit":"一個漂亮的 benchmark 分數不是通用可靠性的保證；模型部署後會遇到未知資料分布。","sections":[["資料與切分策略","除隨機分割外，時間序列、群組資料和使用者資料常需要時間切分或 group split，避免相似樣本洩漏。"],["資料漂移","Covariate shift 是輸入分布改變；概念漂移可指 P(y|x) 關係變動。漂移指標需配合真實品質與業務訊號。"],["模型層與系統層","模型指標不等於產品指標。還需可靠性、延遲、成本、端到端成功率、故障復原與可追蹤性。"],["安全與可稽核","檢查敏感資訊、越權工具呼叫、提示注入、引用不實、資料授權與模型風險；不要將模型產出當成未經核對的事實。"]],"formula":"Accuracy = (TP+TN)/(TP+FP+FN+TN)；實際使用需搭配 Recall、Precision、成本與風險。","code":"actual=[1,1,0,0,0,0,0,0]\npred=[1,0,0,0,0,0,0,0]\ntp=sum(a==1 and p==1 for a,p in zip(actual,pred))\nfn=sum(a==1 and p==0 for a,p in zip(actual,pred))\nprint('recall:',tp/(tp+fn))  # 0.5","lab":"evaluation","q":[["某模型測試集很高分就能立即上線？",["是","仍需系統、安全與漂移測試","不需要監測"],1,"離線效能只是部署驗收的一部分。"],["資料洩漏常造成？",["虛高的評估成績","必然降低 Accuracy","模型容量變小"],0,"驗證或測試資訊提前被模型看到會高估泛化。"],["概念漂移可能代表？",["輸入與標籤關係改變","影像尺寸固定","參數量減半"],0,"P(y|x) 隨時間變動使舊模型失效。"]]},{"title":"SVM：最大間隔分類器","subtitle":"超平面、支援向量與 Kernel Trick","tag":"監督學習","analogy":"在兩群點之間畫一道分界線，盡量讓線到最近的兩側樣本都留有安全距離。","limit":"最大間隔不代表永遠更準確；線性 SVM 無法直接解決非線性分布，Kernel 和 C 都需要依資料調整。","sections":[["分隔超平面","二元線性分類器用 f(x)=w·x+b 的正負決定類別。幾何距離與 |w·x+b|/||w|| 有關。"],["Margin 與支援向量","硬間隔 SVM 在可線性分離時最大化最近點的幾何間隔；距離邊界最近的樣本叫支援向量。"],["軟間隔 C","允許 slack 變數容忍違反間隔的樣本。C 大代表錯誤懲罰較重；C 小偏好更寬鬆的邊界，但不保證比較好。"],["Kernel trick","多項式與 RBF kernel 讓分類器在隱含特徵空間建立非線性分界，代價是推論成本與參數調整難度。"]],"formula":"線性邊界：w·x + b = 0；點到邊界距離 = |w·x+b| / ||w||。","code":"import math\nw=[1.0,-1.0]; b=0.0\npoints=[(3,1),(1,3),(2,2)]\nfor x in points:\n    signed=(sum(a*t for a,t in zip(w,x))+b)/math.sqrt(2)\n    print(x, round(signed,3))","lab":"svm","q":[["支援向量通常位於？",["距離邊界最近的關鍵樣本","資料集中最大的數","隨機抽的測試集"],0,"它們影響分隔邊界與間隔。"],["軟間隔 SVM 的 C 越大？",["誤差懲罰通常越高","必保證測試集更準","一定讓模型更簡單"],0,"C 控制違反間隔的懲罰強度。"],["Kernel trick 主要用來？",["隱式實現非線性特徵映射","降低每筆資料到一維","把線性模型轉換成決策樹"],0,"Kernel 可計算內積而不顯式建構高維向量。"]]},{"title":"強化學習：MDP 與 Q-learning","subtitle":"狀態、動作、獎勵、折扣與探索","tag":"機器學習","analogy":"玩迷宮遊戲時，每走一步都會收到回饋；經過多次嘗試，逐漸學會從不同格子做哪個動作最好。","limit":"獎勵定義不佳會讓 Agent 學到鑽漏洞的行為；Q-learning 小表格示意不等於深度 RL 或偏好對齊。","sections":[["Markov 決策過程","MDP 包含狀態 S、動作 A、轉移 P、獎勵 R、折扣 γ。Markov 性質指下一步分布在已知目前狀態與動作後不再額外依賴更早歷史。"],["Return 與策略","策略 π(a|s) 決定如何選動作；Return 是未來獎勵的折扣總和。γ 控制對未來獎勵的重視。"],["Q-learning 更新","Q(s,a) ← Q(s,a) + α[r+γ maxₐ′Q(s′,a′) − Q(s,a)]。這是 model-free、off-policy TD learning 的經典形式。"],["探索與利用","ε-greedy 以少部分機率探索隨機動作，其餘選當前 Q 值最大動作。探索不足可能陷入錯誤策略。"]],"formula":"Q(s,a) ← Q(s,a)+α[r+γ maxₐ′Q(s′,a′)−Q(s,a)]。","code":"q = 0.0\nalpha, gamma = 0.5, 0.9\nrewards=[0,0,1,1]\nnext_best=1.0\nfor r in rewards:\n    target=r+gamma*next_best\n    q += alpha*(target-q)\n    print(round(q,3))","lab":"qlearn","q":[["Q-learning 的 TD target 為？",["r+γmax Q(s′,a′)","只有 r²","softmax(logits)"],0,"更新結合即時獎勵與下一狀態最佳動作價值。"],["γ 接近 0 時通常？",["更重視即時獎勵","更重視非常遠的未來","等於沒有狀態"],0,"較小折扣使遠期獎勵權重降低。"],["ε-greedy 的探索動作？",["有機率選隨機動作","永遠選最優","永不更新 Q"],0,"探索與利用需要平衡。"]]},{"title":"生成式視覺模型：Diffusion","subtitle":"加噪、去噪、步數與生成路徑","tag":"生成模型","analogy":"先把一張圖逐漸撒上雪花雜訊，訓練模型學會如何一步步把雜訊往有意義的圖像方向修正。","limit":"真正的擴散模型學習條件分布與噪聲估計；本實驗是固定訊號的加噪／去噪數值示範，並未訓練或執行圖像生成模型。","sections":[["正向加噪","Diffusion 的 forward process 逐步把資料變得更像已知雜訊分布。DDPM 常使用高斯雜訊與固定 variance schedule。"],["反向去噪","模型學習根據有噪聲的 xₜ 與時間 t 預測噪聲或其他等價參數化，逐步還原到資料分布附近。"],["條件生成","Text-to-image 常使用文字嵌入作條件，引導去噪過程。Classifier-free guidance 可調整文字條件強度與多樣性取捨。"],["Sampling 效率","不同 scheduler、步數、模型容量與蒸餾方法會影響延遲、細節與多樣性；少步數不一定品質足夠。"]],"formula":"xₜ = √(ᾱₜ)x₀ + √(1−ᾱₜ)ε（DDPM forward 邊際分布示意）。","code":"import math\nx0=[0,1,0,1,0]\neps=[1,-1,0.5,-0.5,1]\nalpha_bar=0.64\nxt=[math.sqrt(alpha_bar)*x+math.sqrt(1-alpha_bar)*e\n    for x,e in zip(x0,eps)]\nprint([round(x,3) for x in xt])","lab":"diffusion","q":[["擴散模型正向過程通常？",["逐步加入雜訊","直接做二分搜尋","計算 Gini"],0,"逐步加噪直到接近已知噪聲分布。"],["去噪網路學習？",["預測噪聲或相關參數","刪除訓練集","只調整 Tokenizer"],0,"透過噪聲估計等方式學習反向過程。"],["此站的加噪／去噪模擬是否是真實圖像模型？",["不是，是數值教學示意","是已訓練的生成模型","是文字到圖像 API"],0,"本教材不下載權重，也不呼叫模型服務。"]]}];

function scatterShape(points,limits=[0,6,0,6],highlight=[],labels=false){let c=colors(),s='';points.forEach((p,i)=>{let [x,y]=xy(p,limits),sel=highlight.includes(i),color=typeof p[2]==='string'?(p[2]==='A'?c.cyan:c.mint):c.blue;s+=`<circle cx="${x}" cy="${y}" r="${sel?11:7}" stroke="${sel?c.lime:'#ffffff55'}" stroke-width="${sel?3:1}" fill="${color}"/>`;if(labels)s+=`<text x="${x+12}" y="${y}" fill="${c.fg}" font-size="12">${esc(p[2])}</text>`});return s}
function lineShape(w,b,limits){let [x1,y1]=xy([limits[0],w*limits[0]+b],limits),[x2,y2]=xy([limits[1],w*limits[1]+b],limits);let c=colors();return `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c.lime}" stroke-width="3"/>`}
function barRows(labels,values,opt={}){let max=Math.max(1e-9,...values.filter(Number.isFinite).map(v=>Math.abs(v))),out='<div style="width:min(620px,100%);display:grid;gap:9px">';for(let i=0;i<labels.length;i++){let v=values[i],shown=Number.isFinite(v)?(opt.percent?`${round(v*100,2)}%`:round(v)):'−∞';out+=`<div class="vBarRow"><span>${esc(labels[i])}</span><div style="flex:1;background:var(--panel2);border-radius:5px;overflow:hidden"><div class="vBar" style="width:${Number.isFinite(v)?Math.max(1,Math.abs(v)/max*100):0}%;background:${opt.selected===i?'var(--lime)':'var(--mint)'}"></div></div><span>${esc(shown)}</span></div>`}return out+'</div>'}
function boxes(labels,active=[],done=[]){return `<div class="displayCards">${labels.map((label,i)=>`<div class="displayCard ${active.includes(i)?'active':''} ${done.includes(i)?'done':''}">${esc(label)}</div>`).join('')}</div>`}
function renderVisual(f){const d=f.data||{},type=f.kind,c=colors();
 if(type==='pipeline')return `<div class="pipeline">${(d.labels||[]).map((name,i)=>`${i?'<span style="color:var(--muted)">→</span>':''}<span class="pipeNode ${i===d.active?'active':''}">${esc(name)}</span>`).join('')}</div>${d.stopped?'<div class="small">⏸ 等待核准或達到停止條件</div>':''}`;
 if(type==='vector'){let l=[-5,5,-5,5],o=xy([0,0],l),x=xy(d.x,l),y=xy(d.y,l),sh=axes(l);sh+=`<defs><marker id="arrowA" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="${c.cyan}"/></marker><marker id="arrowB" markerWidth="9" markerHeight="9" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="${c.mint}"/></marker></defs><line x1="${o[0]}" y1="${o[1]}" x2="${x[0]}" y2="${x[1]}" stroke="${c.cyan}" stroke-width="4" marker-end="url(#arrowA)"/><line x1="${o[0]}" y1="${o[1]}" x2="${y[0]}" y2="${y[1]}" stroke="${c.mint}" stroke-width="4" marker-end="url(#arrowB)"/>`;return svgWrap(sh)+`<div class="plotLegend">x=[${d.x}]　y=[${d.y}]${d.dot!==undefined?'　Dot='+round(d.dot):''}${d.cos!==undefined?'　Cos='+round(d.cos):''}</div>`}
 if(type==='curve'){let pts=Array.from({length:81},(_,i)=>{let w=-8+i*14/80,L=(w-3)**2;return xy([w,L],[-8,6,0,144])}),p=xy([d.w,(d.w-3)**2],[-8,6,0,144]),sh=axes([-8,6,0,144])+`<polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${c.mint}" stroke-width="3"/>`+d.trail.map((w,i)=>{let [x,y]=xy([w,(w-3)**2],[-8,6,0,144]);return `<circle cx="${x}" cy="${y}" r="${i===d.trail.length-1?7:3}" fill="${i===d.trail.length-1?c.lime:c.blue}"/>`}).join('');return svgWrap(sh)+`<div class="plotLegend">w=${round(d.w)}　Loss=${round((d.w-3)**2)}</div>`}
 if(type==='scatter'){let lim=[0,6,-1,13],sh=axes(lim)+scatterShape(d.points,lim);if(d.line)sh+=lineShape(d.line.w,d.line.b,lim);return svgWrap(sh)+`<div class="plotLegend">● 真實資料　<span style="color:var(--lime)">— 預測直線</span>${d.mse!==undefined?'　MSE='+round(d.mse):''}</div>`}
 if(type==='knn'){let lim=[0,6,0,6],sh=axes(lim)+scatterShape(d.points,lim,d.selected||[],true),[x,y]=xy(d.q,lim);sh+=`<path d="M${x-10} ${y-10}L${x+10} ${y+10}M${x-10} ${y+10}L${x+10} ${y-10}" stroke="${c.lime}" stroke-width="3"/>`;return svgWrap(sh)+`<div class="plotLegend">A 青綠 · B 紫色 · × 查詢點 · 圈選最近鄰</div>`}
 if(type==='kmeans'){let lim=[0,6,0,6],sh=axes(lim)+scatterShape(d.points.map((p,i)=>[...p,d.group?.[i]===1?'B':'A']),lim);for(let j=0;j<d.centers.length;j++){let [x,y]=xy(d.centers[j],lim);sh+=`<circle cx="${x}" cy="${y}" r="13" fill="none" stroke="${j===0?c.cyan:c.mint}" stroke-width="4"/><text x="${x}" y="${y-19}" text-anchor="middle" font-size="13" fill="${c.fg}">μ${j+1}</text>`}return svgWrap(sh)+`<div class="plotLegend">◉ 群中心 · 切換初始中心再看收斂差異</div>`}
 if(type==='pca'){let lim=[0,7,0,7],sh=axes(lim)+scatterShape(d.pts,lim),mu=d.mu,u=d.u;let a=xy([mu[0]-u[0]*6,mu[1]-u[1]*6],lim),b=xy([mu[0]+u[0]*6,mu[1]+u[1]*6],lim);sh+=`<line x1="${a[0]}" y1="${a[1]}" x2="${b[0]}" y2="${b[1]}" stroke="${c.lime}" stroke-width="3" stroke-dasharray="8 5"/>`;if(d.projections)d.pts.forEach(p=>{let dot=(p[0]-mu[0])*u[0]+(p[1]-mu[1])*u[1],q=[mu[0]+u[0]*dot,mu[1]+u[1]*dot],from=xy(p,lim),to=xy(q,lim);sh+=`<line x1="${from[0]}" y1="${from[1]}" x2="${to[0]}" y2="${to[1]}" stroke="${c.muted}" stroke-dasharray="3 3"/><circle cx="${to[0]}" cy="${to[1]}" r="4" fill="${c.lime}"/>`});return svgWrap(sh)+`<div class="plotLegend">試著旋轉方向，觀察投影點分散程度</div>`}
 if(type==='bar')return barRows(d.labels,d.values,{percent:d.percent});
 if(type==='labels'){const labels=d.dataset.map(([score,label],i)=>`${i+1}. ${score.toFixed(2)} / ${label?'正':'負'}`);return boxes(labels,Array.from({length:d.processed||0},(_,i)=>i))+`<div class="infoPair">${Object.entries(d.counts).map(([k,v])=>`<div><strong>${v}</strong>${esc(k)}</div>`).join('')}</div>`}
 if(type==='split'){return boxes(d.values.map(([x,k])=>`${x} · ${k}`),d.phase>0?d.values.map((v,i)=>v[0]<=d.threshold?i:-1).filter(x=>x>=0):[])+`<div class="plotLegend">閾值 x ≤ ${round(d.threshold)}；紫色標記左側分支</div>`}
 if(type==='conv')return boxes(d.signal.map((v,i)=>`${v}`),d.at>=0?[d.at,d.at+1]:[])+`<div class="small">kernel=[${d.kernel.join(', ')}] → output: [${d.res.map(x=>round(x)).join(', ')}]</div>`;
 if(type==='rnn')return boxes(d.inputs.map((v,i)=>`x${i+1}=${v}`),d.active>=0?[d.active]:[])+`<div class="small">h: ${d.states.map(v=>round(v)).join(' → ')}</div>`;
 if(type==='attention'||type==='distribution')return barRows(d.tokens||d.names,d.values,{percent:d.mode==='prob',selected:d.selected});
 if(type==='text')return boxes(d.chunks.map((t,i)=>d.ids?`${t} → ${d.ids[i]}`:t));
 if(type==='svm'){let lim=[0,6,0,6],sh=axes(lim)+scatterShape(d.pts,lim,d.nearest||[],true);if(d.show&&Math.abs(d.wy)>.01){let p1=xy([0,-d.b/d.wy],lim),p2=xy([6,(-d.b-6*d.wx)/d.wy],lim);sh+=`<line x1="${p1[0]}" y1="${p1[1]}" x2="${p2[0]}" y2="${p2[1]}" stroke="${c.lime}" stroke-width="3"/>`;}else if(d.show){let x=xy([-d.b/d.wx,0],lim)[0];sh+=`<line x1="${x}" y1="45" x2="${x}" y2="278" stroke="${c.lime}" stroke-width="3"/>`;}return svgWrap(sh)+`<div class="plotLegend">候選超平面（線）及最近點，未最佳化 C 或 kernel</div>`}
 if(type==='qlearn'){return boxes(d.q.map((x,i)=>i===3?'終點 ★':`狀態 ${i}　Q=${round(x)}`),[d.active])+`<small class="small">只示範向右前進的 Q 值更新，不包含 epsilon-greedy 探索</small>`}
 if(type==='signed'){let v=d.values,max=Math.max(1,...v.map(Math.abs));return `<div class="signal">${v.map((x,i)=>`<div style="display:flex;flex-direction:column;align-items:center;justify-content:end;min-width:36px;height:160px"><span style="font-size:10px;color:var(--muted)">${round(x,1)}</span><div style="width:29px;height:${Math.max(3,Math.abs(x)/max*122)}px;background:${x>=0?'var(--mint)':'var(--amber)'};border-radius:5px 5px 0 0"></div><small style="font-size:10px;color:var(--muted)">${i}</small></div>`).join('')}</div><div class="small">固定數值訊號，方便觀察每步雜訊變化</div>`}
 if(type==='rank'){return `<div style="display:grid;gap:7px;width:100%">${d.rank.map((item,i)=>`<div class="displayCard ${(d.selected||[]).includes(i)?'active':''}" style="text-align:left;display:flex;justify-content:space-between;gap:12px"><span>${esc(item.name)} <small style="opacity:.8">${esc(item.date)} · ${esc(item.status)}</small></span><b>${round(item[d.mode])}</b></div>`).join('')}</div>${d.validOnly?'<small class="small">「有效」只是示意欄位；真實還需依權威、範圍與版本檢查</small>':''}`}
 return boxes([f.note]);}
function drawFrame(){const f=frames[idx];if(!f)return;$('labView').innerHTML=renderVisual(f);$('frameMsg').textContent=f.note;$('labSummary').textContent=labSummary;$('frameCounter').textContent=`STEP ${idx+1} / ${frames.length}`;$('prevFrame').disabled=idx===0;$('nextFrame').disabled=idx===frames.length-1;$('endFrame').disabled=idx===frames.length-1}
function openSide(open){$('sidebar').classList.toggle('open',open);$('backdrop').classList.toggle('show',open)}
document.addEventListener('click',e=>{const btn=e.target.closest('button');if(!btn)return;if(btn.matches('[data-nav]')){let i=+btn.dataset.nav;if(i>=0&&i<CHAPTERS.length){openSide(false);navigate(i,btn.dataset.tab||'lesson')}}else if(btn.matches('[data-tab]'))navigate(current,btn.dataset.tab);else if(btn.matches('[data-filter]')){$('courseGrid').innerHTML=cards(btn.dataset.filter);document.querySelectorAll('.filterBtn').forEach(x=>x.classList.toggle('selected',x===btn));}else if(btn.id==='menuBtn')openSide(true);else if(btn.id==='themeBtn'){document.documentElement.classList.toggle('light');try{localStorage.setItem('ailab.theme',JSON.stringify(document.documentElement.classList.contains('light')?'light':'dark'))}catch{}}else if(btn.id==='clearBtn'){if(confirm('確定清除本瀏覽器內所有章節進度、答案及筆記？')){completed={};answers={};notes={};save();renderHome();openSide(false)}}else if(btn.id==='copyCode'){let s=CHAPTERS[current].code;navigator.clipboard?.writeText(s).then(()=>btn.textContent='✓ 已複製').catch(()=>window.prompt('複製程式碼：',s))}else if(btn.matches('[data-q]')){let j=+btn.dataset.q,id=current+'-'+j,right=CHAPTERS[current].q[j][2];if(answers[id]===right)return;answers[id]=+btn.dataset.a;save();renderQuiz()}else if(btn.id==='completeBtn'){completed[current]=!completed[current];save();nav();renderQuiz()}else if(btn.id==='runLab')runLab();else if(btn.id==='prevFrame'){idx=Math.max(0,idx-1);drawFrame()}else if(btn.id==='nextFrame'){idx=Math.min(frames.length-1,idx+1);drawFrame()}else if(btn.id==='endFrame'){idx=frames.length-1;drawFrame()}else if(btn.id==='copyNotes'){let s=notes[current]||'';navigator.clipboard?.writeText(s).then(()=>btn.textContent='✓ 已複製').catch(()=>window.prompt('複製筆記：',s))}});
document.addEventListener('input',e=>{if(e.target.id==='noteText'){notes[current]=e.target.value;save();$('notesSaved').textContent='✓ 已儲存於本機'}});
$('backdrop').addEventListener('click',()=>openSide(false));window.addEventListener('hashchange',()=>{route();window.scrollTo(0,0)});route();
</script></body></html>
