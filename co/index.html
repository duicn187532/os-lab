const chapters=[{"title":"電腦結構全貌","tag":"從程式到電子訊號","idea":"程式經編譯成機器指令，由 CPU 取指、解碼、執行；資料在暫存器、快取、主記憶體與儲存裝置之間流動。ISA 是軟硬體契約，微架構是實現方法。","pitfall":"CPU 時脈快不代表程式必然快：瓶頸可能在記憶體、分支或 I/O。","formula":"T_{\\mathrm{CPU}}=IC\\times CPI\\times T_{\\mathrm{clk}}","glossary":"T_CPU：CPU 執行時間；IC：執行的指令數；CPI：每條指令平均時脈週期數；T_clk：每個時脈週期的時間。","lab":"performance","mode":"clock","labtitle":"計算一個程式的執行時間","example":"IC=10^9, CPI=1.5, clock=3 GHz 時，CPU time = 0.5 s。","quiz":[{"q":"第 1 章的核心重點是什麼？","options":["程式經編譯成機器指令，由 CPU 取指、解碼、執行","CPU 時脈快不代表程式必然快：瓶頸可能在記憶體、分支或 I/O。","只要增加時脈就能解決所有問題"],"answer":0,"why":"程式經編譯成機器指令，由 CPU 取指、解碼、執行；資料在暫存器、快取、主記憶體與儲存裝置之間流動。ISA 是軟硬體契約，微架構是實現方法。"},{"q":"關於本章模型，下列何者正確？","options":["模型完全涵蓋所有實體硬體細節","應留意適用條件與假設","符號不用定義就能比較不同公式"],"answer":1,"why":"CPU 時脈快不代表程式必然快：瓶頸可能在記憶體、分支或 I/O。"},{"q":"閱讀公式時應優先確認什麼？","options":["只背公式長相","直接代入任意單位","各符號意義、單位與公式成立條件"],"answer":2,"why":"T_CPU：CPU 執行時間；IC：執行的指令數；CPI：每條指令平均時脈週期數；T_clk：每個時脈週期的時間。"}]},{"title":"二進位與數值表示","tag":"所有資料最終都是位元","idea":"無號整數以位置權重表示；有號整數常用二補數，n 位元範圍為 −2^(n−1) 至 2^(n−1)−1。二進位加法也可能溢位。","pitfall":"位元的解釋依資料型別而異；同一串 bit 可能是整數、浮點數或指令。","formula":"N=\\sum_{i=0}^{n-1}b_i2^i","glossary":"N：無號整數值；n：位元數；b_i：第 i 位元（0 或 1）；i：從最低有效位元開始的索引。","lab":"binary","mode":"bits","labtitle":"轉換位元並觀察二補數","example":"8-bit 的 11111111₂：無號是 255；二補數有號是 −1。","quiz":[{"q":"第 2 章的核心重點是什麼？","options":["無號整數以位置權重表示","位元的解釋依資料型別而異；同一串 bit 可能是整數、浮點數或指令。","只要增加時脈就能解決所有問題"],"answer":0,"why":"無號整數以位置權重表示；有號整數常用二補數，n 位元範圍為 −2^(n−1) 至 2^(n−1)−1。二進位加法也可能溢位。"},{"q":"關於本章模型，下列何者正確？","options":["模型完全涵蓋所有實體硬體細節","應留意適用條件與假設","符號不用定義就能比較不同公式"],"answer":1,"why":"位元的解釋依資料型別而異；同一串 bit 可能是整數、浮點數或指令。"},{"q":"閱讀公式時應優先確認什麼？","options":["只背公式長相","直接代入任意單位","各符號意義、單位與公式成立條件"],"answer":2,"why":"N：無號整數值；n：位元數；b_i：第 i 位元（0 或 1）；i：從最低有效位元開始的索引。"}]},{"title":"邏輯閘與布林代數","tag":"硬體如何做判斷","idea":"AND、OR、NOT、XOR 是組合邏輯的基本元件；由真值表可以建構電路。NAND 與 NOR 都是功能完備閘。","pitfall":"邏輯閘處理的是訊號電位，不是高階程式語言的 if 敘述。","formula":"Y=(A\\land B)\\lor\\neg C","glossary":"Y：輸出位元；A、B、C：輸入位元；∧：AND；∨：OR；¬：NOT。","lab":"logic","mode":"logic","labtitle":"切換輸入檢查輸出","example":"A=1、B=0、C=0 時，Y=1。","quiz":[{"q":"第 3 章的核心重點是什麼？","options":["AND、OR、NOT、XOR 是組合邏輯的基本元件","邏輯閘處理的是訊號電位，不是高階程式語言的 if 敘述。","只要增加時脈就能解決所有問題"],"answer":0,"why":"AND、OR、NOT、XOR 是組合邏輯的基本元件；由真值表可以建構電路。NAND 與 NOR 都是功能完備閘。"},{"q":"關於本章模型，下列何者正確？","options":["模型完全涵蓋所有實體硬體細節","應留意適用條件與假設","符號不用定義就能比較不同公式"],"answer":1,"why":"邏輯閘處理的是訊號電位，不是高階程式語言的 if 敘述。"},{"q":"閱讀公式時應優先確認什麼？","options":["只背公式長相","直接代入任意單位","各符號意義、單位與公式成立條件"],"answer":2,"why":"Y：輸出位元；A、B、C：輸入位元；∧：AND；∨：OR；¬：NOT。"}]},{"title":"組合電路與加法器","tag":"從半加器到 ALU","idea":"半加器輸出 Sum 與 Carry；全加器納入輸入進位；多個全加器串接形成加法器。ALU 也能執行邏輯與比較運算。","pitfall":"電路深度會影響延遲；Ripple-carry 加法器的進位可能逐位傳播。","formula":"S=A\\oplus B\\oplus C_{\\mathrm{in}}","glossary":"S：和位元；A、B：兩個輸入位元；C_in：輸入進位；⊕：XOR（互斥或）。","lab":"adder","mode":"logic","labtitle":"觀察半加器與全加器","example":"1+1+1：Sum=1，Carry=1。","quiz":[{"q":"第 4 章的核心重點是什麼？","options":["半加器輸出 Sum 與 Carry","電路深度會影響延遲；Ripple-carry 加法器的進位可能逐位傳播。","只要增加時脈就能解決所有問題"],"answer":0,"why":"半加器輸出 Sum 與 Carry；全加器納入輸入進位；多個全加器串接形成加法器。ALU 也能執行邏輯與比較運算。"},{"q":"關於本章模型，下列何者正確？","options":["模型完全涵蓋所有實體硬體細節","應留意適用條件與假設","符號不用定義就能比較不同公式"],"answer":1,"why":"電路深度會影響延遲；Ripple-carry 加法器的進位可能逐位傳播。"},{"q":"閱讀公式時應優先確認什麼？","options":["只背公式長相","直接代入任意單位","各符號意義、單位與公式成立條件"],"answer":2,"why":"S：和位元；A、B：兩個輸入位元；C_in：輸入進位；⊕：XOR（互斥或）。"}]},{"title":"時序電路與狀態","tag":"為什麼 CPU 能記住事情","idea":"正反器在時脈邊緣保存位元；暫存器由多個正反器組成。狀態機根據當前狀態與輸入決定下一狀態。","pitfall":"組合邏輯不保存歷史；時序邏輯才有狀態。","formula":"S_{t+1}=f(S_t,X_t)","glossary":"S_t：時間 t 的狀態；X_t：當前輸入；f：狀態轉移函數；S_(t+1)：下一狀態。","lab":"fsm","mode":"fsm","labtitle":"逐拍觀察狀態機","example":"兩狀態控制器可以在 0 與 1 之間交替。","quiz":[{"q":"第 5 章的核心重點是什麼？","options":["正反器在時脈邊緣保存位元","組合邏輯不保存歷史；時序邏輯才有狀態。","只要增加時脈就能解決所有問題"],"answer":0,"why":"正反器在時脈邊緣保存位元；暫存器由多個正反器組成。狀態機根據當前狀態與輸入決定下一狀態。"},{"q":"關於本章模型，下列何者正確？","options":["模型完全涵蓋所有實體硬體細節","應留意適用條件與假設","符號不用定義就能比較不同公式"],"answer":1,"why":"組合邏輯不保存歷史；時序邏輯才有狀態。"},{"q":"閱讀公式時應優先確認什麼？","options":["只背公式長相","直接代入任意單位","各符號意義、單位與公式成立條件"],"answer":2, const $=s=>document.querySelector(s);const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state;try{state=JSON.parse(localStorage.getItem('co-lab-v1'))||{done:{},notes:{}}}catch{state={done:{},notes:{}}}const save=()=>localStorage.setItem('co-lab-v1',JSON.stringify(state));
let active=0,tab='lesson',step=0;const labState={a:4,b:2,c:8};
function nav(){let done=Object.values(state.done).filter(Boolean).length;$('#nav').innerHTML=chapters.map((c,i)=>`<a class="nav ${location.hash.startsWith('#/'+i+'/')?'on':''}" href="#/${i}/lesson">${state.done[i]?'✓':'○'} ${String(i).padStart(2,'0')} · ${escapeHTML(c.title)}</a>`).join('');$('#progress').innerHTML=`<small class="muted">已完成 ${done}/${chapters.length} 章</small><div class="progress"><div style="width:${done/chapters.length*100}%"></div></div>`}
function home(){let done=Object.values(state.done).filter(Boolean).length;$('#app').innerHTML=`<section class="hero"><div class="eyebrow">CS LAB · COMPUTER ARCHITECTURE</div><h1>CO LAB<br>計算機組織與結構</h1><p>從位元、邏輯閘、資料路徑一路走到流水線、快取、多核心與 GPU。每章都有標準數學式、符號意義、可操作實驗與理解測驗。</p><div class="stats"><span class="pill">20 章循序學習</span><span class="pill">20 類互動實驗</span><span class="pill">60 題理解測驗</span><span class="pill">已完成 ${done} 章</span></div><p><a class="btn primary" href="#/${chapters.findIndex((_,i)=>!state.done[i])<0?0:chapters.findIndex((_,i)=>!state.done[i])}/lesson">繼續學習 ↗</a></p></section><h2>完整學習地圖</h2><div class="grid">${chapters.map((c,i)=>`<a class="card" href="#/${i}/lesson"><div class="eyebrow">CHAPTER ${String(i).padStart(2,'0')} ${state.done[i]?'· 已完成':''}</div><h3>${escapeHTML(c.title)}</h3><p>${escapeHTML(c.tag)}</p><span style="color:var(--accent)">閱讀 → 實驗 → 測驗 ↗</span></a>`).join('')}</div>`}
function lesson(i){const c=chapters[i];return `<div class="section"><h2>核心觀念｜${escapeHTML(c.tag)}</h2><p>${escapeHTML(c.idea)}</p><h2>標準數學式</h2><div class="formula" role="math" aria-label="${escapeHTML(c.formula)}">${formulaSVG[i]}</div><div class="glossary"><b>符號意義與單位</b><p>${escapeHTML(c.glossary)}</p></div><h3>算例</h3><p>${escapeHTML(c.example)}</p><div class="callout"><b>常見誤解與適用條件：</b>${escapeHTML(c.pitfall)}</div><p style="margin-top:22px"><button class="btn primary" data-tab="lab">進入可操作實驗 →</button></p></div>`}
function controls(){return `<div class="controls">${[['a','參數 A',1,12],['b','參數 B',1,12],['c','參數 C',1,12]].map(([id,label,min,max])=>`<div class="control"><label>${label}：<strong id="val-${id}">${labState[id]}</strong></label><input type="range" min="${min}" max="${max}" step="1" value="${labState[id]}" data-slider="${id}"></div>`).join('')}</div><div style="display:flex;gap:9px;flex-wrap:wrap;margin-top:14px"><button class="btn primary" data-step="1">下一步 →</button><button class="btn" data-reset="1">重置步驟</button></div>`}
function lab(i){return `<div class="section"><h2>互動實驗｜${escapeHTML(chapters[i].labtitle)}</h2><p class="muted">變更參數後會立即重新計算。按「下一步」可逐步檢查中間狀態。這是教學模型，不是實際 CPU 的 cycle-accurate 模擬。</p>${controls()}<div class="output" id="output" aria-live="polite"></div><p class="muted">本章符號：${escapeHTML(chapters[i].glossary)}</p></div>`}
function calc(){const {a,b,c}=labState,kind=chapters[active].lab;let out='',detail=[];let fmt=x=>Number(x).toLocaleString('zh-TW',{maximumFractionDigits:4});const item=(name,value)=>`<div style="margin:8px 0"><strong>${escapeHTML(name)}</strong>：${escapeHTML(value)}</div>`;
if(kind==='clock'||kind==='performance'){let ic=a*1e8,cpi=b/2,ghz=c/2,time=ic*cpi/(ghz*1e9);detail=[`IC = ${fmt(ic)} 條`, `CPI = ${fmt(cpi)} 週期/指令`, `時脈 = ${fmt(ghz)} GHz`,`CPU time = ${fmt(time)} 秒`];}
if(kind==='bits'||kind==='binary'){let x=a*17,bin=x.toString(2).padStart(8,'0'),signed=x>=128?x-256:x,terms=[...bin].map((d,j)=>d==='1'?`2^${7-j}`:'').filter(Boolean);detail=[`輸入值 = ${x}`,`8-bit 二進位 = ${bin}`,`位權展開 N = Σ bᵢ2ⁱ = ${terms.join(' + ')} = ${x}`,`無號解讀 = ${x}`,`二補數有號解讀 = ${signed}`];}
if(kind==='logic'){let A=a%2,B=b%2,C=c%2;detail=[`A=${A}，B=${B}，C=${C}`,`A AND B = ${A&B}`,`NOT C = ${1-C}`,`Y = (A AND B) OR (NOT C) = ${(A&B)|(1-C)}`];}
if(kind==='fsm'){detail=[`初始狀態 = 0`,`輸入 = ${a%2}`,`轉移函數：下一狀態 = (狀態 + 輸入) mod 2`,`第 ${step} 步狀態 = ${(step*(a%2))%2}`];}
if(kind==='register'){detail=[`R1=${a}，R2=${b}`,`取指：add R3,R1,R2`,`執行：${a}+${b}`,`寫回：R3=${a+b}`];}
if(kind==='pipeline'||kind==='hazard'){let n=a,k=5,stalls=kind==='hazard'?Math.max(0,b-2)*(c%2?1:2):0;detail=[`指令數 n=${n}`,`階段數 k=${k}`,`理想完成拍數 = n+k−1 = ${n+k-1}`,`加入示意停頓 ${stalls} 拍，總計 ${n+k-1+stalls} 拍`];out=`<div class="bars">${Array.from({length:Math.min(18,n+k-1+stalls)},(_,i)=>`<div class="bar ${i===step%(n+k-1+stalls)?'hot':''}" style="height:${20+((i*7)%5)*21}px"><span>${i+1}</span></div>`).join('')}</div>`;}
if(kind==='branch'){let base=1,fb=a/100,pm=b/20,P=c;detail=[`基本 CPI=${base}`,`分支比例=${fmt(fb*100)}%`,`錯誤率=${fmt(pm*100)}%，懲罰=${P} 拍`,`額外 CPI=${fmt(fb*pm*P)}，總 CPI=${fmt(base+fb*pm*P)}`];}
if(kind==='cache'){let refs=[a,b,a,c,b,a],slots=2,cache=[],hit=0;refs.forEach((x,i)=>{let yes=cache.includes(x);if(yes)hit++;else{cache.unshift(x);cache=cache.slice(0,slots)}detail.push(`存取 ${i+1}：區塊 ${x} → ${yes?'Hit':'Miss'}；Cache=[${cache.join(', ')}]`)});detail.push(`命中率 ${fmt(100*hit/refs.length)}%`);}
if(kind==='paging'){let page=2**(a+7),addr=b*page+c;detail=[`頁面大小 P=${page} bytes`,`虛擬位址 VA=${addr}`,`VPN=floor(VA/P)=${Math.floor(addr/page)}`,`頁內偏移 O=VA mod P=${addr%page}`];}
if(kind==='bandwidth'){let size=a*8,rate=b*2;detail=[`資料量 D=${size} MiB`,`有效頻寬 BW=${rate} GiB/s`,`傳輸時間≈${fmt(size/1024/rate*1000)} ms`];}
if(kind==='amdahl'){let p=Math.min(.99,a/12),N=b,den=(1-p)+p/N;detail=[`平行比例 p=${fmt(p*100)}%`,`核心數 N=${N}`,`序列部分=${fmt((1-p)*100)}%`,`理論加速 S(N)=${fmt(1/den)} 倍`];}
if(kind==='power'){let alpha=a/12,C=b,V=c/10,f=2;detail=[`活動因子 α=${fmt(alpha)}`,`等效電容 C=${C}（相對單位）`,`電壓 V=${fmt(V)}，頻率 f=${f}（相對單位）`,`動態功耗相對值=${fmt(alpha*C*V*V*f)}`];}
if(kind==='matmul'){let m=a,k=b,n=c;detail=[`A 的維度 ${m}×${k}`,`B 的維度 ${k}×${n}`,`C 的維度 ${m}×${n}`,`傳統矩陣乘法約 ${fmt(2*m*k*n)} FLOPs`];}
if(kind==='adder'){let A=a%2,B=b%2,C=c%2;detail=[`A=${A}, B=${B}, Cin=${C}`,`S=A XOR B XOR Cin = ${A^B^C}`,`Cout=(A AND B) OR (Cin AND (A XOR B)) = ${(A&B)|(C&(A^B))}`];}
if(!detail.length)detail=['準備執行','讀取輸入','執行計算','寫回輸出'];let shown=Math.min(detail.length,step+1);$('#output').innerHTML=`<div class="eyebrow">STEP ${shown}/${detail.length}</div>${detail.slice(0,shown).map((v,i)=>item('步驟 '+(i+1),v)).join('')}${out}`}
function quiz(i){return `<div class="section"><h2>章末理解測驗</h2>${chapters[i].quiz.map((q,j)=>`<div class="quiz"><strong>${j+1}. ${escapeHTML(q.q)}</strong>${q.options.map((o,k)=>`<button class="btn choice" data-answer="${j}:${k}">${'ABC'[k]}. ${escapeHTML(o)}</button>`).join('')}<div id="feedback-${j}" class="feedback"></div></div>`).join('')}<p><button class="btn primary" data-done="1">標記本章已完成 ✓</button></p></div>`}
function notes(i){return `<div class="section"><h2>個人筆記</h2><p class="muted">儲存在目前瀏覽器的 localStorage，不跨裝置同步。</p><textarea class="notes" id="notes" placeholder="寫下你對指令、資料路徑、公式符號的理解…">${escapeHTML(state.notes[i]||'')}</textarea><p class="muted" id="saved">輸入後自動儲存</p></div>`}
function chapter(i,t){active=i;tab=t;step=0;const c=chapters[i];$('#app').innerHTML=`<div class="eyebrow">CHAPTER ${String(i).padStart(2,'0')} / 19</div><div class="chapter-head"><h1>${escapeHTML(c.title)}</h1><a class="btn" href="#/">← 課程地圖</a></div><p class="muted">${escapeHTML(c.tag)}</p><div class="tabs">${[['lesson','原理與公式'],['lab','互動實驗'],['quiz','理解測驗'],['notes','我的筆記']].map(([key,label])=>`<button class="btn ${key===t?'on':''}" data-tab="${key}">${label}</button>`).join('')}</div>${t==='lesson'?lesson(i):t==='lab'?lab(i):t==='quiz'?quiz(i):notes(i)}<div class="chapter-head"><a class="btn" href="#/${Math.max(0,i-1)}/lesson">← 上一章</a><a class="btn primary" href="#/${Math.min(chapters.length-1,i+1)}/lesson">下一章 →</a></div>`;if(t==='lab')calc()}
function render(){let m=location.hash.match(/^#\/(\d+)(?:\/(lesson|lab|quiz|notes))?/);if(m)chapter(Math.min(chapters.length-1,+m[1]),m[2]||'lesson');else home();nav();$('#side').classList.remove('open')}
document.addEventListener('click',e=>{let t=e.target.closest('[data-tab],[data-step],[data-reset],[data-answer],[data-done]');if(!t)return;if(t.dataset.tab){location.hash=`#/${active}/${t.dataset.tab}`;return}if(t.dataset.step){step++;calc();return}if(t.dataset.reset){step=0;calc();return}if(t.dataset.answer){let [j,k]=t.dataset.answer.split(':').map(Number),q=chapters[active].quiz[j],good=k===q.answer;$('#feedback-'+j).textContent=(good?'✓ 正確。':'✗ 再想想。')+' '+q.why;return}if(t.dataset.done){state.done[active]=true;save();nav();t.textContent='✓ 本章已完成';return}});
document.addEventListener('input',e=>{if(e.target.dataset.slider){labState[e.target.dataset.slider]=+e.target.value;$('#val-'+e.target.dataset.slider).textContent=e.target.value;step=0;calc()}if(e.target.id==='notes'){state.notes[active]=e.target.value;save();$('#saved').textContent='✓ 已自動儲存'}});
$('#menu').onclick=()=>$('#side').classList.toggle('open');window.addEventListener('hashchange',render);render();
</script></body></html>
